index_semantics:
  manifest_dataset_list: "indexed_datasets"
  primary_key: "indexed_datasets[].dataset_id; обычно DRIVE:<file_id>"
  native_id: "indexed_datasets[].native_dataset_id"
  actual_data_file: "indexed_datasets[].data_file.file_id / .url / .path"
  passport: "indexed_datasets[].metadata_file.file_id / .url; если имеется"
  source_catalog: "indexed_datasets[].source_catalog; либо папочный паспорт"
  route_ids: "routes[].candidate_dataset_ids; сопоставить с dataset_id манифеста"
  null_meaning: "Не документировано, не означает ноль, отсутствие или неприменимость"
  id_policy: "Использовать постоянный Google Drive ID; не искать по совпадению имени как единственному критерию."

execution_modes:
  connected_github:
    when: "Репозиторий Allishich/Agent_Allish доступен для чтения; все файлы находятся под research_data/."
    behavior: "Использовать GitHub-local paths из manifest.json, читать паспорта и CSV; Drive при необходимости для provenance или обновлений."
  connected_drive:
    when: "У GPT есть действующее чтение Google Drive от учётной записи с доступом."
    behavior: "Открывать файлы по ID, читать паспорта и исходные таблицы, сообщать реально прочитанные источники."
  uploaded_files:
    when: "Подключения к Drive нет, но пользователь загрузил конкретные файлы."
    behavior: >-
      Анализировать только фактически загруженные данные, не выдавать гиперссылки
      на недоступные документы за прочитанные источники. ZIP AI_CONTEXT
      содержит навигацию, а не все CSV/XLSX.
  no_data_access:
    when: "Нет Drive и нет исходных файлов."
    behavior: "Описать доступные по YAML темы и путь получения файлов; числовых выводов не делать."

output_contract:
  required_sections:
    - "Ответ на вопрос и предел применимости"
    - "Использованные данные: конкретные файлы и ID"
    - "Факты: период, география, единица, знаменатель, источник"
    - "Расчёты и формулы (если есть)"
    - "Гипотезы и допущения"
    - "Пробелы, риски интерпретации и следующие проверки"
  source_lineage: "GitHub CSV (или Drive URL) -> индивидуальный паспорт -> официальная публикация/таблица/страница"
  non_claims:
    - "Не утверждать, что API подключён, если есть только документация."
    - "Не утверждать, что весь источник независимо проверен, если есть лишь внутренняя QA."
    - "Не утверждать, что файл прочитан, если был доступен только его каталог."
    - "Не выдавать 43 набора статистики за универсальную базу всех рынков."

recommended_first_test:
  name: "B2B: сервис автоматизации малого бизнеса"
  prompt: >-
    Найди в общей базе официальные показатели для предварительного расчёта
    потенциального числа организаций-клиентов SaaS-сервиса в РФ. Приведи
    несколько подходящих наборов, прочитай их паспорта и CSV, перечисли
    допустимые разрезы, ограничения и отсутствующие сведения. Не называй
    зарегистрированные фирмы подтверждёнными покупателями.
  success_checks:
    - "GPT действительно получил доступ к исходным файлам и паспортам."
    - "Указаны Google Drive file_id и точные ссылки на использованные таблицы."
    - "Знаменатели, периоды и отраслевые ограничения проверены."
    - "Нет двойного счёта микро/малых компаний и вложенных регионов."
    - "Разделены фактические показатели, предварительный TAM и гипотезы."
    - "Недоступные сведения отмечены явно, без выдуманного API или спроса."

change_policy:
  data_files: "read_only_by_default"
  github: "do_not_change_until_colleague_approves"
  navigation_snapshot: "Refresh on changes; never silently overwrite existing raw data."
  secrets: "Never store passwords, tokens or licensed raw exports in GPT knowledge, chat, GitHub or public links."

repository_copy:
  github_repository: "Allishich/Agent_Allish"
  directory: "research_data"
  start_here: "research_data/START_HERE.md"
  manifest: "research_data/AI_CONTEXT/manifest.json"
  routing: "research_data/AI_CONTEXT/routing.json"
  data_glob: "research_data/datasets/**/*.csv"
  metadata_glob: "research_data/metadata/**/*.metadata.json"
  project_log_not_copied: true
  large_csv_instruction: "python research_data/tools/reconstruct_large_csv.py"
  write_policy: "Ничего не менять в main; дальнейшие обновления данных только через отдельный PR."
