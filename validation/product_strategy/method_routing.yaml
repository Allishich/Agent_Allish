    priority: conditional
    execution_type: analytical
    use_when: Правовые, технологические, экономические или иные внешние факторы существенно влияют на продажу/исполнение.
    input_gate: Рынок/география, горизонт, источники факторов, статус норм на дату проверки.
    secondary_use_in:
    - S01
    - S07
  M10:
    title: Матрица Ансоффа — выбор направлений продуктово-рыночного роста
    version: 1.0.0
    source:
      filename: 10_ansoff_matrix.yaml
      drive_id: 1C7BGJu03M0L57tNUntKZDgf7scx2MD0H
      drive_url: https://drive.google.com/file/d/1C7BGJu03M0L57tNUntKZDgf7scx2MD0H/view
