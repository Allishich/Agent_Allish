    source:
      filename: 04_competitive_benchmarking.yaml
      drive_id: 1AgPV01xY593pBhjJfkh2REm2wyCIpZTY
      drive_url: https://drive.google.com/file/d/1AgPV01xY593pBhjJfkh2REm2wyCIpZTY/view
      group: core
    home_stage: S04
    priority: base
    execution_type: analytical
    use_when: Существуют прямые конкуренты, заменители или возможность ничего не менять.
    input_gate: Сопоставимые предложения, тарифы, условия, источники; неизвестные цены не заполняются.
    secondary_use_in:
