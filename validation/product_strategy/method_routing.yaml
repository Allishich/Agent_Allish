    home_stage: S01
    priority: conditional
    execution_type: analytical
    use_when: Из вводных неясна задача клиента, триггеры смены решений или ключевые альтернативы.
    input_gate: Наблюдения/высказывания клиентов либо гипотезы с явной маркировкой; без них вывод только гипотетический.
