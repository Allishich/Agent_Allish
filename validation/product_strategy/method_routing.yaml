    home_stage: S02
    priority: conditional
    execution_type: analytical
    use_when: Нужно проверить, насколько характеристики продукта соответствуют потребностям выбранного сегмента.
    input_gate: Сегмент, задачи/выгоды/проблемы, реальные свойства продукта, свидетельства или пометки гипотез.
