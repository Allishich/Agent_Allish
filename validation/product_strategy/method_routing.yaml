    execution_type: human_research
    use_when: Для работающего продукта предложено изменение, причинный эффект которого нужно проверить.
    input_gate: Схема рандомизации, основная и защитные метрики, данные эксперимента или план запуска.
    secondary_use_in:
    - S05
  M18:
    title: Юзабилити-тестирование цифрового продукта
