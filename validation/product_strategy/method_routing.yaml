integration_notes:
  data_routing: Источники данных маршрутизируются отдельно в research_data/AI_CONTEXT/routing.json; настоящий файл выбирает
    методы, а не датасеты.
  first_stage_has_no_obligatory_method: Первый этап может оформляться по материалам интервью; M05 применяется при необходимости
    исследовать задачу клиента.
  stage_six_without_new_core_method: Для каналов продаж используем блок каналов/партнёрств M07 и результаты анализа аудитории
    и конкурентов; не придумываем двадцать вторую методику.
  human_research: M11–M19 предполагают собственные первичные данные либо требуют участия человека; анализ возможен после
    их предоставления, но не синтеза ответов.
  current_product_metrics: M20 и M21 являются аналитическими после загрузки внутренних продуктовых данных.
  strategic_choice: В S07 сохранять варианты «оставить как есть» и «отказаться от направления/закрыть», наряду с содержательной
    инициативой развития.
