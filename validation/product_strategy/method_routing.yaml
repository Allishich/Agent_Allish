    home_stage: S07
    priority: conditional
    execution_type: analytical
    use_when: Рассматривается развитие существующего продукта на текущем или новом рынке.
    input_gate: Текущее определение продукта и рынка, варианты расширения, ограничения.
    secondary_use_in:
    - S03
    - S06
  M11:
