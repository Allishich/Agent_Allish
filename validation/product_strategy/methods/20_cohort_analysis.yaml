meta:
  schema_version: '1.0'
  method_id: M20
  slug: cohort_analysis
  title: Когортный анализ цифрового продукта
  language: ru
  version: 1.0.1
  prepared_on: '2026-11-21'
  method_family: Анализ поведения и удержания
  method_group: existing_product
  document_status: самостоятельная прикладная методика, не отчёт о продукте
  reuse_policy: Самостоятельное изложение классического метода; тексты сторонних SKILL.md не копируются.
role:
  goal: Определить, как меняется удержание, использование или выручка групп пользователей/клиентов, впервые
    пришедших в разные периоды.
  decision_question: У каких когорт, сегментов и этапов есть признаки ухудшения или улучшения удержания?
  applicability:
  - Работающий продукт с устойчивыми user/account ID и событиями
  - Подписной сервис с историей платежей
  - Оценка качества привлечённых клиентов по периодам
  not_applicable_when:
  - Нет идентификаторов и дат вступления в когорту
  - События/статусы меняли определения без возможности восстановления истории
  autonomy: Самостоятельный метод; не требует применения остальных 20 методов.
  scope_boundary: Продуктовая стратегия цифрового продукта для российского рынка; не медиаплан, не копирайтинг,
    не разработка рекламной кампании.
theory:
  concepts:
  - term: Когорта
    meaning: Группа объектов, определённая по общему событию входа (например, первая активация или первая оплата)
      в одном периоде.
  - term: Retention
    meaning: Доля исходной когорты, выполнившая заранее определённое событие в периоде возраста когорты.
  - term: Right censoring
    meaning: Новые когорты ещё не могли прожить все интервалы; незавершённые периоды не считаются нулевым удержанием.
  formulas:
  - name: Удержание по возрасту когорты
    expression: retention(c,t) = active_entities_in_cohort_c_at_age_t / entities_in_cohort_c_at_entry
    preconditions: Явное определение активности; одинаковая единица объекта и законченный период t.
  - name: GRR для платёжной когорты
    expression: GRR = (starting_MRR - contraction_MRR - churned_MRR) / starting_MRR
    preconditions: Когорта/период, отсутствие учёта expansion, starting_MRR>0.
  - name: NRR для платёжной когорты
    expression: NRR = (starting_MRR - contraction_MRR - churned_MRR + expansion_MRR) / starting_MRR
    preconditions: Определены и сопоставимы компоненты, starting_MRR>0.
input_contract:
  minimum:
  - Устойчивый ID пользователя или платящего аккаунта
  - Дата первой регистрации/активации/оплаты
  - Определение активности либо оплаты
  - События с датами и статусом
  - Длина периода когорты и окна измерения
  optional:
  - План/тариф, канал или отрасль при надёжном происхождении
  - Платежи для revenue-retention
  - История возвратов и отмен
  public_data_role: Общедоступная статистика не содержит когорт продукта; нужны внутренние события или платёжные
    записи.
expert_instruction:
  purpose: 'Краткая инструкция человеку: выполнить только недоступные консультанту действия и передать исходные
    сведения.'
  steps:
  - step: 1
    action: 'Уточнить единицу анализа: человек, организация или платящий аккаунт; что означает первое событие
      входа.'
  - step: 2
    action: Предоставить таблицу ID × событие × время либо историю оплаты с достаточной длительностью наблюдения.
  - step: 3
    action: Отметить миграции ID, дубликаты, тестовые аккаунты, возвраты и изменения определения события.
  - step: 4
    action: Передать окно наблюдения, календарь релизов и правила, по которым активность считается удержанием.
  minimum_record_fields:
  - entity_id_pseudonymous
  - entity_type
  - cohort_entry_event
  - cohort_entry_timestamp
  - activity_or_payment_timestamp
  - activity_type
  - amount_if_revenue
  - currency
  - cancellation_or_refund
  - product_version
  - data_extraction_window
  data_transfer_rule: Предавать исходные записи/таблицы и определения полей с информацией о способе сбора, периоде,
    пропусках и ограничениях. По возможности псевдонимизировать людей и организации; доступ к исходникам ограничить.
analytical_procedure:
  quality_checks_before_analysis:
  - Один пользователь/аккаунт не должен незаметно попадать в разные когорты одной модели.
  - Периоды должны быть сопоставимыми; месячный и 30-дневный retention не смешивать.
  - Возраст когорты и правое цензурирование обрабатываются корректно.
  - Проверить реконструкцию истории после смены аналитики или платёжной системы.
  steps:
  - Сформировать когорты по событию входа и посчитать их исходные размеры.
  - Для каждого возраста когорты оценить действующих пользователей/аккаунты и удержание; незрелые клетки оставить
    null.
  - При денежных данных раздельно оценивать GRR и NRR по заранее согласованным определениям; учитывать возвраты
    и expansion.
  - Сравнить когорты и сегменты с указанием знаменателей и возможного влияния релизов и сезонности.
russian_digital_market: Для российского B2B SaaS разделить юридическую организацию, договор, рабочее место и
  отдельного пользователя. Учитывать ежегодные лицензии, разовые платежи, продления через интеграторов и варианты
  on-premise, где продуктовые события могут не поступать централизованно.
interpretation_rules:
- Разница между когортами не доказывает причинный эффект релиза.
- Нулевая активность без телеметрии on-premise не всегда означает отток.
- Большая доля новых клиентов может скрывать плохое удержание старых при анализе агрегата.
quality_control:
  execution_clarifications:
    - "До расчёта фиксировать событие входа в когорту, единицу учёта, длительность периода, окно наблюдения, определение активности, правила исключения ботов/тестовых записей, реактивации и обработки неполного наблюдения."
    - "Logo retention периода t = число активных из исходной когорты на t / размер исходной когорты; реактивировавшиеся пользователи той же когорты учитываются в активности t, если выбран периодный retention, а continuous retention указывается отдельно. Незрелые периоды = null, подтверждённое отсутствие активности = 0."
    - "Для денежных B2B-когорт при одинаковых периодах и единицах: GRR = (начальная выручка − churn − contraction)/начальная выручка; NRR = (начальная выручка − churn − contraction + expansion)/начальная выручка. Новая выручка клиентов, которых не было в начальной когорте, исключается; при нулевом знаменателе значение null."
  common_gates:
  - У исследования есть конкретный вопрос и решение, для которого собираются данные.
  - Источник каждого вывода прослеживается до исходного наблюдения, анкеты или расчёта.
  - Ненаблюдаемые величины, гипотезы и ограничения явно маркируются; недостающее не подменяется выдуманными
    значениями.
  - Не переносить результаты нерепрезентативной выборки на всё население или рынок России.
  - При обработке персональных данных определить законное основание, минимизацию состава данных, права участников,
    безопасность и сроки хранения.
  completion_gates:
  - У исходных записей установлены единица наблюдения, дата, источники и условия измерения.
  - Показатели воспроизводимы; знаменатели и исключения записаны.
  - Применение метода не подменяется предположениями, когда требуется внешний сбор.
  - Честно записаны ограничения причинности, выборки и переносимости результатов.
