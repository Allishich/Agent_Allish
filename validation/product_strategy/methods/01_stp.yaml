  external_data_candidates:
  - 'ФНС: реестр МСП для границ B2B и классификации субъектов'
  - 'Росстат: отрасль, размер, цифровая активность'
  - Публичные страницы реальных конкурентов и условия поставки
  data_use_rule: |-
    Указанные наборы «Рыночного агента» являются кандидатами, а не готовыми значениями. По каждому необходимы доступ к CSV, паспорт, первоисточник, проверка охвата, года и знаменателя; использовать только действительно совместимые наблюдения. Статистика 2020–2024 и публикации 2025 года не должна представляться как измерение 2026 года.
procedure:
- step: 01.1 Границы
  procedure: |-
    Зафиксировать единицу: человек, домохозяйство, компания, площадка или платящая учетная запись. Определить продуктовую категорию, рынок РФ/субъекты, период, B2B/B2C/B2G и реальные случаи использования. Отделить пользователя от покупателя.
  verification: |-
    Проверить отсутствие смешения числителя разных единиц, например филиалов и юрлиц.
  output: market_definition
- step: 01.2 Выбор признаков
  procedure: |-
    Выбрать 2–4 признака, причинно связанные с задачей и доступностью продукта: для B2B отрасль×масштаб, цифровая зрелость, тип закупки; для B2C возраст, ситуация пользования, цифровые навыки. Для каждого описать допустимые значения и источник.
  verification: |-
    Признак должен быть измерим либо помечен гипотезой; избегать псевдосегментов по красивым маркетинговым названиям.
  output: segmentation_variables
- step: 01.3 Матрица сегментов
  procedure: |-
    Составить таблицу сегмент × значение признаков × численность/доля × период × источник. Если признаки доступны только по отдельности, оставить совместный разрез неизвестным: не реконструировать кросс-табуляцию перемножением долей без доказанной независимости.
  verification: |-
    Сумма взаимоисключающих сегментов равна совместимому итогу в пределах точности. Для пересекающихся групп суммирование запрещено.
  output: segments_table
- step: 01.4 Потребности
  procedure: |-
    Для каждого сегмента описать задачу клиента, текущую альтернативу, частоту и последствия проблемы, покупателя и типовой путь приобретения. Неподтверждённые характеристики — гипотезы.
  verification: |-
    Потребность не следует из отраслевого ОКВЭД или цифровой грамотности сама по себе.
  output: segment_need_profiles
- step: 01.5 Привлекательность
  procedure: |-
    Сопоставить размер, тенденции, доступность, интенсивность конкуренции, стоимость обслуживания, организационные ограничения. Не требовать общей балльной оценки; если баллы используются, зафиксировать шкалы и источники, провести проверку чувствительности.
  verification: |-
    Нельзя подменять измерение спроса численностью предприятий; отдельно отметить отсутствующую готовность платить.
  output: segment_attractiveness
- step: 01.6 Выбор целей
  procedure: |-
    Показать 1–3 приоритетных сегмента и невыбранные альтернативы, включая критерии исключения. Зафиксировать критерии выбора в понятных для эксперта терминах.
  verification: |-
    Решение должно измениться при изменении критического допущения; зафиксировать это допущение.
  output: target_segments
- step: 01.7 Продуктовое позиционирование
  procedure: |-
    Описать для каждого выбранного сегмента: текущую альтернативу, категорию продукта, ключевой измеримый результат использования, подтверждённое отличие и главную непроверенную предпосылку. Не создавать коммуникационное сообщение.
  verification: |-
    Отличие подтверждать характеристиками продукта/сравнением, не эпитетами «лучший», «уникальный».
  output: positioning_hypotheses
- step: 01.8 Проверка границ
  procedure: |-
    Представить то, что сегментация не доказывает: возможность платного спроса, покупательские мотивы, соответствие потребностей и наличие бюджета. Назначить процедуру добора недостающих данных.
  verification: |-
    У неизвестных величин статус missing, а не ноль.
  output: gaps_and_checks
russian_digital_market: |-
  Российская статистика часто построена по ОКВЭД2 и группам размера предприятия; фактический клиент ПО может принадлежать нескольким отраслям и иметь множество филиалов. Регистр ФНС МСП и статистические обследования Росстата описывают разные совокупности. Для B2G дополнительно анализируется режим закупки. Для цифрового продукта релевантны язык интерфейса, доступность зарубежных SaaS, on-prem, интеграции с российским ПО, условия обработки данных. Региональные и национальные доли цифровизации не должны механически переноситься на конкретные группы без совпадающего знаменателя.
interpretation_rules: |-
  Высокая доля интернет-пользователей подтверждает инфраструктурную возможность, но не готовность платить. Отраслевая регистрация сообщает наличие хозяйствующих субъектов, но не количество потенциальных лицензий. Продуктовое позиционирование — проверяемая гипотеза о результате и отличии для сегмента; не готовое рекламное сообщение.
quality_control:
  global_data_checks:
  - Проверять существование исходного файла, dataset_id, паспорт и версию; каталог сам по себе не подтверждает значения.
  - 'Сопоставлять единицу наблюдения: компания, ИП, субъект МСП, домохозяйство, человек или пользователь 15+.'
  - Проверять дату, территорию, классификатор, числитель, знаменатель и охват выборки перед соединением таблиц.
  - При суммировании регионов исключать пересечения территорий и вложенные автономные округа; предпочитать национальный
    итог издателя.
  - Не объединять доли из разных генеральных совокупностей без отдельного, проверяемого обоснования.
  - Отличать отсутствие данных от числового нуля; не восстанавливать несуществующие совместные разрезы.
  - Помечать синтетические примеры как учебные, выводы и оценки — по уровню подтверждения.
  - Не утверждать существование работающего внешнего коннектора только потому, что источник описан в каталоге.
  method_specific:
  - Определены одинаковые единицы наблюдения и период у численностей
  - Обоснована возможность собрать совместный разрез для каждого сегмента
  - Идентифицированы несовместимые B2B/B2C источники
  - Проверено, что данные 15+ не распространены на несовершеннолетних
  - Показаны альтернативы и причина выбора целевого сегмента
  anti_patterns:
  - Сегментация «все компании России» без связи с задачей
  - Кросс-табуляция из независимых маргинальных долей без проверки
  - Суммирование микро и малых при включении одних в другие
  - Позиционирование только на основании самоописания компании
  - Объединение пользователей и плательщиков
  stop_if: 'Не выводить численное заключение, если требуется отсутствующая генеральная совокупность, база пересчета,
    существенный коэффициент или независимое подтверждение: пометить результат partial/hypothesis_only/insufficient_data.'
structured_analytical_result:
  note: Схема результата — перечень логических полей, не самостоятельная JSON Schema; значения формируются при реальном
    применении.
  top_level_required:
  - method_id
  - case_id
  - analysis_date
  - product_context
  - status
  - inputs_used
  - outputs
  - evidence_register
  - assumptions_and_gaps
  - interpretation
  - quality_checks
  - expert_decision_required
  method_fields:
  - field: market_boundary
    type: object
    required: true
  - field: segmentation_variables
    type: array[object]
    required: true
  - field: segments
    type: array[{segment_id,definition,observed_size,unit,period,source_ids,needs,access_constraints,evidence_grade}]
    required: true
  - field: selected_targets
    type: array[{segment_id,rationale,assumptions,alternatives}]
    required: true
  - field: positioning_hypotheses
    type: array[{segment_id,alternative,customer_outcome,differentiator,evidence_ids}]
    required: true
  - field: missing_joint_distributions
    type: array[text]
    required: true
  evidence_standard:
    record_type: evidence
    required_fields:
    - 'evidence_id: уникальный ID'
    - 'claim_or_parameter_id: идентификатор вывода/параметра'
    - 'evidence_type: observed_fact | computed | interpretation | assumption | expert_assertion'
    - 'source_title: первоисточник или файл эксперта'
    - 'source_url_or_file_id: прямой путь/ID либо null с причиной'
    - 'dataset_id_and_version: если использован локальный набор'
    - 'date_observed_or_published: исходный год/дата'
    - 'retrieved_at: дата обращения, если внешняя веб-страница'
    - 'geography_and_population: географический охват, совокупность и знаменатель'
    - 'value_unit_formula_filters: значение, единица, формула и фильтры по возможности'
    - 'limitations: методические ограничения, в том числе наличие/отсутствие независимой проверки'
    integrity_rule: |-
      Ни один существенный численный вывод не должен существовать только как текст без ссылки на исходные показатели; предположения, суждения эксперта и наблюдаемые факты не являются одним типом доказательства. Нельзя присваивать статистический статус маркетинговым догадкам. Нельзя выдумывать цену, долю рынка, интервью, цитату, количественную частоту потребности или конверсию.
  status_values:
  - value: complete_with_evidence
    meaning: все существенные шаги проведены; источники и ограничения доступны
  - value: partial
    meaning: проведена подтвержденная часть; неопределенности и пробелы указаны
  - value: hypothesis_only
    meaning: получена проверяемая модель или гипотеза, но нет необходимых наблюдений
  - value: insufficient_data
    meaning: без ключевых данных выполнение метода недостоверно
  - value: not_applicable
    meaning: метод неприменим к задаче; причина записана
  serialization_policy: Числа как числа, не строки; отдельно валюты, периоды, единицы, знаменатели; null при неизвестном
    значении; дата и URL исходного источника; никаких фабрикованных данных
worked_example:
  is_synthetic: true
  case: Условный SaaS для учёта заявок на техобслуживание
  inputs:
  - 'Сегменты: малые предприятия пищевого производства и небольшие сервисные подрядчики'
  - Из совместимого исследования есть число обследованных малых фирм по отдельным отраслям, но нет пересечения «отрасль
    × регион × зрелость»
  procedure:
  - Взять доступное число предприятий по подтверждённым секциям и отделить от используемых цифровых инструментов.
  - 'Для двух сегментов описать разные задачи: управление ремонтом собственного оборудования и выполнение внешних заявок.'
  - Отметить неизвестный регионально-отраслевой совместный сегмент как null, а не рассчитать его по произведению долей.
  - Предложить отдельную проверку закупщика и типовой стоимости отказа оборудования.
  output: Две карточки сегментов, ограничения численности, разные JTBD-гипотезы, выбор приоритетного сегмента остаётся
    за экспертом.
  not_real_data_warning: Все примерные решения являются иллюстрациями, числовая оценка рынка не произведена.
