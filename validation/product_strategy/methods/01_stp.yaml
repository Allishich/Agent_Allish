meta:
  schema_version: '1.0'
  method_id: M01
  slug: stp
  title: STP — сегментирование, выбор целевого рынка и продуктовое позиционирование
  language: ru
  version: 1.0.0
  prepared_on: '2026-11-21'
  method_family: Стратегия целевых клиентов
  document_status: полная методологическая спецификация; не отчет по конкретному продукту
  editorial_license_note: Оригинальное изложение общепринятых методов; тексты SKILL.md Dean Peters не воспроизводятся
role:
  goal: |-
    Сформировать воспроизводимую карту групп покупателей, выбрать обоснованные целевые сегменты и задать конкурентное продуктовое позиционирование. Позиционирование здесь — выбор категории, ценности и альтернатив, а не разработка рекламного слогана.
  questions:
  - Кого именно можно считать потенциальным покупателем и пользователем?
  - Какие сегменты различаются по потребности, способности купить и доступности?
  - Чем предлагаемый продукт отличается от заменителей в целевом сегменте?
  applicability:
  - Новая цифровая идея
  - Смена рыночного сегмента
  - Расширение B2B/B2C продукта
  - Анализ неоднородного спроса
  not_applicable_when:
  - Нет определения продукта или задачи клиента даже на уровне гипотезы
  - Требуется только диагностика конкретной ошибки интерфейса
  mode: Самостоятельный метод; не требует выполнения других 9 методов
  scope_boundary: |-
    Предмет — продуктовая стратегия цифрового продукта для российского рынка. Выбор каналов продвижения, медиаплан и коммуникационные сообщения не являются результатом данного метода. Метод не принимает решений за эксперта: фиксирует варианты и их фактическую обоснованность.
theory:
  concepts:
  - term: Segmentation
    meaning: Разбиение доступной совокупности на однозначно описываемые группы с различимым поведением/потребностями.
  - term: Targeting
    meaning: Выбор одной или нескольких групп по привлекательности и возможности их обслужить.
  - term: Positioning
    meaning: Основание для восприятия продукта относительно альтернатив конкретным клиентом; продуктовые свойства и выгодное
      отличие.
  - term: Критерии добротного сегмента
    meaning: Измеримость, достаточный размер, доступность, различимость, пригодность к практическим действиям.
  - term: Buyer/User split
    meaning: Для B2B отделять пользователя, экономического покупателя, ИТ/ИБ и инициатора закупки.
  formulas:
  - name: Число объектов сегмента
    expression: N_s = count(objects with all verified segment predicates)
    units: объектов / период
    conditions: |-
      Только если доступна совместная таблица с совместимым охватом, без двойного счёта.
    interpretation: |-
      Численность сегмента, не величина рыночного спроса.
  - name: Доля сегмента
    expression: share_s = N_s / N_base
    units: доля (0..1)
    conditions: |-
      N_base соответствует той же совокупности и периоду; сегменты могут перекрываться.
    interpretation: |-
      Доля выбранной совокупности, не доля покупки.
input_contract:
  mandatory:
  - field: definition_of_product
    definition: Категория ПО, решаемый процесс, основные функции, форма поставки
    data_type: text
    preferred_source: Эксперт / продуктовые документы
    if_missing: Зафиксировать отсутствие; не подменять догадкой
  - field: market_population
    definition: Кого и в какой географии допустимо считать потенциальной совокупностью
    data_type: text
    preferred_source: Росстат / ФНС / первичные данные
    if_missing: Зафиксировать отсутствие; не подменять догадкой
  - field: segmentation_basis
    definition: Признаки и определения категорий сегментов, непересекаемость/перекрытия
    data_type: text
    preferred_source: Эксперт и паспорт источника
    if_missing: Зафиксировать отсутствие; не подменять догадкой
  - field: observable_segment_counts
    definition: Численность либо доли сегментов с единицей наблюдения, периодом и знаменателем
    data_type: array[number,segment,units,period]
    preferred_source: Только статистика совместимого охвата
    if_missing: Сегмент описывается качественно; количественная оценка null
  helpful:
  - field: behavior_or_need
    definition: Проверенные различия по проблемам, частоте задачи и препятствиям
    data_type: text
    preferred_source: Интервью, исследования клиентов
    if_missing: Зафиксировать отсутствие; не подменять догадкой
  - field: ability_to_purchase
    definition: Бюджет, цикл закупки, полномочия, экономический эффект
    data_type: text
    preferred_source: Сведения организации и интервью
    if_missing: Зафиксировать отсутствие; не подменять догадкой
  - field: competitive_options
    definition: Конкретные заменители и альтернативы для каждого сегмента
    data_type: text
    preferred_source: Публичные продуктовые страницы/опросы
    if_missing: Зафиксировать отсутствие; не подменять догадкой
  - field: product_constraints
    definition: Языки, on-prem, интеграции, информационная безопасность, стоимость поддержки
    data_type: text
    preferred_source: Эксперт
    if_missing: Зафиксировать отсутствие; не подменять догадкой
  expert_inputs:
  - Описание продукта
  - Наблюдения о клиентах и закупках
  - Ресурсные ограничения на обслуживание сегментов
