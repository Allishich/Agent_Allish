meta:
  schema_version: '1.0'
  method_id: M02
  slug: tam_sam_som
  title: 'Размер рынка: фактический рынок, TAM, SAM, SOM'
  language: ru
  version: 1.0.0
  prepared_on: '2026-11-21'
  method_family: Количественная рыночная оценка
  document_status: полная методологическая спецификация; не отчет по конкретному продукту
  editorial_license_note: Оригинальное изложение общепринятых методов; тексты SKILL.md Dean Peters не воспроизводятся
role:
  goal: |-
    Развести подтвержденный оборот существующего рынка и потенциальные уровни спроса; представить воспроизводимую модель размерности рынка, доступной части и достижимых продаж в определённом горизонте с явными источниками каждого параметра.
  questions:
  - Каков измеренный денежный/натуральный объём определённой категории сейчас?
  - Какова верхняя граница потенциального спроса при полной достижимости?
  - Какую часть можно обслужить имеющимся продуктом?
  - Что можно реалистично продать с указанными ресурсами и ограничениями?
  applicability:
  - Вывод цифрового продукта на рынок
  - Решение о размере инвестиции
  - Сопоставление продуктовых ниш
  - Проверка экономической реалистичности гипотезы
  not_applicable_when:
  - Внутренний цифровой сервис без рынка внешних покупателей
  - Нет определения категории, покупателя и единицы цены даже условно
  mode: Самостоятельный метод; не требует выполнения других 9 методов
  scope_boundary: |-
    Предмет — продуктовая стратегия цифрового продукта для российского рынка. Выбор каналов продвижения, медиаплан и коммуникационные сообщения не являются результатом данного метода. Метод не принимает решений за эксперта: фиксирует варианты и их фактическую обоснованность.
theory:
  concepts:
  - term: Observed market
    meaning: Фактически совершенные продажи по согласованной категории, территории и году; не эквивалент TAM.
  - term: TAM
    meaning: Ограниченная и определённая моделью максимальная совокупность годового спроса для выбранной продуктовой
      задачи.
  - term: SAM
    meaning: Часть TAM, которую продукт может обслужить с учётом требований, отраслей, ограничений и доступности.
  - term: SOM
    meaning: Достижимые продажи на заданном горизонте с проверяемыми ограничениями каналов и ресурсов.
  - term: Top-down cross-check
    meaning: Независимая проверка оценки через опубликованный рынок схожей категории, не замена bottom-up.
  - term: Scenario vs evidence
    meaning: Сценарный коэффициент допустим только под явным допущением; не превращать в наблюдаемую долю.
  formulas:
  - name: Натуральная верхняя база
    expression: N_TAM = sum(non_overlapping eligible paying units)
    units: платящие единицы
    conditions: |-
      Не сумма всех зарегистрированных организаций; каждая единица должна соответствовать модели оплаты.
    interpretation: |-
      Верхняя граница количества потенциальных покупательских единиц.
  - name: Bottom-up денежный TAM
    expression: TAM_year = sum_over_segments(N_s * transactions_per_year_s * net_price_per_transaction_s)
    units: рублей/год
    conditions: |-
      Однородная база, оплаченная единица и цена; не учитывать налоги/скидки непоследовательно.
    interpretation: |-
      Расчётная потенциальная выручка при охвате всех релевантных единиц в пределах определения.
  - name: SAM
    expression: SAM_year = sum_over_served_segments(eligible_units_s * annual_revenue_per_unit_s)
    units: рублей/год
    conditions: |-
      Не использовать долю без подтверждения пересечения фильтров.
    interpretation: |-
      Экономически доступная часть исходной совокупности.
  - name: SOM снизу вверх
    expression: SOM_year = min(qualified_leads * win_rate * realized_annual_value, deployment_capacity * realized_annual_value)
    units: рублей/год
    conditions: |-
      Все множители измерены за совместимый горизонт; учитывается цикл сделки и доступная выручка в году.
    interpretation: |-
      Не гарантированная выручка; при неподтвержденных коэффициентах сценарий.
input_contract:
  mandatory:
  - field: product_market_definition
    definition: Категория цифрового продукта и границы решаемой задачи
    data_type: text
    preferred_source: Эксперт, тариф и аналоги
    if_missing: Зафиксировать отсутствие; не подменять догадкой
  - field: unit_of_sale
    definition: Лицензия/рабочее место/компания/месяц/транзакция/объём использования
    data_type: text
    preferred_source: Эксперт и проверенная бизнес-модель
    if_missing: Зафиксировать отсутствие; не подменять догадкой
  - field: base_population_N
    definition: Число потенциально релевантных единиц, год, территория, фильтры
    data_type: nonnegative_integer
    preferred_source: Паспортизованная статистика/реестр
    if_missing: Денежный TAM не вычисляется
  - field: annual_price_or_spend
    definition: Цена и период на одну платящую единицу с валютой и условиями
    data_type: money_per_unit_per_year
    preferred_source: Проверенные тарифы, счета или сценарная гипотеза
    if_missing: Числовая денежная оценка null; можно дать натуральную
  - field: sam_filter_logic
    definition: Ограничения доступности по совместимым, не перекрывающимся критериям
    data_type: text
    preferred_source: Исходные данные, технические и правовые требования
    if_missing: SAM оставляется как диапазон/неизвестное
  - field: som_capacity_model
    definition: Проверяемая пропускная способность продаж и обслуживания, горизонт
    data_type: text
    preferred_source: CRM/план продаж, эксперт
    if_missing: SOM неизвестен; не подменять долей 1–5%
  helpful:
  - field: competitor_market_actuals
    definition: Рыночный оборот или выручка сопоставимых продуктовых категорий
    data_type: text
    preferred_source: Отчётность, отраслевые исследования
    if_missing: Зафиксировать отсутствие; не подменять догадкой
  - field: conversion_and_retention
    definition: Исторические конверсии, удержание, продажи и воронка
    data_type: text
    preferred_source: Собственные продуктовые данные
    if_missing: Зафиксировать отсутствие; не подменять догадкой
  - field: reachable_accounts
    definition: Список достижимых компаний или верифицированная оценка адресуемых аккаунтов
    data_type: text
    preferred_source: CRM и отраслевые списки
    if_missing: Зафиксировать отсутствие; не подменять догадкой
  - field: inflation_and_fx
    definition: Дефлятор/курс при сопоставлении разных периодов и валют
    data_type: text
    preferred_source: Официальные показатели
    if_missing: Зафиксировать отсутствие; не подменять догадкой
