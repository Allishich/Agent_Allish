  external_data_candidates:
  - 'ФНС МСП/Росстат: только совместимые единицы учёта'
  - Отчётность аналогов и опубликованные тарифы (фактические условия)
  - Результаты продаж и финансовая отчётность компании-эксперта
  data_use_rule: |-
    Указанные наборы «Рыночного агента» являются кандидатами, а не готовыми значениями. По каждому необходимы доступ к CSV, паспорт, первоисточник, проверка охвата, года и знаменателя; использовать только действительно совместимые наблюдения. Статистика 2020–2024 и публикации 2025 года не должна представляться как измерение 2026 года.
procedure:
- step: 02.1 Измеряемая категория
  procedure: |-
    Зафиксировать продукт, единицу платящего спроса, территорию, год, режим продажи и рассматриваемый горизонт SOM. Составить список включённых/исключённых продуктов. Отдельно назвать «фактический рынок» и «потенциальный рынок».
  verification: |-
    Если категория не соотносится с опубликованной статистикой, не выдавать широкий ИТ-рынок за рынок продукта.
  output: market_scope
- step: 02.2 Факт продаж
  procedure: |-
    По возможности получить наблюдаемый объём продаж релевантного класса ПО/услуги и правила его расчёта. Различить выручку, оплаченные контракты, бюджеты и отраслевые расходы, учесть НДС при сравнении цен.
  verification: |-
    Выручка поставщиков и бюджеты покупателей не должны механически складываться; проверять выборку и отсутствие двойного счёта.
  output: observed_market
- step: 02.3 Bottom-up TAM
  procedure: |-
    Определить совместимую численность релевантных платящих единиц N, частоту приобретения и годовую плату. Если продукт продаётся на рабочие места, N — не компании: нужно отдельно оценить количество лицензируемых мест на компанию.
  verification: |-
    Не применять цену без единицы «на что, за какой срок». Не использовать национальную долю при отсутствии совпадающего знаменателя.
  output: tam_model
- step: 02.4 SAM
  procedure: |-
    Наложить измеримые ограничения доступности: сектор, тип организации, техническая совместимость, география, требования закупок и локализации. Предпочитать прямой подсчёт пересечения критериев; при отсутствии совместного распределения получить верхние/нижние границы или оставить null.
  verification: |-
    Не перемножать независимые на вид коэффициенты доступности без статистического основания независимости. Контролировать SAM <= TAM на сопоставимой основе.
  output: sam_model
- step: 02.5 SOM
  procedure: |-
    Описать цепочку «адресуемые аккаунты → контакты → квалифицированные лиды → контракты → активные/оплаченные». Использовать наблюдаемые показатели либо диапазоны гипотез с объяснением; ограничить оценку продажами, мощностями внедрения, поддержкой и сроком.
  verification: |-
    При отсутствии проверенной пропускной способности выдавать модель с неизвестными параметрами, а не «возьмём 3% SAM».
  output: som_capacity_model
- step: 02.6 Независимая проверка
  procedure: |-
    Сопоставить bottom-up с реальной выручкой сравнимых решений, отраслевым исследованием или агрегированными закупками. Различать сегменты, лицензии и периоды. Зафиксировать расхождение, не усреднять несовместимые рынки.
  verification: |-
    При существенном расхождении расследовать несовпадающую категорию/цену/базу, не скрывать расхождение.
  output: cross_check
- step: 02.7 Сценарии и чувствительность
  procedure: |-
    Для 2–4 наиболее неопределённых параметров сделать консервативный, базовый и оптимистичный сценарии; рассчитать диапазон, отдельно показать исходные факты и гипотезы. Проверить влияние каждого входа на результат.
  verification: |-
    Сценарии не являются вероятностным прогнозом без калибровки вероятностей.
  output: scenarios
- step: 02.8 Аналитический вывод
  procedure: |-
    Вернуть натуральные и денежные диапазоны, отдельно зафиксировать невозможность оценки отсутствующих уровней. Показать источники, формулы, ограничения и требуемые измерения для уточнения.
  verification: |-
    Проверить сравнимость: TAM >= SAM >= SOM только при одинаковом горизонте, валюте, цене и знаменателе.
  output: market_size_result
russian_digital_market: |-
  Российские численности компаний имеют разную правовую и статистическую природу: ЕГРЮЛ, МСП, статистические организации, ИП. Отечественная специфика ПО: on-prem, подписка, бессрочные лицензии, интеграционные работы и НДС; государственный спрос часто учитывается через отдельные процедуры закупок. Для оценок учитывать курс/инфляцию, ограничения доступа к зарубежным решениям и инфраструктуре, требования информационной безопасности, фактическую возможность поставки. Показатели затрат организаций на цифровые технологии НЕ равны доходу российского рынка SaaS: включают собственные работы и иные статьи.
interpretation_rules: |-
  TAM — модель потенциальной выручки по определённой задаче, а не официальный размер рынка. SAM — достижимая с технической стороны часть TAM, SOM — результат ресурсно ограниченной модели на конкретный срок. Любая граница может быть неизвестной при отсутствии данных; лучше корректный null с формулой, чем произвольный миллион.
quality_control:
  global_data_checks:
  - Проверять существование исходного файла, dataset_id, паспорт и версию; каталог сам по себе не подтверждает значения.
  - 'Сопоставлять единицу наблюдения: компания, ИП, субъект МСП, домохозяйство, человек или пользователь 15+.'
  - Проверять дату, территорию, классификатор, числитель, знаменатель и охват выборки перед соединением таблиц.
  - При суммировании регионов исключать пересечения территорий и вложенные автономные округа; предпочитать национальный
    итог издателя.
  - Не объединять доли из разных генеральных совокупностей без отдельного, проверяемого обоснования.
  - Отличать отсутствие данных от числового нуля; не восстанавливать несуществующие совместные разрезы.
  - Помечать синтетические примеры как учебные, выводы и оценки — по уровню подтверждения.
  - Не утверждать существование работающего внешнего коннектора только потому, что источник описан в каталоге.
  method_specific:
  - У всех сумм есть валюта, год, налоговая база и единица продажи
  - Для каждого коэффициента отмечен факт/оценка/сценарий
  - Проверено отсутствие двойного счёта на пересекающихся территориях/сегментах
  - Чувствительность показана хотя бы по N, цене, конверсии/охвату
  - Неизвестный SOM не подставлен автоматически
  - При совместимости сопоставления соблюдается TAM >= SAM >= SOM
  anti_patterns:
  - ТAM = все компании × средний чек без определения покупателя
  - SAM = TAM × произвольный процент из экспертного впечатления
  - SOM = 1% рынка без модели продаж
  - Цена за пользователя умножена на число компаний
  - Условный годовой чек ошибочно сравнивается с месячным оборотом
  - Внутренние расходы организаций приравнены к продажам внешних поставщиков
  stop_if: 'Не выводить численное заключение, если требуется отсутствующая генеральная совокупность, база пересчета,
    существенный коэффициент или независимое подтверждение: пометить результат partial/hypothesis_only/insufficient_data.'
structured_analytical_result:
  note: Схема результата — перечень логических полей, не самостоятельная JSON Schema; значения формируются при реальном
    применении.
  top_level_required:
  - method_id
  - case_id
  - analysis_date
  - product_context
  - status
  - inputs_used
  - outputs
  - evidence_register
  - assumptions_and_gaps
  - interpretation
  - quality_checks
  - expert_decision_required
  method_fields:
  - field: scope
    type: object
    required: true
  - field: observed_market
    type: object|null
    required: true
  - field: tam
    type: '{natural_value,monetary_value,unit,period,formula,inputs,evidence,scenario}'
    required: true
  - field: sam
    type: '{eligible_population,filters,lower_bound,upper_bound,monetary_value,missing_cross_tabs}'
    required: true
  - field: som
    type: '{horizon,capacity_assumptions,conversion_assumptions,model,scenarios,monetary_value}'
    required: true
  - field: sensitivity_analysis
    type: array[parameter,variation,effect]
    required: true
  - field: cross_check
    type: object|null
    required: true
  evidence_standard:
    record_type: evidence
    required_fields:
    - 'evidence_id: уникальный ID'
    - 'claim_or_parameter_id: идентификатор вывода/параметра'
    - 'evidence_type: observed_fact | computed | interpretation | assumption | expert_assertion'
    - 'source_title: первоисточник или файл эксперта'
    - 'source_url_or_file_id: прямой путь/ID либо null с причиной'
    - 'dataset_id_and_version: если использован локальный набор'
    - 'date_observed_or_published: исходный год/дата'
    - 'retrieved_at: дата обращения, если внешняя веб-страница'
    - 'geography_and_population: географический охват, совокупность и знаменатель'
    - 'value_unit_formula_filters: значение, единица, формула и фильтры по возможности'
    - 'limitations: методические ограничения, в том числе наличие/отсутствие независимой проверки'
    integrity_rule: |-
      Ни один существенный численный вывод не должен существовать только как текст без ссылки на исходные показатели; предположения, суждения эксперта и наблюдаемые факты не являются одним типом доказательства. Нельзя присваивать статистический статус маркетинговым догадкам. Нельзя выдумывать цену, долю рынка, интервью, цитату, количественную частоту потребности или конверсию.
  status_values:
  - value: complete_with_evidence
    meaning: все существенные шаги проведены; источники и ограничения доступны
  - value: partial
    meaning: проведена подтвержденная часть; неопределенности и пробелы указаны
  - value: hypothesis_only
    meaning: получена проверяемая модель или гипотеза, но нет необходимых наблюдений
  - value: insufficient_data
    meaning: без ключевых данных выполнение метода недостоверно
  - value: not_applicable
    meaning: метод неприменим к задаче; причина записана
  serialization_policy: Числа как числа, не строки; отдельно валюты, периоды, единицы, знаменатели; null при неизвестном
    значении; дата и URL исходного источника; никаких фабрикованных данных
worked_example:
  is_synthetic: true
  case: Условный B2B SaaS по обслуживанию оборудования; все числа учебные
  inputs:
  - 1 000 условно релевантных платящих организаций
  - 120 000 руб. в год за организацию
  - Из отдельного прямого обследования — 400 организаций проходят условия продукта
  - У отдела продаж 100 квалифицированных лидов за год; наблюдаемая конверсия 20%; внедрение допускает 30 новых клиентов
  procedure:
  - TAM = 1 000 × 120 000 = 120 000 000 руб./год.
  - SAM = 400 × 120 000 = 48 000 000 руб./год.
  - Сделки = min(100 × 0.20, 30) = 20; SOM = 20 × 120 000 = 2 400 000 руб./год.
  - Если конверсия не подтверждена, SOM должен стать сценарным, а не достоверным.
  output: Модель рынка с исходными фактами, формулами и отдельной моделью продаж; никакие 1 000 и 400 не взяты из реальной
    базы.
  not_real_data_warning: Статистические числа и коэффициенты вымышлены исключительно для объяснения процедуры.
