  external_data_candidates:
  - Единый реестр российского ПО для первичного обнаружения участников и классов
  - Официальные сайты, техническая документация и лицензии поставщиков
  - Официальные государственные закупки при релевантности B2G
  - Финансовая отчетность компаний там, где сопоставима
  data_use_rule: |-
    Указанные наборы «Рыночного агента» являются кандидатами, а не готовыми значениями. По каждому необходимы доступ к CSV, паспорт, первоисточник, проверка охвата, года и знаменателя; использовать только действительно совместимые наблюдения. Статистика 2020–2024 и публикации 2025 года не должна представляться как измерение 2026 года.
procedure:
- step: 03.1 Определить отрасль
  procedure: |-
    Ограничить рынок по функциональной задаче, покупателю и модели поставки. Отдельно перечислить близкие решения, дополняющие сервисы и заменители. Указать российскую территорию и период.
  verification: |-
    Не анализировать «весь ИТ» как отрасль, если продукт решает узкую задачу.
  output: industry_definition
- step: 03.2 Соперничество
  procedure: |-
    Оценить число и типы активных продавцов, дифференциацию, частоту ценовых изменений, сложность переключения, темпы роста при проверяемых данных. Для каждого признака указать наблюдение и эффект на прибыльность.
  verification: |-
    Количество записей в реестре ПО не равно числу активно конкурирующих продаваемых решений.
  output: rivalry_evidence
- step: 03.3 Новые участники
  procedure: |-
    Исследовать время и стоимость разработки, доступ к платформам/данным, компетенции, сертификацию при необходимости, стоимость привлечения первых клиентов, сетевые эффекты.
  verification: |-
    Не приравнивать техническую возможность написать код к коммерческой возможности войти в рынок.
  output: entrant_barriers
- step: 03.4 Сила покупателей
  procedure: |-
    Определить, кто платит и кто согласует. Оценить концентрацию покупателей, прозрачность цен, размер контракта, усилия на миграцию, закупочную процедуру и способность разрабатывать собственное ПО.
  verification: |-
    Отдельно рассматривать крупного единого покупателя, массовый SMB и государственный сегмент.
  output: buyer_power
- step: 03.5 Сила поставщиков
  procedure: |-
    Перечислить критические компоненты цифровой цепочки: облако, инфраструктура, платежи, лицензии, данные, модели ИИ, интеграционные платформы, ключевые кадры. Оценить заменяемость и риск повышения цены/отключения.
  verification: |-
    Выделять зависимости, имеющие доказанный путь влияния на конкретный продукт.
  output: supplier_power
- step: 03.6 Заменители
  procedure: |-
    Собрать способы выполнения клиентской задачи вне категории: Excel, мессенджеры, 1С-конфигурации, собственная разработка, ручной процесс и «ничего не делать». Проверить полную стоимость альтернативы.
  verification: |-
    Заменитель не обязан быть прямым конкурентным продуктом с тем же набором функций.
  output: substitution
- step: 03.7 Матрица пяти сил
  procedure: |-
    Для каждой силы выдать признаки, источники, направление эффекта на маржу, условную интенсивность (high/medium/low/unknown) и противоречащие свидетельства. Отдельно сопоставить силы между собой, не складывать метки как числа.
  verification: |-
    Нельзя выдавать точные рыночные доли/HHI без однородной выручки игроков.
  output: force_matrix
- step: 03.8 Вывод для стратегии
  procedure: |-
    Сформулировать 2–4 выводимых из фактов продуктовых действия: снизить зависимость, усилить интеграции, выбрать сегмент, изменить условия перехода. Для каждого указать механизм влияния, основание и что не доказано.
  verification: |-
    Рекомендации должны следовать из конкретных выявленных сил, а не общего ярлыка «высокая конкуренция».
  output: strategic_implications
russian_digital_market: |-
  В России учитывать закупочные требования государственных и корпоративных покупателей, возможность требований о реестре российского ПО в конкретной закупке, ограничения трансграничных сервисов, зависимость от отечественной инфраструктуры и платформ, конкурентные экосистемы, отраслевое регулирование и локализацию данных там, где действительно применима. Нельзя формулировать универсальную правовую норму для всех SaaS. Записи в реестре российского ПО — источник обнаружения предложений, но не показатель рыночного успеха, доступности, выручки или числа внедрений.
interpretation_rules: |-
  Высокая сила одного фактора не доказывает, что рыночный вход невозможен: рассмотрите противодействующие барьеры и дифференциацию. Пять сил — аналитическая диагностика структуры, не финансовый прогноз. Выводы должны явно связывать фактор → воздействие на экономику/доступность → стратегическую реакцию.
quality_control:
  global_data_checks:
  - Проверять существование исходного файла, dataset_id, паспорт и версию; каталог сам по себе не подтверждает значения.
  - 'Сопоставлять единицу наблюдения: компания, ИП, субъект МСП, домохозяйство, человек или пользователь 15+.'
  - Проверять дату, территорию, классификатор, числитель, знаменатель и охват выборки перед соединением таблиц.
  - При суммировании регионов исключать пересечения территорий и вложенные автономные округа; предпочитать национальный
    итог издателя.
  - Не объединять доли из разных генеральных совокупностей без отдельного, проверяемого обоснования.
  - Отличать отсутствие данных от числового нуля; не восстанавливать несуществующие совместные разрезы.
  - Помечать синтетические примеры как учебные, выводы и оценки — по уровню подтверждения.
  - Не утверждать существование работающего внешнего коннектора только потому, что источник описан в каталоге.
  method_specific:
  - Для каждого из пяти факторов хотя бы один источник или статус unknown
  - Разделены покупатели, пользователи и закупщики
  - Есть анализ заменителей и барьеров переключения
  - Оценка концентрации рассчитывается только на полной сопоставимой базе
  - Сформулированы причинные связи и возможные контрсвидетельства
  anti_patterns:
  - Приписывание 5 баллов каждому фактору без определений и источников
  - Смешение конкурентов и заменителей без описания различий
  - Игнорирование Excel и ручных процессов как альтернатив
  - Вывод о власти поставщика только по его размеру
  - Приравнивание списка реестра ПО к долям рынка
  - Утверждения «всегда необходимо» о российском правовом режиме без проверки
  stop_if: 'Не выводить численное заключение, если требуется отсутствующая генеральная совокупность, база пересчета,
    существенный коэффициент или независимое подтверждение: пометить результат partial/hypothesis_only/insufficient_data.'
structured_analytical_result:
  note: Схема результата — перечень логических полей, не самостоятельная JSON Schema; значения формируются при реальном
    применении.
  top_level_required:
  - method_id
  - case_id
  - analysis_date
  - product_context
  - status
  - inputs_used
  - outputs
  - evidence_register
  - assumptions_and_gaps
  - interpretation
  - quality_checks
  - expert_decision_required
  method_fields:
  - field: industry_boundary
    type: object
    required: true
  - field: forces
    type: array[{force_id,drivers,intensity,evidence_ids,counterevidence,implications}]
    required: true
  - field: substitutes
    type: array[object]
    required: true
  - field: critical_dependencies
    type: array[object]
    required: true
  - field: structural_risks
    type: array[object]
    required: true
  - field: product_actions
    type: array[object]
    required: true
  evidence_standard:
    record_type: evidence
    required_fields:
    - 'evidence_id: уникальный ID'
    - 'claim_or_parameter_id: идентификатор вывода/параметра'
    - 'evidence_type: observed_fact | computed | interpretation | assumption | expert_assertion'
    - 'source_title: первоисточник или файл эксперта'
    - 'source_url_or_file_id: прямой путь/ID либо null с причиной'
    - 'dataset_id_and_version: если использован локальный набор'
    - 'date_observed_or_published: исходный год/дата'
    - 'retrieved_at: дата обращения, если внешняя веб-страница'
    - 'geography_and_population: географический охват, совокупность и знаменатель'
    - 'value_unit_formula_filters: значение, единица, формула и фильтры по возможности'
    - 'limitations: методические ограничения, в том числе наличие/отсутствие независимой проверки'
    integrity_rule: |-
      Ни один существенный численный вывод не должен существовать только как текст без ссылки на исходные показатели; предположения, суждения эксперта и наблюдаемые факты не являются одним типом доказательства. Нельзя присваивать статистический статус маркетинговым догадкам. Нельзя выдумывать цену, долю рынка, интервью, цитату, количественную частоту потребности или конверсию.
  status_values:
  - value: complete_with_evidence
    meaning: все существенные шаги проведены; источники и ограничения доступны
  - value: partial
    meaning: проведена подтвержденная часть; неопределенности и пробелы указаны
  - value: hypothesis_only
    meaning: получена проверяемая модель или гипотеза, но нет необходимых наблюдений
  - value: insufficient_data
    meaning: без ключевых данных выполнение метода недостоверно
  - value: not_applicable
    meaning: метод неприменим к задаче; причина записана
  serialization_policy: Числа как числа, не строки; отдельно валюты, периоды, единицы, знаменатели; null при неизвестном
    значении; дата и URL исходного источника; никаких фабрикованных данных
worked_example:
  is_synthetic: true
  case: Условная российская CRM для узких отраслевых подрядчиков
  inputs:
  - Сведения о трех сопоставимых продуктах из официальных сайтов
  - Список интеграционных зависимостей
  - Интервью с двумя закупщиками — иллюстрация, не проведены
  procedure:
  - 'Угроза заменителей: заказчики управляют лидами в таблицах и мессенджерах; факт требует подтверждения на реальных
    клиентах.'
  - 'Сила покупателя: если каждый контракт требует длительной интеграции, стоимость перехода может снижать ценовую чувствительность,
    но повышать стоимость продажи.'
  - 'Сила поставщика: зависимость от одного API требует проверки условий доступа.'
  - 'Решение: проанализировать совместимость, стоимость переключения и эксплуатационные риски.'
  output: Таблица пяти факторов с описанием источников и пробелов, без необоснованной суммарной оценки.
  not_real_data_warning: Пример гипотетический; не утверждает реальные условия рынка CRM.
