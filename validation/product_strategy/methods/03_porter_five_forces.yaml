meta:
  schema_version: '1.0'
  method_id: M03
  slug: porter_five_forces
  title: Пять конкурентных сил Портера — структура отрасли цифрового продукта
  language: ru
  version: 1.0.0
  prepared_on: '2026-11-21'
  method_family: Отраслевая стратегическая диагностика
  document_status: полная методологическая спецификация; не отчет по конкретному продукту
  editorial_license_note: Оригинальное изложение общепринятых методов; тексты SKILL.md Dean Peters не воспроизводятся
role:
  goal: |-
    Исследовать не только конкретных конкурентов, но и механизмы, определяющие переговорную власть, условия маржинальности и устойчивость продуктовой позиции в российской цифровой отрасли. Анализ объясняет направление давления, а не присваивает «объективный» балл привлекательности отрасли.
  questions:
  - Какие структурные силы ограничивают цену, доходность и возможности входа?
  - Кто реально обладает переговорной силой?
  - Насколько опасны заменители, новые участники и борьба действующих игроков?
  applicability:
  - Решение о выходе в категорию российского ПО
  - Изменение продуктовой модели в конкурентном сегменте
  - Анализ отраслевых барьеров
  - Выбор ниши с приемлемыми структурными ограничениями
  not_applicable_when:
  - Нужна исключительно таблица сравнения функций конкретных продуктов
  - Не определены границы продуктовой отрасли или тип покупателя
  mode: Самостоятельный метод; не требует выполнения других 9 методов
  scope_boundary: |-
    Предмет — продуктовая стратегия цифрового продукта для российского рынка. Выбор каналов продвижения, медиаплан и коммуникационные сообщения не являются результатом данного метода. Метод не принимает решений за эксперта: фиксирует варианты и их фактическую обоснованность.
theory:
  concepts:
  - term: Соперничество действующих конкурентов
    meaning: Интенсивность борьбы за одних покупателей с учетом темпов роста, дифференциации, затрат переключения.
  - term: Угроза новых участников
    meaning: Возможность появления конкурентов, сдерживаемая затратами, доступом к данным/каналам, репутацией, интеграциями.
  - term: Сила покупателей
    meaning: Способность покупателей давить на цену, сроки, SLA, доработки или менять поставщика.
  - term: Сила поставщиков
    meaning: Способность владельцев инфраструктуры, данных, платформ, технологий и кадров изменять условия выпуска.
  - term: Угроза заменителей
    meaning: Альтернативные способы выполнить ту же работу, включая Excel, собственную разработку и отказ от покупки.
  - term: Комплемент
    meaning: Интеграции и дополняющие технологии влияют на силы, но не добавляются автоматически шестой равноправной
      силой.
  formulas:
  - name: Концентрация, при наличии полной базы
    expression: HHI = sum_i((market_share_percent_i)^2)
    units: пункты 0..10000
    conditions: |-
      Только как дополнительная описательная метрика, если доли одной категории и года репрезентативны и в сумме близки к 100%. Без полных долей HHI не считать.
    interpretation: |-
      Не является шестой силой и не заменяет анализ рыночного поведения.
input_contract:
  mandatory:
  - field: industry_boundary
    definition: 'Функциональные границы рынка: какую задачу и для какого покупателя решают решения'
    data_type: text
    preferred_source: Эксперт и проверенные продукты
    if_missing: Зафиксировать отсутствие; не подменять догадкой
  - field: product_category_and_delivery
    definition: Категория цифрового решения и SaaS/on-prem/API/услуга
    data_type: text
    preferred_source: Документация решения
    if_missing: Зафиксировать отсутствие; не подменять догадкой
  - field: players_and_substitutes
    definition: Набор прямых конкурентов, новых участников и заменителей
    data_type: array[organization,offering,evidence]
    preferred_source: Проверенный рыночный поиск
    if_missing: Зафиксировать отсутствие; не подменять догадкой
  - field: buyer_and_supplier_roles
    definition: Участники закупки и ресурсные зависимости
    data_type: text
    preferred_source: Документация, интервью, проверенные контракты
    if_missing: Зафиксировать отсутствие; не подменять догадкой
  helpful:
  - field: pricing_and_contracts
    definition: Открытые тарифы, лицензионные условия, SLA и сроки внедрения
    data_type: text
    preferred_source: Официальные документы поставщиков
    if_missing: Зафиксировать отсутствие; не подменять догадкой
  - field: switching_cost
    definition: 'Стоимость смены решения: миграция данных, обучение, интеграции'
    data_type: text
    preferred_source: Интервью и подтверждённые оценки
    if_missing: Зафиксировать отсутствие; не подменять догадкой
  - field: market_concentration
    definition: Доли по выручке или клиентам в одинаковой категории и году
    data_type: text
    preferred_source: Финансовые отчёты; в отсутствие не считать HHI
    if_missing: Зафиксировать отсутствие; не подменять догадкой
  - field: barriers
    definition: Регуляторные, инфраструктурные, экономические барьеры входа
    data_type: text
    preferred_source: Официальные документы и участники рынка
    if_missing: Зафиксировать отсутствие; не подменять догадкой
  expert_inputs:
  - Карта существующих заменителей и связей интеграции
  - Закупочные роли и условия эксплуатации
  - Потери на переключение и реальное влияние поставщиков
