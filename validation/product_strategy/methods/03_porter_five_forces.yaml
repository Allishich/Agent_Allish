    possible_use: Фон о концентрации потенциальных организаций в нескольких секторах
    critical_limit: Не использовать как число клиентов конкретного конкурента.
    data_file_url: https://drive.google.com/file/d/1x-2zC80igUjJqly4eNQr1hokUmFCKrJ2/view
