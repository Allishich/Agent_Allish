meta:
  schema_version: '1.0'
  method_id: M15
  slug: contextual_observation
  title: Контекстное наблюдение за пользователями
  language: ru
  version: 1.0.0
  prepared_on: '2026-11-21'
  method_family: Полевое исследование
  method_group: new_product_idea
  document_status: самостоятельная прикладная методика, не отчёт о продукте
  reuse_policy: Самостоятельное изложение классического метода; тексты сторонних SKILL.md не копируются.
role:
  goal: Установить, как реальные задачи выполняются в рабочем или повседневном контексте, включая обходные процессы
    и незаметные участникам препятствия.
  decision_question: Какие наблюдаемые процессы и неудовлетворённые потребности должны учитываться в продуктовой
    концепции?
  applicability:
  - Проектирование B2B-автоматизации
  - Исследование сложных рабочих процессов
  - Изучение поведения до внедрения ПО
  not_applicable_when:
  - Реальная среда недоступна или наблюдение невозможно провести без нарушения безопасности/конфиденциальности
  - Необходимо количественно оценить распространённость явления по рынку
  autonomy: Самостоятельный метод; не требует применения остальных 20 методов.
  scope_boundary: Продуктовая стратегия цифрового продукта для российского рынка; не медиаплан, не копирайтинг,
    не разработка рекламной кампании.
theory:
  concepts:
  - term: Контекстное наблюдение
    meaning: Фиксация поведения пользователя при выполнении реальной задачи в естественной среде.
  - term: Рабочая последовательность
    meaning: Порядок действий, участников, инструментов, ожиданий и передач между этапами.
  formulas: []
input_contract:
  minimum:
  - Чётко определённая наблюдаемая задача
  - Разрешённый доступ к процессу и согласованные условия
  - Протокол фиксации времени, шагов и событий
  optional:
  - Существующие бизнес-процессы или регламенты
  - Схемы интеграции и фактические используемые инструменты
  public_data_role: Публичная статистика не заменяет фактическое наблюдение индивидуального процесса.
expert_instruction:
  purpose: 'Краткая инструкция человеку: выполнить только недоступные консультанту действия и передать исходные
    сведения.'
  steps:
  - step: 1
    action: Определить одну задачу или процесс; согласовать с участниками условия наблюдения и ограничения на
      фиксацию данных.
  - step: 2
    action: Выбрать несколько типов пользователей/условий, в которых процесс реально выполняется.
  - step: 3
    action: Наблюдать за реальным действием без подсказок; отмечать шаги, паузы, ошибки, обходные средства,
      документы и передачи между ролями.
  - step: 4
    action: Записывать действие и контекст отдельно от объяснения или оценки исследователя.
  - step: 5
    action: Сверить непонятные действия с участником после завершения задачи; не исправлять задним числом первичное
      наблюдение.
  - step: 6
    action: Передать журнал наблюдений без лишних персональных и коммерчески чувствительных данных.
  minimum_record_fields:
  - session_id
  - role
  - process
  - environment
  - step_order
  - action
  - tool_or_artifact
  - duration_if_measured
  - obstacle
  - workaround
  - observation_ref
  - researcher_inference_separate
  data_transfer_rule: Предавать исходные записи/таблицы и определения полей с информацией о способе сбора, периоде,
    пропусках и ограничениях. По возможности псевдонимизировать людей и организации; доступ к исходникам ограничить.
analytical_procedure:
  quality_checks_before_analysis:
  - Не превращать поведение одного сотрудника в «типичное для отрасли».
  - Отдельно указать влияние присутствия наблюдателя и нештатных условий.
  - Не собирать необязательные персональные или защищённые данные.
  steps:
  - Составить карту фактической последовательности действий и ролей.
  - Сгруппировать повторяющиеся потери времени и обходные практики с источниками наблюдений.
  - Выделить сценарии продукта для дальнейшей оценки, не выдавая их за уже подтверждённый спрос.
russian_digital_market: В российских организациях учитывать реальные роли, регламенты, ЭДО, информационную безопасность,
  ограничения доступа к производственным помещениям и коммерческой тайне. Право на наблюдение и запись определяется
  заранее.
interpretation_rules:
- Наблюдение не раскрывает все мотивы пользователя без уточнения.
- Естественный процесс в одной организации не обязательно отражает всю отрасль.
quality_control:
  common_gates:
  - У исследования есть конкретный вопрос и решение, для которого собираются данные.
  - Источник каждого вывода прослеживается до исходного наблюдения, анкеты или расчёта.
  - Ненаблюдаемые величины, гипотезы и ограничения явно маркируются; недостающее не подменяется выдуманными
    значениями.
  - Не переносить результаты нерепрезентативной выборки на всё население или рынок России.
  - При обработке персональных данных определить законное основание, минимизацию состава данных, права участников,
    безопасность и сроки хранения.
  completion_gates:
  - У исходных записей установлены единица наблюдения, дата, источники и условия измерения.
  - Показатели воспроизводимы; знаменатели и исключения записаны.
  - Применение метода не подменяется предположениями, когда требуется внешний сбор.
  - Честно записаны ограничения причинности, выборки и переносимости результатов.
structured_analytical_result:
  serialization_target: JSON после применения метода; эта методическая спецификация остаётся YAML.
  required_common_fields:
  - method_id
  - case_id
  - product_scope
  - data_collection_status
  - analysis_status
  - period
  - observations_count
  - inputs_and_source_refs
  - method_findings
  - quality_warnings
  - assumptions
  - limitations
  - decision_implications
  method_specific_fields:
  - as_is_workflow
  - observed_friction_points
  - workarounds
  - role_differences
  - verification_gaps
  possible_statuses:
  - not_started
  - data_collection_needed
  - partial
  - completed_with_evidence
  - not_applicable
  no_report_rule: Выход — структурированные факты и выводы, не готовая презентация или рекламный текст.
worked_example:
  synthetic: true
  situation: Процесс согласования заявок в сервисной компании.
  expert_action: Наблюдал фактическую цепочку «почта — таблица — телефон» и записал временные затраты.
  structured_result: As-is процесс, ручные обходы, источники наблюдений, гипотезы о возможной цифровизации.
related_core_methods_optional:
- M05 JTBD
- M06 Value Proposition Canvas
sources:
- title: Nielsen Norman Group, Qualitative User-Research Methods
  url: https://www.nngroup.com/articles/qual-research-methods/
- title: Федеральный закон №152-ФЗ «О персональных данных» — действующая редакция проверяется перед исследованием
  url: https://www.consultant.ru/document/cons_doc_LAW_61801/
  relevance: Если исследование обрабатывает персональные данные, определить основание, цель, сроки хранения
    и меры защиты; не заменяет юридическую проверку.
