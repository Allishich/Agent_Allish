meta:
  schema_version: '1.0'
  method_id: M13
  slug: concept_prototype_testing
  title: Тестирование концепции и раннего прототипа
  language: ru
  version: 1.0.0
  prepared_on: '2026-11-21'
  method_family: Проверка продукта
  method_group: new_product_idea
  document_status: самостоятельная прикладная методика, не отчёт о продукте
  reuse_policy: Самостоятельное изложение классического метода; тексты сторонних SKILL.md не копируются.
role:
  goal: Понять, верно ли аудитория интерпретирует идею, видит ли в ней конкретную ценность и какие препятствия
    обнаруживаются в пробном контакте.
  decision_question: Стоит ли уточнять продуктовую концепцию и какую гипотезу проверить следующей?
  applicability:
  - Идея без функционирующего продукта
  - Демонстрация интерактивного прототипа
  - Ранний B2B продукт с концептуальным описанием
  not_applicable_when:
  - Нужно достоверно измерить конверсию действующего продукта — применять A/B при достаточном трафике
  autonomy: Самостоятельный метод; не требует применения остальных 20 методов.
  scope_boundary: Продуктовая стратегия цифрового продукта для российского рынка; не медиаплан, не копирайтинг,
    не разработка рекламной кампании.
theory:
  concepts:
  - term: Концептуальный тест
    meaning: Реакция на одинаково представленную идею, с отдельным наблюдением понимания и предпочтений.
  - term: Прототипный тест
    meaning: Выполнение ограниченной задачи на демонстрации/макете без утверждения полной работоспособности
      продукта.
  formulas: []
input_contract:
  minimum:
  - Короткое единообразное описание идеи или прототип
  - Целевая группа и проблема
  - Один-два проверяемых вопроса
  - План демонстрации и регистрации реакции
  optional:
  - Список существующих альтернатив
  - 'Проверяемое действие интереса: запрос демонстрации, тестовый доступ'
  public_data_role: Статистика сегментов помогает выбрать участников, но не доказывает их интерес к концепции.
expert_instruction:
  purpose: 'Краткая инструкция человеку: выполнить только недоступные консультанту действия и передать исходные
    сведения.'
  steps:
  - step: 1
    action: 'Определить, что именно проверяется: понятность, ценность, конкретная функция или готовность совершить
      следующий шаг.'
  - step: 2
    action: Подготовить одинаковую версию концепции или ограниченный прототип; обозначить недоступные функции,
      не выдавать макет за готовый продукт.
  - step: 3
    action: Подобрать представителей предполагаемого сегмента, разделить пользователя и покупателя для B2B.
  - step: 4
    action: Показать концепцию; дать участнику самостоятельно пересказать назначение и выполнить доступное действие.
      Не подсказывать ожидаемую оценку.
  - step: 5
    action: Зафиксировать наблюдаемое действие отдельно от комментария и предположения исследователя.
  - step: 6
    action: Передать описание предъявленного варианта, записи реакций, отказов и фактических действий.
  minimum_record_fields:
  - respondent_id
  - segment
  - concept_version
  - task_or_scenario
  - understanding_observation
  - objection
  - reported_interest
  - observed_next_action
  - date
  - source_ref
  data_transfer_rule: Предавать исходные записи/таблицы и определения полей с информацией о способе сбора, периоде,
    пропусках и ограничениях. По возможности псевдонимизировать людей и организации; доступ к исходникам ограничить.
analytical_procedure:
  quality_checks_before_analysis:
  - Все участники внутри сравниваемой группы видели одну и ту же версию материала.
  - Не подменять действие словами «купил бы».
  - Если выборка мала/невероятностна — не делать вывод о долях рынка.
  steps:
  - Систематизировать причины непонимания и возражения по типам участников.
  - Отдельно подсчитать действия интереса и субъективные оценки с корректными знаменателями.
  - Сформировать перечень изменений и следующих проверок, не объявляя PMF подтверждённым.
russian_digital_market: Для B2B учитывать интеграции, ИБ, локальное размещение и отечественные информационные
  системы только там, где это существенно для выбранной категории. Не сравнивать недоступный зарубежный сервис
  с российским как реально равные варианты.
interpretation_rules:
- Короткий тест концепции выявляет барьеры, но не надёжен для прогноза продаж.
- Прототипный успех не доказывает техническую реализуемость полной системы.
quality_control:
  common_gates:
  - У исследования есть конкретный вопрос и решение, для которого собираются данные.
  - Источник каждого вывода прослеживается до исходного наблюдения, анкеты или расчёта.
  - Ненаблюдаемые величины, гипотезы и ограничения явно маркируются; недостающее не подменяется выдуманными
    значениями.
  - Не переносить результаты нерепрезентативной выборки на всё население или рынок России.
  - При обработке персональных данных определить законное основание, минимизацию состава данных, права участников,
    безопасность и сроки хранения.
  completion_gates:
  - У исходных записей установлены единица наблюдения, дата, источники и условия измерения.
  - Показатели воспроизводимы; знаменатели и исключения записаны.
  - Применение метода не подменяется предположениями, когда требуется внешний сбор.
  - Честно записаны ограничения причинности, выборки и переносимости результатов.
structured_analytical_result:
  serialization_target: JSON после применения метода; эта методическая спецификация остаётся YAML.
  required_common_fields:
  - method_id
  - case_id
  - product_scope
  - data_collection_status
  - analysis_status
  - period
  - observations_count
  - inputs_and_source_refs
  - method_findings
  - quality_warnings
  - assumptions
  - limitations
  - decision_implications
  method_specific_fields:
  - concept_version
  - comprehension_findings
  - observed_interest
  - barriers
  - priority_revisions
  - next_validation
  possible_statuses:
  - not_started
  - data_collection_needed
  - partial
  - completed_with_evidence
  - not_applicable
  no_report_rule: Выход — структурированные факты и выводы, не готовая презентация или рекламный текст.
worked_example:
  synthetic: true
  situation: Идея сервиса учёта заявок для небольших управляющих компаний.
  expert_action: Показал всем участникам один и тот же интерактивный макет и отметил, кто понял сценарий без
    подсказки.
  structured_result: Список причин непонимания, наблюдённых действий и изменений концепции без обещаний о доле
    будущих покупателей.
related_core_methods_optional:
- M06 Value Proposition Canvas
- M05 JTBD
sources:
- title: Nielsen Norman Group, Qualitative User-Research Methods
  url: https://www.nngroup.com/articles/qual-research-methods/
- title: Nielsen Norman Group, Why 5 Participants Are Okay in a Qualitative Study, but Not in a Quantitative
    One
  url: https://www.nngroup.com/articles/5-test-users-qual-quant/
- title: Федеральный закон №152-ФЗ «О персональных данных» — действующая редакция проверяется перед исследованием
  url: https://www.consultant.ru/document/cons_doc_LAW_61801/
  relevance: Если исследование обрабатывает персональные данные, определить основание, цель, сроки хранения
    и меры защиты; не заменяет юридическую проверку.
