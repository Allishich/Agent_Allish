meta:
  schema_version: '1.0'
  method_id: M17
  slug: ab_testing
  title: A/B-тестирование цифрового продукта
  language: ru
  version: 1.0.1
  prepared_on: '2026-11-21'
  method_family: Контролируемый эксперимент
  method_group: existing_product
  document_status: самостоятельная прикладная методика, не отчёт о продукте
  reuse_policy: Самостоятельное изложение классического метода; тексты сторонних SKILL.md не копируются.
role:
  goal: Оценить причинный эффект одного заранее определённого изменения на продуктовую метрику при корректной
    рандомизации.
  decision_question: Следует ли внедрить изменение с учётом эффекта, неопределённости и защитных метрик?
  applicability:
  - Действующий продукт с достаточным трафиком
  - Контролируемое изменение интерфейса/функции
  - Тестирование варианта после успешной технической интеграции
  not_applicable_when:
  - Недостаточно единиц и событий для выбранного MDE
  - Нет стабильной рандомизации или невозможно отделить пользователей
  - Изменение нарушает безопасность и не допускает этического теста
  autonomy: Самостоятельный метод; не требует применения остальных 20 методов.
  scope_boundary: Продуктовая стратегия цифрового продукта для российского рынка; не медиаплан, не копирайтинг,
    не разработка рекламной кампании.
theory:
  concepts:
  - term: Treatment/control
    meaning: Экспериментальная и контрольная группа, которые отличаются целевым вмешательством.
  - term: MDE
    meaning: Минимальный эффект, который имеет смысл обнаружить для решения.
  - term: SRM
    meaning: Sample Ratio Mismatch — подозрительное несоответствие фактического распределения групп запланированному.
  - term: Guardrail metrics
    meaning: Показатели, ухудшение которых недопустимо даже при росте основной метрики.
  formulas:
  - name: Разность конверсий
    expression: delta = successes_B / eligible_B - successes_A / eligible_A
    preconditions: Независимые группы и сопоставимое определение успеха.
  - name: Относительное изменение
    expression: relative_lift = delta / (successes_A / eligible_A)
    preconditions: Контрольная конверсия > 0; всегда сообщать и абсолютный эффект.
input_contract:
  minimum:
  - Гипотеза с изменяемым фактором
  - Первичная метрика и определённое событие
  - Единица рандомизации (пользователь/организация)
  - Базовая конверсия или дисперсия метрики
  - MDE, уровень значимости и требуемая мощность
  - Схема сбора событий
  optional:
  - Продуктовая аналитика с идентификатором варианта
  - A/A-проверка механики
  - Списки исключений и мониторинг сбоев
  public_data_role: Открытая статистика России не заменяет внутренние экспериментальные события и дисперсию
    продукта.
expert_instruction:
  purpose: 'Краткая инструкция человеку: выполнить только недоступные консультанту действия и передать исходные
    сведения.'
  steps:
  - step: 1
    action: Сформулировать один главный эффект, основную и защитные метрики, точное определение знаменателя
      и период наблюдения.
  - step: 2
    action: До запуска согласовать MDE, alpha, мощность, анализ, критерии остановки и рассчитать выборку; если
      трафика недостаточно, не изображать полноценный A/B-тест.
  - step: 3
    action: Обеспечить случайное и устойчивое закрепление участника за вариантом; в B2B при взаимодействии сотрудников
      одной фирмы рассмотреть рандомизацию на уровне организации.
  - step: 4
    action: Запустить вариант A и B с одинаковыми условиями, кроме проверяемого изменения, и проверить регистрацию
      событий, SRM и риски смешения.
  - step: 5
    action: Собирать сырые события и агрегаты до заранее определённого срока; не прекращать обычный фиксированный
      тест из-за первого p-value < 0.05.
  - step: 6
    action: Передать определения метрик, план, экспериментальные логи и таблицу участников/успехов; отдельно
      все отклонения протокола.
  minimum_record_fields:
  - experiment_id
  - randomization_unit
  - unit_id_pseudonymous
  - variant
  - allocation_rule
  - enrollment_timestamp
  - eligible_flag
  - primary_outcome
  - guardrails
  - observation_window
  - events_quality_flags
  - protocol_version
  data_transfer_rule: Предавать исходные записи/таблицы и определения полей с информацией о способе сбора, периоде,
    пропусках и ограничениях. По возможности псевдонимизировать людей и организации; доступ к исходникам ограничить.
analytical_procedure:
  quality_checks_before_analysis:
  - SRM и потери данных проверены до сравнения эффекта.
  - Единица анализа совпадает с единицей рандомизации либо применена корректная кластерная модель.
  - Нельзя делать вывод по значимости только при неизвестном MDE и выборке.
  - Вторичные и сегментные метрики требуют контроля множественных сравнений.
  steps:
  - Проверить качество логирования, рандомизацию, потери событий, SRM и пересечения групп.
  - Вычислить разность первичных метрик, доверительный интервал и заранее указанный тест; для бинарного показателя
    — успехи/число подходящих единиц в каждой группе.
  - Проверить защитные метрики и практическую значимость эффекта относительно MDE.
  - Отразить неопределённость, нарушения дизайна и решение «внедрить/не внедрять/неопределённо».
russian_digital_market: Для российской B2B SaaS возможны низкий трафик и кластеризация внутри организации; часто
  нужен пилот вместо A/B. Для пользовательских событий проверить правомерность аналитики и обработку идентификаторов.
  Требования к размещению/передаче данных оценить отдельно для конкретного сервиса.
interpretation_rules:
- Статистическая незначимость не доказывает нулевой эффект.
- Тест без корректной рандомизации не доказывает причинность.
- Раннее «подглядывание» за p-value без последовательной методики искажает ошибку I рода.
quality_control:
  execution_clarifications:
    - "До просмотра результата фиксировать единицу рандомизации, первичную метрику и единицу анализа, MDE, alpha, мощность, срок/правило остановки, долю распределения, защитные метрики, критерии их допустимого изменения и выбранный тест."
    - "Для бинарной метрики при независимых единицах базовый сценарий: разность долей (treatment − control), двусторонний тест двух пропорций и согласованный 95% доверительный интервал для разности; если единицы кластеризованы, дизайн последовательный, метрики непрерывны или данные имеют зависимость, выбирать корректный тест для такого дизайна и фиксировать его."
    - "SRM проверять по фактической единице назначения и ожидаемой пропорции распределения; при существенном SRM, критических сбоях логирования или нарушении рандомизации не выдавать причинный вывод и автоматическое решение о внедрении."
    - "Значимый положительный эффект основной метрики не отменяет защитные ограничения; если безопасность по защитным метрикам не установлена, результат помечать как неопределённый для решения о развёртывании."
  common_gates:
  - У исследования есть конкретный вопрос и решение, для которого собираются данные.
  - Источник каждого вывода прослеживается до исходного наблюдения, анкеты или расчёта.
  - Ненаблюдаемые величины, гипотезы и ограничения явно маркируются; недостающее не подменяется выдуманными
    значениями.
  - Не переносить результаты нерепрезентативной выборки на всё население или рынок России.
  - При обработке персональных данных определить законное основание, минимизацию состава данных, права участников,
    безопасность и сроки хранения.
  completion_gates:
  - У исходных записей установлены единица наблюдения, дата, источники и условия измерения.
  - Показатели воспроизводимы; знаменатели и исключения записаны.
  - Применение метода не подменяется предположениями, когда требуется внешний сбор.
  - Честно записаны ограничения причинности, выборки и переносимости результатов.
structured_analytical_result:
  serialization_target: JSON после применения метода; эта методическая спецификация остаётся YAML.
  required_common_fields:
  - method_id
  - case_id
  - product_scope
  - data_collection_status
  - analysis_status
  - period
  - observations_count
  - inputs_and_source_refs
  - method_findings
  - quality_warnings
  - assumptions
  - limitations
  - decision_implications
  method_specific_fields:
  - experiment_design
  - sample_and_baseline
  - quality_checks
  - effect_size
  - confidence_interval
  - statistical_test
  - guardrail_results
  - decision_and_caveats
  possible_statuses:
  - not_started
  - data_collection_needed
  - partial
  - completed_with_evidence
  - not_applicable
  no_report_rule: Выход — структурированные факты и выводы, не готовая презентация или рекламный текст.
worked_example:
  synthetic: true
  situation: Новая форма регистрации в действующем SaaS.
  expert_action: Закрепил пользователей случайно за A/B до начала, собрал число регистраций и ошибок по группам.
  structured_result: Эффект на конверсию с доверительным интервалом и проверкой ошибок, решение о внедрении
    зависит от заранее заданного MDE.
related_core_methods_optional:
- M08 Strategic Alternatives
sources:
- title: Microsoft Research, Patterns of Trustworthy Experimentation — Pre-Experiment Stage
  url: https://www.microsoft.com/en-us/research/articles/patterns-of-trustworthy-experimentation-pre-experiment-stage/
- title: Microsoft Research, Patterns of Trustworthy Experimentation — During-Experiment Stage
  url: https://www.microsoft.com/en-us/research/articles/patterns-of-trustworthy-experimentation-during-experiment-stage/
- title: Федеральный закон №152-ФЗ «О персональных данных» — действующая редакция проверяется перед исследованием
  url: https://www.consultant.ru/document/cons_doc_LAW_61801/
  relevance: Если исследование обрабатывает персональные данные, определить основание, цель, сроки хранения
    и меры защиты; не заменяет юридическую проверку.
