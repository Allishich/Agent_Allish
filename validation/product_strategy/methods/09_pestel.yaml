meta:
  schema_version: '1.0'
  method_id: M09
  slug: pestel
  title: PESTEL — анализ факторов внешней среды цифрового продукта в России
  language: ru
  version: 1.0.0
  prepared_on: '2026-11-21'
  method_family: Макросреда и внешние ограничения
  document_status: полная методологическая спецификация; не отчет по конкретному продукту
  editorial_license_note: Оригинальное изложение общепринятых методов; тексты SKILL.md Dean Peters не воспроизводятся
role:
  goal: |-
    Идентифицировать и оценить внешние политические, экономические, социальные, технологические, экологические и правовые факторы, которые меняют спрос, издержки, доступность технологий или возможность продавать цифровой продукт. Отделить действующие нормы и наблюдаемые тренды от предположений о будущих событиях.
  questions:
  - Какие внешние условия могут изменить продуктовую возможность?
  - Какие факторы уже наблюдаются, какие анонсированы, какие лишь вероятны?
  - Каков причинный механизм влияния на спрос, цену, качество, инфраструктуру и допуск к рынку?
  - Какие риски требуют изменения продукта, а какие наблюдения?
  applicability:
  - Выход на российский рынок цифрового продукта
  - Долгосрочный пересмотр продуктовой стратегии
  - Работа в регулируемой отрасли
  - Переход на другой технологический стек
  - Сравнение отраслей/регионов
  not_applicable_when:
  - Требуется юридическое заключение о конкретной норме вместо анализа среды
  - Невозможно задать конкретный продукт, рынок или горизонт
  mode: Самостоятельный метод; не требует выполнения других 9 методов
  scope_boundary: |-
    Предмет — продуктовая стратегия цифрового продукта для российского рынка. Выбор каналов продвижения, медиаплан и коммуникационные сообщения не являются результатом данного метода. Метод не принимает решений за эксперта: фиксирует варианты и их фактическую обоснованность.
theory:
  concepts:
  - term: Political
    meaning: Государственная политика, промышленная и цифровая политика, приоритеты закупок, поддержка.
  - term: Economic
    meaning: Макроэкономические условия, спрос, стоимость капитала, инфляция, валюта, доходы компаний.
  - term: Social
    meaning: Демография, навыки, доверие, привычки использования и организация труда.
  - term: Technological
    meaning: Доступность и зрелость инфраструктуры, платформ, интеграций, технологий ИИ, киберриски.
  - term: Environmental
    meaning: Энергопотребление ЦОД, климатические требования и экологический эффект продукта только при релевантности.
  - term: Legal
    meaning: Действующие применимые правовые требования, отраслевые нормы и договорные ограничения.
  - term: Driver–Mechanism–Effect
    meaning: Каждый фактор описывается наблюдением, причинным механизмом и проверяемым продуктовым последствием.
  formulas: []
input_contract:
  mandatory:
  - field: product_and_market_scope
    definition: Категория, покупатель, география РФ/регион, форма поставки, отрасль
    data_type: text
    preferred_source: Эксперт
    if_missing: Зафиксировать отсутствие; не подменять догадкой
  - field: time_horizon
    definition: Горизонт анализа и дата среза (например, 12–24 месяца)
    data_type: date_range
    preferred_source: Эксперт
    if_missing: Зафиксировать отсутствие; не подменять догадкой
  - field: factors_with_sources
    definition: Набор факторов с точным источником, датой и статусом «действует/принято, не вступило/проект/обсуждается/гипотеза»
    data_type: array[object]
    preferred_source: Первичные нормативные документы, официальная статистика
    if_missing: Зафиксировать отсутствие; не подменять догадкой
  - field: product_exposure
    definition: Почему фактор влияет именно на продукт, его клиентов или издержки
    data_type: text
    preferred_source: Описание продукта и клиентов
    if_missing: Зафиксировать отсутствие; не подменять догадкой
  helpful:
  - field: macro_metrics
    definition: Отраслевая динамика, зарплаты, расходы, процентные ставки, динамика цифровизации
    data_type: text
    preferred_source: Официальная статистика
    if_missing: Зафиксировать отсутствие; не подменять догадкой
  - field: external_dependencies
    definition: Зарубежные технологии, облака, расчеты, лицензии, данные и критические поставщики
    data_type: text
    preferred_source: Контрактные и технические сведения
    if_missing: Зафиксировать отсутствие; не подменять догадкой
  - field: regulation_by_case
    definition: Правовой анализ применимости нормы к конкретному сценарию
    data_type: text
    preferred_source: Официальный текст нормы и при необходимости профильный специалист
    if_missing: Зафиксировать отсутствие; не подменять догадкой
  expert_inputs:
  - Техническая архитектура продукта и трансграничные зависимости
  - Категории собираемых/обрабатываемых данных
  - Сценарии клиентов и закупок
  - Период бизнес-решения
