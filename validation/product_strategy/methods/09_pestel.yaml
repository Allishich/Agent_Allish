    Указанные наборы «Рыночного агента» являются кандидатами, а не готовыми значениями. По каждому необходимы доступ к CSV, паспорт, первоисточник, проверка охвата, года и знаменателя; использовать только действительно совместимые наблюдения. Статистика 2020–2024 и публикации 2025 года не должна представляться как измерение 2026 года.
procedure:
- step: 09.1 Рамка
  procedure: |-
    Зафиксировать продукт, рынок РФ и регионы, отрасль, архитектуру (SaaS/on-prem), клиентские роли, горизонт и ожидаемый тип продуктового решения.
  verification: |-
    Глобальный список трендов без связи с конкретным продуктом не является PESTEL-анализом.
  output: context
- step: 09.2 Поиск факторов
  procedure: |-
    По шести группам составить перечень возможных воздействий. Для каждого фактора указать минимально один первичный источник/официальную таблицу или явно пометить гипотезу. Не принуждать к искусственному фактору в каждой группе.
  verification: |-
    Фактор «ИИ развивается» слишком общий; нужен наблюдаемый механизм воздействия на продукт.
  output: factor_inventory
- step: 09.3 Статус и время
  procedure: |-
    Для каждой нормы/тенденции указать дату, географию, период действия и правовой статус. Развести принятый закон, проект, публичное обсуждение и аналитический прогноз. При правовой неопределённости — отметить необходимость профильной проверки.
  verification: |-
    Не писать «в России запрещено/обязательно», если закон/отраслевая область действия не подтверждены.
  output: factor_status
- step: 09.4 Воздействие на продукт
  procedure: |-
    Построить причинную цепь фактор → конкретный механизм → влияние на спрос/издержки/доступность/техническую реализацию → какой показатель изменится. Указать время эффекта и затронутый сегмент.
  verification: |-
    Без причинной цепочки фактор остаётся фоновым наблюдением, не стратегическим риском.
  output: impact_paths
- step: 09.5 Оценка существенности
  procedure: |-
    Разделить факторы по степени влияния (низкое/среднее/высокое/неизвестно) и степени доказанности; вероятность оценивается только если есть статистическая основа или обозначена субъективной оценкой эксперта.
  verification: |-
    Не умножать субъективные шкалы 1–5 и не представлять произведение как точную денежную потерю.
  output: salience_matrix
- step: 09.6 Два направления
  procedure: |-
    Для каждого существенного фактора описать возможности и угрозы; один и тот же внешний сдвиг может повышать спрос в одном сегменте и затраты в другом.
  verification: |-
    Не ограничиваться списком исключительно отрицательных последствий регулирования/технологий.
  output: opportunities_and_risks
- step: 09.7 Альтернативные сценарии
  procedure: |-
    Для внешних условий с высокой неопределенностью дать условные сценарии и условия срабатывания, без назначения вероятностей без данных. Пример: доступность критической технологии сохраняется/ограничивается.
  verification: |-
    Держать наблюдаемый факт и сценарное событие в разных полях.
  output: scenario_implications
- step: 09.8 План наблюдения
  procedure: |-
    Сформировать перечень официальных индикаторов/публикаций для последующего обновления и решение, которое изменение индикатора может затронуть. Не создавать автоматически мониторинг или расписание.
  verification: |-
    Источник и наблюдаемый признак определены конкретно; дата следующего просмотра — предложение, не активная задача.
  output: monitoring_items
- step: 09.9 Продуктовый итог
  procedure: |-
    Выдать только те изменения продукта/бизнес-модели, которые следуют из воздействия: совместимость, альтернативный стек, новая комплектация, отказ от географии/сегмента. Отделить от коммуникационных выводов.
  verification: |-
    Не подменять анализ среды перечнем действий PR/рекламной кампании.
  output: product_strategic_implications
russian_digital_market: |-
  Особенно значимы различные режимы госзакупок, технологический суверенитет, требования отдельных крупных покупателей к отечественному стеку, отраслевое регулирование, обработка персональных данных и трансграничная передача, если фактически есть такой контур. Нужно проверять применимость конкретного требования к конкретному продукту и действующую редакцию нормы: универсальных правил «для всех цифровых сервисов» нет. Экономические факторы — инфляция, зарплаты, стоимость инфраструктуры и изменение покупательских бюджетов, технологические — импортные зависимости, доступность оборудования/моделей/облака. Экологический фактор может быть малосущественным для небольшого SaaS, но существенным для ЦОД или энергоменеджмента.
interpretation_rules: |-
  PESTEL — систематизация внешних доказательств с причинной логикой. Он не доказывает потребность клиента и не равен правовому аудиту. Содержательная значимость важнее заполнения всех шести клеток: отсутствие релевантного подтвержденного экологического риска лучше выдуманного. Сценарии и проекты нормативных актов отделять от действующих норм.
quality_control:
  global_data_checks:
  - Проверять существование исходного файла, dataset_id, паспорт и версию; каталог сам по себе не подтверждает значения.
  - 'Сопоставлять единицу наблюдения: компания, ИП, субъект МСП, домохозяйство, человек или пользователь 15+.'
  - Проверять дату, территорию, классификатор, числитель, знаменатель и охват выборки перед соединением таблиц.
  - При суммировании регионов исключать пересечения территорий и вложенные автономные округа; предпочитать национальный
    итог издателя.
  - Не объединять доли из разных генеральных совокупностей без отдельного, проверяемого обоснования.
  - Отличать отсутствие данных от числового нуля; не восстанавливать несуществующие совместные разрезы.
  - Помечать синтетические примеры как учебные, выводы и оценки — по уровню подтверждения.
  - Не утверждать существование работающего внешнего коннектора только потому, что источник описан в каталоге.
  method_specific:
  - Каждый фактор имеет группу, источник и дату
  - Для юридических факторов указан статус и применимость к продукту
  - Отмечены уровни подтвержденности и прогнозный характер
  - Есть причинный механизм влияния на продукт
  - Нет безусловного правового совета без проверки
  - Пересекающиеся группы факторов не суммируются как независимые
  - Нет искусственно заполненных нерелевантных факторов
  anti_patterns:
  - Применимость закона провозглашена без ссылки и даты редакции
  - Список мировых IT-трендов без продуктового механизма
  - Не указана дата измерения экономического показателя
  - Прогноз или проект законопроекта записан как факт
  - Экофактор придуман ради заполнения шаблона
  - Внутренние управленческие проблемы ошибочно названы внешней средой
  - Маркетинговые каналы подменяют продуктовые последствия
  stop_if: 'Не выводить численное заключение, если требуется отсутствующая генеральная совокупность, база пересчета,
    существенный коэффициент или независимое подтверждение: пометить результат partial/hypothesis_only/insufficient_data.'
structured_analytical_result:
  note: Схема результата — перечень логических полей, не самостоятельная JSON Schema; значения формируются при реальном
    применении.
  top_level_required:
  - method_id
  - case_id
  - analysis_date
  - product_context
  - status
  - inputs_used
  - outputs
  - evidence_register
  - assumptions_and_gaps
  - interpretation
  - quality_checks
  - expert_decision_required
  method_fields:
  - field: context
    type: object
    required: true
  - field: factors
    type: array[{category,description,status,source_id,as_of,mechanism,affected_metric,importance,evidence_grade}]
    required: true
  - field: opportunities
    type: array[object]
    required: true
  - field: risks
    type: array[object]
    required: true
  - field: scenarios
    type: array[object]
    required: true
  - field: product_actions
    type: array[object]
    required: true
  - field: indicators_to_watch
    type: array[object]
    required: true
  evidence_standard:
    record_type: evidence
    required_fields:
    - 'evidence_id: уникальный ID'
    - 'claim_or_parameter_id: идентификатор вывода/параметра'
    - 'evidence_type: observed_fact | computed | interpretation | assumption | expert_assertion'
    - 'source_title: первоисточник или файл эксперта'
    - 'source_url_or_file_id: прямой путь/ID либо null с причиной'
    - 'dataset_id_and_version: если использован локальный набор'
    - 'date_observed_or_published: исходный год/дата'
    - 'retrieved_at: дата обращения, если внешняя веб-страница'
    - 'geography_and_population: географический охват, совокупность и знаменатель'
    - 'value_unit_formula_filters: значение, единица, формула и фильтры по возможности'
    - 'limitations: методические ограничения, в том числе наличие/отсутствие независимой проверки'
    integrity_rule: |-
      Ни один существенный численный вывод не должен существовать только как текст без ссылки на исходные показатели; предположения, суждения эксперта и наблюдаемые факты не являются одним типом доказательства. Нельзя присваивать статистический статус маркетинговым догадкам. Нельзя выдумывать цену, долю рынка, интервью, цитату, количественную частоту потребности или конверсию.
  status_values:
  - value: complete_with_evidence
    meaning: все существенные шаги проведены; источники и ограничения доступны
  - value: partial
    meaning: проведена подтвержденная часть; неопределенности и пробелы указаны
  - value: hypothesis_only
    meaning: получена проверяемая модель или гипотеза, но нет необходимых наблюдений
  - value: insufficient_data
    meaning: без ключевых данных выполнение метода недостоверно
  - value: not_applicable
    meaning: метод неприменим к задаче; причина записана
  serialization_policy: Числа как числа, не строки; отдельно валюты, периоды, единицы, знаменатели; null при неизвестном
    значении; дата и URL исходного источника; никаких фабрикованных данных
worked_example:
  is_synthetic: true
  case: Условный облачный сервис для российских промышленных заказчиков
  inputs:
  - У продукта есть зависимость от зарубежного API (условный факт о продукте)
  - У крупных заказчиков есть требования к интеграции и хранению данных (условное описание закупки)
  - Текущая нормативная применимость не проверена
  procedure:
  - 'Технологический фактор: зависимость от API → риск изменения доступа → необходимость альтернативной архитектуры.'
  - 'Правовой фактор: сформировать запрос проверки конкретных данных и сценария обработки, не объявлять запрет автоматически.'
  - 'Экономический фактор: рост стоимости инфраструктуры повлияет на валовую маржу; величина пока неизвестна.'
  - Отметить всё как сценарное/непроверенное до получения первичных условий и правовой проверки.
  output: Реестр факторов, причинных связей и проверок, без правовых выводов на основе гипотез.
  not_real_data_warning: Пример не устанавливает актуальные нормы права или реальные изменения доступа.
