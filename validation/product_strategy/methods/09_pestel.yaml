  external_data_candidates:
  - 'Росстат: экономические и технологические показатели'
  - Официальные тексты нормативных правовых актов и публикации уполномоченных органов
  - 'Банк России: макроэкономические показатели там, где релевантны'
  - 'Минцифры: технологические и отраслевые документы'
