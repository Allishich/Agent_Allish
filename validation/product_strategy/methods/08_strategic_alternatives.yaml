meta:
  schema_version: '1.0'
  method_id: M08
  slug: strategic_alternatives_mcda
  title: Сравнительная оценка стратегических альтернатив (MCDA и сценарный анализ)
  language: ru
  version: 1.0.1
  prepared_on: '2026-11-21'
  method_family: Выбор продуктового направления
  document_status: полная методологическая спецификация; не отчет по конкретному продукту
  editorial_license_note: Оригинальное изложение общепринятых методов; тексты SKILL.md Dean Peters не воспроизводятся
role:
  goal: |-
    Сопоставить минимум два–три выполнимых варианта продуктовых решений по заранее определённым целям, обязательным ограничениям, измеримым критериям и неопределённости, включая вариант «оставить как есть / отложить». Обеспечить воспроизводимость итогового ранга и чувствительность к экспертным весам.
  questions:
  - Какие взаимно различимые альтернативы реально доступны?
  - Каким измеримым целям и ограничениям должна отвечать стратегия?
  - Какой вариант выглядит лучше при подтвержденных данных и допустимых допущениях?
  - Насколько решение меняется при пересмотре весов или неопределённых параметров?
  applicability:
  - Выбор ниши/сегмента
  - Решение launch/expand/maintain/stop
  - Сравнение SaaS и on-prem
  - Выбор продуктовых инвестиций
  not_applicable_when:
  - Нет реальных альтернатив и нельзя определить предмет выбора
  - Решение требует обязательного прохождения закона/ограничения, а предлагается компенсировать нарушение высоким баллом
  mode: Самостоятельный метод; не требует выполнения других 9 методов
  scope_boundary: |-
    Предмет — продуктовая стратегия цифрового продукта для российского рынка. Выбор каналов продвижения, медиаплан и коммуникационные сообщения не являются результатом данного метода. Метод не принимает решений за эксперта: фиксирует варианты и их фактическую обоснованность.
theory:
  concepts:
  - term: MCDA
    meaning: Многокритериальный анализ альтернатив; полезен при немонетизируемых критериях и нескольких целях.
  - term: Feasibility gate
    meaning: 'Некомпенсируемое обязательное условие: законность, допустимый бюджет, критическая техническая возможность.'
  - term: Criterion
    meaning: Определенная характеристика альтернативы с направлением предпочтения, единицей, шкалой и источником.
  - term: Weight
    meaning: Экспертная относительная важность критерия; это не оценка вероятности и не статистический факт.
  - term: Sensitivity
    meaning: Пересчет ранга при изменении весов, баллов, параметров и сценариев.
  - term: Dominance
    meaning: Вариант не хуже другого по всем критериям и строго лучше хотя бы по одному, если сравнение корректно.
  formulas:
  - name: Нормирование весов
    expression: w_i = raw_weight_i / sum_j(raw_weight_j)
    units: доля 0..1
    conditions: |-
      Веса неотрицательны; их сумма положительна; вес задан экспертом.
    interpretation: |-
      Сопоставимая относительная важность.
  - name: Взвешенная оценка
    expression: Score(option) = sum_i(w_i * normalized_score(option,i))
    units: условных баллов
    conditions: |-
      Каждый критерий на заранее определенной шкале, пропуски и жесткие ограничения разобраны отдельно; баллы не являются фактами.
    interpretation: |-
      Условный ранг при согласованных предпочтениях и шкалах.
  - name: Изменение ранга
    expression: delta_score = Score_A - Score_B
    units: условных баллов
    conditions: |-
      Результат действителен для конкретной версии весов; при иных предпочтениях может поменяться знак.
    interpretation: |-
      Разница в условном балле не является денежным эффектом.
input_contract:
  mandatory:
  - field: decision_objective
    definition: Конкретная стратегическая цель и горизонт выбора
    data_type: text
    preferred_source: Эксперт
    if_missing: Зафиксировать отсутствие; не подменять догадкой
  - field: alternatives
    definition: Минимум 2–3 реалистичных варианта, включая бездействие/сохранение текущей модели
    data_type: array[option_id]
    preferred_source: Эксперт и анализ продукта
    if_missing: Зафиксировать отсутствие; не подменять догадкой
  - field: hard_constraints
    definition: Нарушение которых делает альтернативу неприемлемой
    data_type: text
    preferred_source: Эксперт, техтребования, проверяемое регулирование
    if_missing: Зафиксировать отсутствие; не подменять догадкой
  - field: criterion_list
    definition: Малый набор непересекающихся критериев, определения шкал и направления
    data_type: array[criterion_id]
    preferred_source: Совместно с экспертом
    if_missing: Зафиксировать отсутствие; не подменять догадкой
  - field: criterion_evidence
    definition: Факты и допущения по каждой альтернативе и критерию
    data_type: text
    preferred_source: Результаты анализа рынка, цены, ресурсы, исследования
    if_missing: Зафиксировать отсутствие; не подменять догадкой
  helpful:
  - field: weights
    definition: Относительные веса после обсуждения различий важности
    data_type: array[nonnegative_number]
    preferred_source: Явное решение эксперта, не вычислять из вкуса LLM
    if_missing: Зафиксировать отсутствие; не подменять догадкой
  - field: financial_scenarios
    definition: Оценка затрат, выручки, сроков, эффекта по каждому варианту
    data_type: text
    preferred_source: Проверяемая модель, бюджет эксперта
    if_missing: Зафиксировать отсутствие; не подменять догадкой
  - field: risk_scenarios
    definition: Консервативные и оптимистические значения неопределенных показателей
    data_type: text
    preferred_source: Явные допущения и эксперт
    if_missing: Зафиксировать отсутствие; не подменять догадкой
  expert_inputs:
  - Цели стратегии
  - Варианты и предел бюджета
  - Согласованные веса и неприемлемые риски
  - Горизонт решения
