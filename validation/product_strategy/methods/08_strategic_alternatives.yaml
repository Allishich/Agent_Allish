  data_use_rule: |-
    Указанные наборы «Рыночного агента» являются кандидатами, а не готовыми значениями. По каждому необходимы доступ к CSV, паспорт, первоисточник, проверка охвата, года и знаменателя; использовать только действительно совместимые наблюдения. Статистика 2020–2024 и публикации 2025 года не должна представляться как измерение 2026 года.
procedure:
- step: 08.1 Установить решение
  procedure: |-
    Записать, что именно требуется выбрать, кто утверждает выбор, к какому горизонту относится анализ и какие факторы неизменяемы.
  verification: |-
    Не смешивать выбор направления рынка и выбор отдельной функции без явного уровня.
  output: decision_scope
- step: 08.2 Сформировать альтернативы
  procedure: |-
    Выделить не менее трех содержательно различимых опций, обычно «сохранить», «развивать A», «развивать B/отказаться». Для каждой описать ресурсы, предполагаемый продуктовый результат и ключевые зависимости.
  verification: |-
    Не строить искусственных альтернатив с заведомо неравными ограничениями, чтобы получить заранее выбранного победителя.
  output: options
- step: 08.3 Некомпенсируемые условия
  procedure: |-
    Установить обязательные ограничения: бюджетный потолок, применимый закон, технические требования, срок. Отсеять или отдельно обозначить недопустимые альтернативы до начисления баллов.
  verification: |-
    Стратегия не становится приемлемой от высокой выручки, если она неосуществима по обязательному требованию.
  output: feasibility_matrix
- step: 08.4 Критерии и шкалы
  procedure: |-
    Выбрать 4–7 критериев: подтвержденная потребность, достижимый рынок, маржинальность, риск реализации, стоимость, время, способность обслуживать. Для каждого определить направление предпочтения, единицу и уровни шкалы 0–5 с якорными определениями.
  verification: |-
    Не допускать двух критериев, оценивающих одно и то же с двойным весом, например «TAM» и «размер сегмента» без различения.
  output: criteria_and_scales
- step: 08.5 Таблица фактов
  procedure: |-
    Для каждой пары «вариант × критерий» внести измеренное значение или экспертную оценку с evidence_type, источником и точностью. Неизвестные ставить null; не назначать средний балл «3 из 5» для отсутствующего показателя.
  verification: |-
    Источники несопоставимых периодов/совокупностей не дают общего балла без нормализации.
  output: evidence_scorecard
- step: 08.6 Весовые предпочтения
  procedure: |-
    Получить у эксперта веса критериев и обоснование. Нормировать сумму до единицы, зафиксировать версию весов, разграничить экспертную важность и эмпирические оценки.
  verification: |-
    Веса не статистические вероятности; их нельзя генерировать как объективные отраслевые коэффициенты.
  output: weight_set
- step: 08.7 Расчет
  procedure: |-
    В случае полных сопоставимых баллов вычислить взвешенную сумму, проверить доминирование и исключенные варианты. При пропусках показывать частичный порядок, диапазон результата либо неопределенность вместо численного победителя.
  verification: |-
    Не присваивать недостающим значениям нули; проверять ориентацию шкал «больше — лучше» и «меньше — лучше».
  output: ranking
- step: 08.8 Устойчивость
  procedure: |-
    Пересчитать результаты при изменении существенных весов (например ±20% относительного веса с последующей нормировкой) и ключевых исходных параметров. Выявить точки переключения лидера и варианты, доминирующие во всех сценариях.
  verification: |-
    Если лидер меняется от небольшого изменения веса, рекомендация должна быть условной.
  output: sensitivity
- step: 08.9 Решение эксперта
  procedure: |-
    Показать сравнимые плюсы/минусы, уровень доказательств, ограничения, предпочтение при исходных весах и условия, изменяющие рекомендацию. Зафиксировать неиспользованные варианты и мотивы их отклонения.
  verification: |-
    Метод поддерживает решение, но не подменяет ответственность эксперта.
  output: recommendation_basis
russian_digital_market: |-
  Варианты для российского ПО могут различаться схемой поставки, условиями корпоративных закупок, возможностью работы в закрытых сетях, требованиями заказчика к реестрам, отечественным компонентам и платежным процедурам. Применимость каждого условия должна быть подтверждена конкретным сценарием, а не предположена для всех продуктов. Данные о количестве компаний, частоте использования цифровых технологий и расходах Росстата могут быть источниками только отдельных критериев. Продуктовые инвестиции оцениваются в реальных рублях, с периодом, инфляцией и рисками доступа к технологиям.
interpretation_rules: |-
  Числовой рейтинг отражает заданные предпочтения, а не абсолютную объективную «лучшую стратегию». При слабой доказательной базе возможна только условная рекомендация с указанием переключающих условий. MCDA дополняет экономическую оценку, но не заменяет расчет окупаемости, обязательное соответствие праву и анализ критических рисков.
quality_control:
  execution_clarifications:
    - "Если эксперт не предоставил веса критериев и их обоснование, не назначать равные или «типовые» веса по умолчанию; допустимо только качественное сравнение альтернатив и запрос экспертного решения."
    - "Взвешенный числовой итог рассчитывать только при заданных шкалах, сопоставимых оценках и нормированных весах; неизвестные оценки не преобразовывать в нули."
  global_data_checks:
  - Проверять существование исходного файла, dataset_id, паспорт и версию; каталог сам по себе не подтверждает значения.
  - 'Сопоставлять единицу наблюдения: компания, ИП, субъект МСП, домохозяйство, человек или пользователь 15+.'
  - Проверять дату, территорию, классификатор, числитель, знаменатель и охват выборки перед соединением таблиц.
  - При суммировании регионов исключать пересечения территорий и вложенные автономные округа; предпочитать национальный
    итог издателя.
  - Не объединять доли из разных генеральных совокупностей без отдельного, проверяемого обоснования.
  - Отличать отсутствие данных от числового нуля; не восстанавливать несуществующие совместные разрезы.
  - Помечать синтетические примеры как учебные, выводы и оценки — по уровню подтверждения.
  - Не утверждать существование работающего внешнего коннектора только потому, что источник описан в каталоге.
  method_specific:
  - Есть реалистичная контрольная альтернатива
  - Жесткие ограничения проверены до баллов
  - Критерии не дублируют друг друга
  - У каждой оценки метка факта/эксперта/гипотезы
  - Проведен пересчет при изменении весов и неопределенностей
  - Если статус incomplete, объявление победителя запрещено
  anti_patterns:
  - Баллы придуманы моделью без шкал
  - Невозможный вариант получил высокую оценку за выгодность
  - Неизвестный показатель стал нулем
  - Двойной вес одного фактора
  - Результат представлен без чувствительности
  - Произвольные веса объявлены объективными
  - Не включен сценарий «не менять»
  stop_if: 'Не выводить численное заключение, если требуется отсутствующая генеральная совокупность, база пересчета,
    существенный коэффициент или независимое подтверждение: пометить результат partial/hypothesis_only/insufficient_data.'
structured_analytical_result:
  note: Схема результата — перечень логических полей, не самостоятельная JSON Schema; значения формируются при реальном
    применении.
  top_level_required:
  - method_id
  - case_id
  - analysis_date
  - product_context
  - status
  - inputs_used
  - outputs
  - evidence_register
  - assumptions_and_gaps
  - interpretation
  - quality_checks
  - expert_decision_required
  method_fields:
  - field: decision_scope
    type: object
    required: true
  - field: alternatives
    type: array[object]
    required: true
  - field: hard_constraints
    type: array[object]
    required: true
  - field: criteria
    type: array[criterion_id,definition,unit,scale,direction,weight]
    required: true
  - field: scores
    type: array[option_id,criterion_id,raw_value,normalized_value,evidence_id]
    required: true
  - field: feasible_options
    type: array[option_id]
    required: true
  - field: ranked_options
    type: array[object]|null
    required: true
  - field: sensitivity
    type: array[object]
    required: true
  - field: expert_decision_log
    type: object|null
    required: true
  evidence_standard:
    record_type: evidence
    required_fields:
    - 'evidence_id: уникальный ID'
    - 'claim_or_parameter_id: идентификатор вывода/параметра'
    - 'evidence_type: observed_fact | computed | interpretation | assumption | expert_assertion'
    - 'source_title: первоисточник или файл эксперта'
    - 'source_url_or_file_id: прямой путь/ID либо null с причиной'
    - 'dataset_id_and_version: если использован локальный набор'
    - 'date_observed_or_published: исходный год/дата'
    - 'retrieved_at: дата обращения, если внешняя веб-страница'
    - 'geography_and_population: географический охват, совокупность и знаменатель'
    - 'value_unit_formula_filters: значение, единица, формула и фильтры по возможности'
    - 'limitations: методические ограничения, в том числе наличие/отсутствие независимой проверки'
    integrity_rule: |-
      Ни один существенный численный вывод не должен существовать только как текст без ссылки на исходные показатели; предположения, суждения эксперта и наблюдаемые факты не являются одним типом доказательства. Нельзя присваивать статистический статус маркетинговым догадкам. Нельзя выдумывать цену, долю рынка, интервью, цитату, количественную частоту потребности или конверсию.
  status_values:
  - value: complete_with_evidence
    meaning: все существенные шаги проведены; источники и ограничения доступны
  - value: partial
    meaning: проведена подтвержденная часть; неопределенности и пробелы указаны
  - value: hypothesis_only
    meaning: получена проверяемая модель или гипотеза, но нет необходимых наблюдений
  - value: insufficient_data
    meaning: без ключевых данных выполнение метода недостоверно
  - value: not_applicable
    meaning: метод неприменим к задаче; причина записана
  serialization_policy: Числа как числа, не строки; отдельно валюты, периоды, единицы, знаменатели; null при неизвестном
    значении; дата и URL исходного источника; никаких фабрикованных данных
worked_example:
  is_synthetic: true
  case: Условный выбор направления для сервиса учёта заявок
  inputs:
  - 'А: сохранить текущий B2B SaaS'
  - 'B: разработать on-prem редакцию'
  - 'C: выйти в новый B2C сегмент'
  - 'Два критерия (для примера): соответствие потребности, реализуемость; веса 0.6 и 0.4'
  - 'Баллы: A=(4,5), B=(5,2), C=(2,2) по субъективной шкале 0–5'
  procedure:
  - Score_A=0.6×4+0.4×5=4.4; Score_B=0.6×5+0.4×2=3.8; Score_C=0.6×2+0.4×2=2.0.
  - 'При иных весах (0.9/0.1): A=4.1, B=4.7; победитель меняется.'
  - Следовательно выбор А неустойчив к предпочтениям эксперта, без данных о доступном рынке и затратах вывод условный.
  output: Сравнение трех вариантов, весов и sensitivity; решение экспертное.
  not_real_data_warning: Баллы полностью учебные и не отражают реальных предпочтений российского рынка.
