meta:
  schema_version: '1.0'
  method_id: M16
  slug: choice_based_conjoint
  title: Conjoint-анализ предпочтений к характеристикам продукта
  language: ru
  version: 1.0.1
  prepared_on: '2026-11-21'
  method_family: Моделирование заявленного выбора
  method_group: new_product_idea
  document_status: самостоятельная прикладная методика, не отчёт о продукте
  reuse_policy: Самостоятельное изложение классического метода; тексты сторонних SKILL.md не копируются.
role:
  goal: Измерить относительные предпочтения между конфигурациями цифрового продукта, а не просто ранжировать
    список функций.
  decision_question: Какие сочетания характеристик и цен стоит тестировать и предлагать рынку?
  applicability:
  - Выбор комплектации цифрового продукта
  - Сравнение условий SaaS / on-premise / поддержки / интеграций
  - Отдельные продуктовые сегменты с различиями в компромиссах
  not_applicable_when:
  - Нет возможности подготовить корректный экспериментальный план или набрать необходимую выборку
  - Нужны только качественные причины поведения — начать с интервью
  autonomy: Самостоятельный метод; не требует применения остальных 20 методов.
  scope_boundary: Продуктовая стратегия цифрового продукта для российского рынка; не медиаплан, не копирайтинг,
    не разработка рекламной кампании.
theory:
  concepts:
  - term: Choice-based conjoint (CBC)
    meaning: Участники выбирают одну из нескольких конфигураций, составленных по экспериментальному плану.
  - term: Part-worth utility
    meaning: Оценка вклада уровней атрибутов в заявленный выбор внутри принятой модели.
  - term: None option
    meaning: Вариант «ни один» в задаче выбора, если он соответствует реальной ситуации.
  formulas: []
input_contract:
  minimum:
  - 3–6 осмысленных характеристик, включая цену при ценовой задаче
  - Правдоподобные уровни характеристик
  - План наборов выбора и балансировки
  - Выборка покупателей, понимающих категорию продукта
  optional:
  - Ограничения технической совместимости конфигураций
  - Разделение респондентов по сегментам
  public_data_role: Внешние статистические данные помогают оценить размер сегментов, но не могут подменить индивидуальные
    ответы на задачи выбора.
expert_instruction:
  purpose: 'Краткая инструкция человеку: выполнить только недоступные консультанту действия и передать исходные
    сведения.'
  steps:
  - step: 1
    action: Совместно с экспертом выбрать ограниченный набор значимых характеристик, убедиться, что уровни реалистичны
      и взаимно не противоречат.
  - step: 2
    action: Подготовить экспериментальный дизайн заданий выбора; проверку идентифицируемости, мощности и объёма
      выборки поручить аналитику/использовать специализированное ПО.
  - step: 3
    action: 'Провести пилот: участники понимают характеристики, задания не перегружены, конфигурации действительно
      сравнимы.'
  - step: 4
    action: Показать целевым покупателям случайно/сбалансированно распределённые наборы альтернатив; при необходимости
      предложить «ничего не покупать».
  - step: 5
    action: Сохранить для каждого задания полный набор характеристик предъявленных альтернатив и фактический
      выбор, а не только сводный ответ.
  - step: 6
    action: Передать сырые выборы, экспериментальный дизайн, метаданные выборки и описание всех ограничений.
  minimum_record_fields:
  - respondent_id
  - segment
  - task_id
  - design_version
  - alternative_id
  - attribute_levels
  - offered_price
  - chosen_alternative
  - none_option_available
  - task_order
  - sampling_frame
  data_transfer_rule: Предавать исходные записи/таблицы и определения полей с информацией о способе сбора, периоде,
    пропусках и ограничениях. По возможности псевдонимизировать людей и организации; доступ к исходникам ограничить.
analytical_procedure:
  quality_checks_before_analysis:
  - Проверить идентифицируемость атрибутов, отсутствие доминирующих альтернатив и качество ответов.
  - Нельзя суммировать utility по разным моделям и сравнивать их абсолютные значения без нормировки.
  - Малые подгруппы и неслучайный набор не дают автоматически общерыночные доли.
  steps:
  - Проверить полноту long-format матрицы респондент × задание × альтернатива.
  - Оценить модель дискретного выбора (например, условный логит) при выполненных предпосылках; при сложном дизайне
    привлечь специалиста.
  - Оценить относительные эффекты уровней, неопределённость, различия сегментов и сценарии выбора.
  - Сформулировать проверки реальными продажами; не объявлять моделируемую долю фактической рыночной долей.
russian_digital_market: Для российского корпоративного ПО учитывать локализацию данных, совместимость с используемыми
  системами, требования ИБ, модели лицензирования и внедрения. Исключать невозможные сочетания условий и некорректно
  сопоставленные зарубежные варианты.
interpretation_rules:
- 'Комплексный статистический метод: для первого применения желателен специалист по дизайну CBC.'
- Это заявленный выбор в сконструированных сценариях, а не фактическая покупка.
quality_control:
  execution_clarifications:
    - "Перед оценкой проверять уникальность (респондент, задание, альтернатива), ровно один выбранный вариант в каждом полном задании (если дизайн не предусматривает иной формат), полноту набора альтернатив и отсутствие неидентифицируемых/идеально коллинеарных характеристик."
    - "Явно записывать схему кодирования уровней (reference/effects), базовую категорию, наличие outside-option, спецификацию utility и правило масштабирования цены; при фиксированном наборе допустим условный логит при выполнении предпосылок."
    - "Отчётные сценарные вероятности — условные прогнозы при конкретном наборе альтернатив; без внешней калибровки нельзя интерпретировать их как фактические рыночные доли или подтверждённые продажи. При неидентифицируемости модели статус partial/insufficient_data вместо выдуманных коэффициентов."
  common_gates:
  - У исследования есть конкретный вопрос и решение, для которого собираются данные.
  - Источник каждого вывода прослеживается до исходного наблюдения, анкеты или расчёта.
  - Ненаблюдаемые величины, гипотезы и ограничения явно маркируются; недостающее не подменяется выдуманными
    значениями.
  - Не переносить результаты нерепрезентативной выборки на всё население или рынок России.
  - При обработке персональных данных определить законное основание, минимизацию состава данных, права участников,
    безопасность и сроки хранения.
  completion_gates:
  - У исходных записей установлены единица наблюдения, дата, источники и условия измерения.
  - Показатели воспроизводимы; знаменатели и исключения записаны.
  - Применение метода не подменяется предположениями, когда требуется внешний сбор.
  - Честно записаны ограничения причинности, выборки и переносимости результатов.
structured_analytical_result:
  serialization_target: JSON после применения метода; эта методическая спецификация остаётся YAML.
  required_common_fields:
  - method_id
  - case_id
  - product_scope
  - data_collection_status
  - analysis_status
  - period
  - observations_count
  - inputs_and_source_refs
  - method_findings
  - quality_warnings
  - assumptions
  - limitations
  - decision_implications
  method_specific_fields:
  - design_and_sample
  - model_specification
  - partworth_or_coefficients
  - uncertainty
  - simulated_scenarios
  - model_limitations
  possible_statuses:
  - not_started
  - data_collection_needed
  - partial
  - completed_with_evidence
  - not_applicable
  no_report_rule: Выход — структурированные факты и выводы, не готовая презентация или рекламный текст.
worked_example:
  synthetic: true
  situation: Выбор тарифа корпоративного SaaS.
  expert_action: Покупатели сравнивали сочетания цены, интеграций, размещения и поддержки.
  structured_result: Оценённые эффекты характеристик и сценарное распределение заявленного выбора с погрешностью
    и оговорками.
related_core_methods_optional:
- M01 STP
- M06 Value Proposition Canvas
- M07 Business Model Canvas
