  no_report_rule: Выход — структурированные факты и выводы, не готовая презентация или рекламный текст.
worked_example:
  synthetic: true
  situation: Тариф сервиса учёта заявок для российских организаций.
  expert_action: Предъявил фиксированное описание тарифа и собрал ценовые пороги в рублях за организацию в месяц.
  structured_result: Распределения порогов, сегментные различия и гипотезы ценового теста; без утверждения оптимальной
    цены.
