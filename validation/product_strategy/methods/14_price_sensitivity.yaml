meta:
  schema_version: '1.0'
  method_id: M14
  slug: price_sensitivity
  title: Исследование ценовой чувствительности
  language: ru
  version: 1.0.1
  prepared_on: '2026-11-21'
  method_family: Оценка ценового восприятия
  method_group: new_product_idea
  document_status: самостоятельная прикладная методика, не отчёт о продукте
  reuse_policy: Самостоятельное изложение классического метода; тексты сторонних SKILL.md не копируются.
role:
  goal: Изучить воспринимаемые ценовые границы и предпочтения, не выдавая опрос за установленную рыночную цену
    или фактическую готовность платить.
  decision_question: Какие ценовые гипотезы следует проверить в реальной продаже или пилоте?
  applicability:
  - Новая платная функция цифрового продукта
  - Выбор предварительного ценового диапазона
  - Сопоставление моделей подписки/лицензии
  not_applicable_when:
  - Цена уже тестируется на реальных сделках с контролем условий — полезнее анализ продаж или эксперимент
  - Нет единой единицы цены и состава предложения
  autonomy: Самостоятельный метод; не требует применения остальных 20 методов.
  scope_boundary: Продуктовая стратегия цифрового продукта для российского рынка; не медиаплан, не копирайтинг,
    не разработка рекламной кампании.
theory:
  concepts:
  - term: Price Sensitivity Meter
    meaning: 'Подход Ван Вестендорпа: восприятие четырёх границ цен; пересечения распределений не равны оптимуму
      выручки.'
  - term: Gabor–Granger
    meaning: Последовательная проверка декларируемой вероятности покупки при разных ценах; ответ не равен поведению.
  formulas: []
input_contract:
  minimum:
  - Единица цены (за пользователя/организацию/месяц/лицензию)
  - Фиксированное содержимое тарифа
  - Целевая роль покупателя
  - Определённая процедура ценового исследования
  optional:
  - Сведения о реально сопоставимых ценах конкурентов
  - Платёжные данные существующих покупателей
  public_data_role: Базовая статистика показывает состав клиентского рынка, но не содержит готовности платить
    за конкретное ПО.
expert_instruction:
  purpose: 'Краткая инструкция человеку: выполнить только недоступные консультанту действия и передать исходные
    сведения.'
  steps:
  - step: 1
    action: Определить, кто платит, за что и как часто; исключить смешение НДС, валют, разового внедрения и
      подписки.
  - step: 2
    action: 'Выбрать конкретный дизайн: Ван Вестендорп для восприятия диапазона либо Gabor–Granger для оценок
      заявленного намерения при ценах.'
  - step: 3
    action: Показать одинаковый состав продукта каждому участнику; собрать ответы в единой валюте и единицах
      измерения.
  - step: 4
    action: Зафиксировать сектор, должность покупателя, текущие затраты на альтернативу и условия предъявления
      цены.
  - step: 5
    action: Передать обезличенные сырые ответы, описания тарифов, способ отбора и протокол исследования.
  minimum_record_fields:
  - respondent_id
  - buyer_role
  - segment
  - method
  - offer_version
  - currency
  - price_unit
  - vat_treatment
  - price_answer_or_threshold
  - recruitment_frame
  - date
  data_transfer_rule: Предавать исходные записи/таблицы и определения полей с информацией о способе сбора, периоде,
    пропусках и ограничениях. По возможности псевдонимизировать людей и организации; доступ к исходникам ограничить.
analytical_procedure:
  quality_checks_before_analysis:
  - Проверить логический порядок четырёх порогов PSM и единицы цены.
  - Не использовать средний ответ как доказанную рыночную цену.
  - Отмечать малую/смещённую выборку, гипотетическое смещение и неизвестную платёжеспособность.
  steps:
  - Нормализовать ценовые ответы и исключить только документированно ошибочные записи.
  - Для PSM строить кумулятивные кривые и определять пересечения согласно выбранной методике; не обозначать
    их максимумом выручки.
  - Для Gabor–Granger сопоставить декларируемые доли и условные сценарии выручки с оговоркой о слабой предсказательной
    силе.
  - Составить диапазон/варианты для последующего фактического тестирования цены.
russian_digital_market: Для российского B2B отдельно учитывать рубли, НДС, годовую/помесячную оплату, внедрение,
  сопровождение, число рабочих мест, лицензионный договор и процедуры закупки; не считать их одинаковыми ценовыми
  предложениями.
interpretation_rules:
- Результат исследует заявленные представления о цене, а не причинный спрос.
- Цена конкурента без одинакового объёма функций и поддержки не является надёжной базой.
quality_control:
  execution_clarifications:
    - "Для Van Westendorp использовать четыре ответа на одной сопоставимой ценовой шкале: слишком дёшево, дёшево/выгодно, дорого, слишком дорого; проверять их индивидуальный порядок и явно отмечать нарушение."
    - "Зафиксировать направление кумулятивных кривых: «слишком дёшево» и «дёшево» — обратные накопленные доли P(answer >= price); «дорого» и «слишком дорого» — прямые накопленные доли P(answer <= price). Пересечения определять для этих явно заданных кривых с указанием способа интерполяции между точками."
    - "Не объявлять пересечения PSM оптимумом фактической выручки; если пересечение отсутствует или неоднозначно, указывать неопределённый результат, а не подменять его ближайшей произвольной ценой."
  common_gates:
  - У исследования есть конкретный вопрос и решение, для которого собираются данные.
  - Источник каждого вывода прослеживается до исходного наблюдения, анкеты или расчёта.
  - Ненаблюдаемые величины, гипотезы и ограничения явно маркируются; недостающее не подменяется выдуманными
    значениями.
  - Не переносить результаты нерепрезентативной выборки на всё население или рынок России.
  - При обработке персональных данных определить законное основание, минимизацию состава данных, права участников,
    безопасность и сроки хранения.
  completion_gates:
  - У исходных записей установлены единица наблюдения, дата, источники и условия измерения.
  - Показатели воспроизводимы; знаменатели и исключения записаны.
  - Применение метода не подменяется предположениями, когда требуется внешний сбор.
  - Честно записаны ограничения причинности, выборки и переносимости результатов.
