meta:
  schema_version: '1.0'
  method_id: M04
  slug: competitive_benchmarking
  title: Сравнительный анализ конкурентов и заменителей (competitive benchmarking)
  language: ru
  version: 1.0.1
  prepared_on: '2026-11-21'
  method_family: Сравнение продуктовых предложений
  document_status: полная методологическая спецификация; не отчет по конкретному продукту
  editorial_license_note: Оригинальное изложение общепринятых методов; тексты SKILL.md Dean Peters не воспроизводятся
role:
  goal: |-
    Системно сравнить конкретное цифровое предложение с проверяемыми альтернативами на одинаковых критериях: решаемые клиентские задачи, цена и единица тарификации, функциональная пригодность, интеграции, эксплуатация, ограничения и подтверждённые признаки использования.
  questions:
  - С какими фактическими альтернативами продукт конкурирует за задачу и бюджет?
  - Какие различия подтверждены, а какие заявлены продавцами?
  - Какие свойства критичны для конкретного сегмента?
  - Какие продуктовые пробелы и преимущества подтверждаемы?
  applicability:
  - Конкуренция в существующей категории ПО
  - Проверка уникальности функции
  - Смена тарифной/функциональной конфигурации
  - Выход на новый B2B/B2C сегмент
  not_applicable_when:
  - Неизвестно, какую задачу решает продукт
  - Нужно оценить всю структуру отрасли без углубления в отдельные предложения
  mode: Самостоятельный метод; не требует выполнения других 9 методов
  scope_boundary: |-
    Предмет — продуктовая стратегия цифрового продукта для российского рынка. Выбор каналов продвижения, медиаплан и коммуникационные сообщения не являются результатом данного метода. Метод не принимает решений за эксперта: фиксирует варианты и их фактическую обоснованность.
theory:
  concepts:
  - term: Direct competitor
    meaning: Продукт, покупаемый тем же сегментом для той же основной задачи.
  - term: Substitute
    meaning: Другая форма выполнения задачи, в том числе ручная работа, электронные таблицы или внутренняя разработка.
  - term: Comparable offering
    meaning: Конкретная редакция и тариф/версия продукта в один период на одинаковой единице лицензирования.
  - term: Capability coverage
    meaning: Доказанный уровень выполнения клиентского сценария, а не простое наличие названия функции.
  - term: Unknown vs absent
    meaning: Отсутствие публичного упоминания функции не является доказательством её отсутствия.
  formulas:
  - name: Нормализованная стоимость подписки
    expression: annual_subscription_TCO = monthly_price_per_seat * seats * 12 + annual_mandatory_fees
    units: руб./год
    conditions: |-
      Одинаковая единица мест, курс/налоги и минимальный пакет; стоимость внедрения и поддержки прибавлять отдельно.
    interpretation: |-
      Сопоставимый ориентир расходов для одного сценария внедрения.
  - name: Нормализованный многолетний TCO
    expression: TCO_H = acquisition + implementation + sum_year(license_or_subscription + support + infrastructure +
      migration)
    units: рублей на H лет
    conditions: |-
      Одинаковый горизонт и функциональный контур; дисконтирование при существенном H только с названной ставкой.
    interpretation: |-
      Полная стоимость владения, не объективная цена продукта на рынке.
input_contract:
  mandatory:
  - field: reference_product
    definition: Описание нашего продукта, поставка, тарифы, версия
    data_type: text
    preferred_source: Владелец продукта
    if_missing: Зафиксировать отсутствие; не подменять догадкой
  - field: jobs_and_criteria
    definition: Проверяемые клиентские задачи и 5–12 критериев сравнения
    data_type: text
    preferred_source: Эксперт и подтвержденные customer jobs
    if_missing: Зафиксировать отсутствие; не подменять догадкой
  - field: competitor_sample
    definition: Перечень 3–8 релевантных альтернатив с критериями включения
    data_type: array[offering]
    preferred_source: Публичные источники и реестр российского ПО
    if_missing: Зафиксировать отсутствие; не подменять догадкой
  - field: source_and_date
    definition: URL/документ и дата каждого проверенного свойства
    data_type: text
    preferred_source: Официальная документация продукта, независимые тесты
    if_missing: Зафиксировать отсутствие; не подменять догадкой
  helpful:
  - field: total_cost_of_ownership
    definition: Стоимость подписки/лицензии, внедрения, поддержки, миграции на едином горизонте
    data_type: text
    preferred_source: Официальные тарифы, коммерческое предложение, эксперт
    if_missing: Зафиксировать отсутствие; не подменять догадкой
  - field: technical_specs
    definition: Интеграции, on-prem, API, требования к ОС/серверу, SLA
    data_type: text
    preferred_source: Документация
    if_missing: Зафиксировать отсутствие; не подменять догадкой
  - field: user_experiences
    definition: Отзывы с указанием выборки, времени и смещения
    data_type: text
    preferred_source: Реальные рецензии и интервью
    if_missing: Зафиксировать отсутствие; не подменять догадкой
  - field: adoption_metrics
    definition: Подтвержденное число клиентов, внедрений/пользователей
    data_type: text
    preferred_source: Финансовая отчётность, проверяемые кейсы
    if_missing: Зафиксировать отсутствие; не подменять догадкой
  expert_inputs:
  - Перечень целевых задач по приоритетности
  - Возможные технические ограничения и тендерные требования
  - Подтвержденные факты эксплуатации
  local_data_candidates:
  - dataset_id: ru_b2b_organizations_digital_expenditure_2019_2024
    possible_use: Контекст затрат на цифровизацию, не сравнение конкурентов
    critical_limit: Набор не содержит конкурентных тарифов и долей.
    data_file_url: https://drive.google.com/file/d/15JA8jg-FDRZacwRtxjKocByHkrQpsy_b/view
    data_file_drive_id: 15JA8jg-FDRZacwRtxjKocByHkrQpsy_b
    passport_url: https://drive.google.com/file/d/1k-4HItdItk8E5hexnaVOhTiz6lkIldjs/view
    source_publication: HSE_ISEK_2026
    years_in_catalog: null
    population_in_catalog: null
    denominator_in_catalog: null
    quality_status_in_catalog: official_HSE_screenshot_checked
  - dataset_id: ru_b2b_small_enterprise_digital_by_industry_2024
    possible_use: Выбор критериев цифровой совместимости в отрасли
    critical_limit: Только агрегатные показатели распространения технологий; не функция продукта.
    data_file_url: https://drive.google.com/file/d/1ITYCYdTh5OMCbgoaWAovg9blrToflt5B/view
    data_file_drive_id: 1ITYCYdTh5OMCbgoaWAovg9blrToflt5B
    passport_url: https://drive.google.com/file/d/1wFHEoM_KQQibzYFwdGo7Ab53RnBkj1_b/view
    source_publication: HSE_ISEK_2026
    years_in_catalog: null
    population_in_catalog: null
    denominator_in_catalog: null
    quality_status_in_catalog: official_HSE_screenshot_checked
  - dataset_id: RU_DIG_010
    possible_use: При анализе B2C — предпосылки доступности цифровых функций
    critical_limit: Не пользовательский тест конкретного интерфейса.
    data_file_url: https://drive.google.com/file/d/10Dhiatiysd4TTWz_hzPCTstXEkoTLaf5/view
    data_file_drive_id: 10Dhiatiysd4TTWz_hzPCTstXEkoTLaf5
