    years_in_catalog:
    - 2024
    population_in_catalog: Население 15 лет и старше в соответствующей возрастной группе
    denominator_in_catalog: Все лица соответствующей возрастной группы
    quality_status_in_catalog: published_hse_table_reproducing_rosstat_data
  external_data_candidates:
  - Реестр российского ПО — обнаружение решений, но не оценка качества
  - Официальные тарифные страницы, договоры, SLA, документация интеграций
  - Тестовые аккаунты/демонстрации с фиксацией даты и версии
  - Реальные закупочные документы и коммерческие предложения при допустимом доступе
  data_use_rule: |-
    Указанные наборы «Рыночного агента» являются кандидатами, а не готовыми значениями. По каждому необходимы доступ к CSV, паспорт, первоисточник, проверка охвата, года и знаменателя; использовать только действительно совместимые наблюдения. Статистика 2020–2024 и публикации 2025 года не должна представляться как измерение 2026 года.
procedure:
- step: 04.1 Граница сравнения
  procedure: |-
    Определить сценарий использования, сегмент, единицу продажи и продуктовую категорию. Зафиксировать бюджет, версию, масштаб использования и горизонт оценки (например, 12 месяцев).
  verification: |-
    Сопоставлять фактическое исполнение одной задачи, а не произвольную смесь IT-продуктов.
  output: comparison_scope
- step: 04.2 Отбор альтернатив
  procedure: |-
    Найти прямых игроков, нишевые продукты, расширенные платформы и минимум один заменитель «сделать иначе». Для каждого указать основание релевантности и первичный URL.
  verification: |-
    Наличие в реестре ПО только сигнал существования записи; проверить актуальную доступность и назначение.
  output: offering_sample
- step: 04.3 Критерии
  procedure: |-
    Выбрать параметры по клиентской задаче: покрытия сценариев, время внедрения, цена, миграция, API, безопасность, устойчивость поставки, поддержка, требования инфраструктуры. Описать шкалу каждого критерия и единицу цены.
  verification: |-
    Избегать оценки только по числу функций; критерии должны соответствовать целевому сегменту.
  output: comparison_dimensions
- step: 04.4 Сбор доказательств
  procedure: |-
    Заполнить матрицу по каждой паре «решение × критерий» вместе с URL, редакцией, датой и типом источника. Для качественного признака использовать present/absent/unknown/not_comparable с уровнем проверки.
  verification: |-
    «Не нашли» означает unknown, а не absent. Рекламное заявление не заменяет практическую проверку.
  output: evidence_matrix
- step: 04.5 Сопоставимая стоимость
  procedure: |-
    При наличии тарифов привести цену к руб./год на сопоставимую платящую единицу. Отдельно посчитать внедрение и обслуживание, НДС, минимальное число мест, различие подписки и бессрочной лицензии.
  verification: |-
    Нельзя сравнить месячный тариф «за пользователя» и годовую лицензию «за сервер» без сценария и нормализации.
  output: tco_matrix
- step: 04.6 Gap-анализ
  procedure: |-
    Для каждой клиентской задачи показать подтвержденное преимущество/паритет/отставание, где нет данных. Отличать функции, заявленные в маркетинговых материалах, от протестированной функциональности.
  verification: |-
    Нельзя рекомендовать копирование функции исключительно потому, что у конкурента она есть.
  output: capability_gaps
- step: 04.7 Ограничения источников
  procedure: |-
    Зафиксировать неполный охват конкурентов, смещения отзывов, закрытые цены, обновления версий, ограниченность демонстрации. При противоречии источников сохранять обе версии до проверки.
  verification: |-
    Не интерпретировать неизвестные цены как бесплатность и неизвестную функцию как отсутствие.
  output: coverage_bias
- step: 04.8 Вывод
  procedure: |-
    Выдать 3–5 различий, действительно значимых для выбора клиента, и варианты продуктового ответа: развивать, интегрироваться, изменить конфигурацию, не копировать. Все рекомендации снабдить ссылками на ячейки матрицы.
  verification: |-
    Оценить, влияет ли различие на клиентский исход, а не на число галочек в таблице.
  output: competitive_conclusions
russian_digital_market: |-
  В России для B2B критичны совместимость с существующей ИТ-средой, поддержка отечественных СУБД/ОС, работа с 1С и другими распространёнными системами там, где применимо, форма поставки SaaS/on-prem, стоимость внедрения и сопровождения, дата реально доступной версии. Государственные/квазигосударственные покупатели могут иметь отдельные условия закупок. Запись о российском ПО не гарантирует функциональную полноту и не является доказательством доли рынка. Проверить юридические и эксплуатационные ограничения иностранной альтернативы на дату анализа, а не исключать все зарубежные предложения автоматически.
interpretation_rules: |-
  Сравнительный benchmark позволяет утверждать наблюдаемые различия конкретных версий в определённых сценариях. Он не доказывает размер рынка, финансовую устойчивость конкурента, готовность аудитории платить больше или качество продукта в неизвестных условиях. Значимость критерия должна выводиться из задачи клиента или указываться как экспертная гипотеза.
quality_control:
  execution_clarifications:
    - "Для каждой сравниваемой цены фиксировать валюту и курс/дату пересчёта, наличие НДС, период тарифа, единицу лицензирования (пользователь, организация, сервер), минимальную конфигурацию, внедрение и поддержку; нормализовать только при явно заданном сценарии использования."
    - "Если условия лицензирования или тарифной комплектации неизвестны, цену не считать сопоставимой; исходное объявление тарифа сохранить с источником вместо выдуманного TCO."
  global_data_checks:
  - Проверять существование исходного файла, dataset_id, паспорт и версию; каталог сам по себе не подтверждает значения.
  - 'Сопоставлять единицу наблюдения: компания, ИП, субъект МСП, домохозяйство, человек или пользователь 15+.'
  - Проверять дату, территорию, классификатор, числитель, знаменатель и охват выборки перед соединением таблиц.
  - При суммировании регионов исключать пересечения территорий и вложенные автономные округа; предпочитать национальный
    итог издателя.
  - Не объединять доли из разных генеральных совокупностей без отдельного, проверяемого обоснования.
  - Отличать отсутствие данных от числового нуля; не восстанавливать несуществующие совместные разрезы.
  - Помечать синтетические примеры как учебные, выводы и оценки — по уровню подтверждения.
  - Не утверждать существование работающего внешнего коннектора только потому, что источник описан в каталоге.
  method_specific:
  - Каждая оценка характеристики снабжена URL и датой
  - При отсутствии открытых данных установлен unknown
  - Есть минимум один нетоварный заменитель
  - Единицы тарификации приведены к сопоставимому масштабу
  - Цена и TCO не смешаны
  - Отделены публичные обещания от результатов тестирования
  anti_patterns:
  - Feature checklist вместо оценки задачи клиента
  - Не указана версия или дата тарифа
  - Цена SaaS «за место в месяц» сравнена с on-prem разовой лицензией
  - Список из реестра РФ представлен как рыночные доли
  - Неизвестная функция помечена как отсутствующая
  - Кейс поставщика принят за независимую оценку качества
  stop_if: 'Не выводить численное заключение, если требуется отсутствующая генеральная совокупность, база пересчета,
    существенный коэффициент или независимое подтверждение: пометить результат partial/hypothesis_only/insufficient_data.'
structured_analytical_result:
  note: Схема результата — перечень логических полей, не самостоятельная JSON Schema; значения формируются при реальном
    применении.
  top_level_required:
  - method_id
  - case_id
  - analysis_date
  - product_context
  - status
  - inputs_used
  - outputs
  - evidence_register
  - assumptions_and_gaps
  - interpretation
  - quality_checks
  - expert_decision_required
  method_fields:
  - field: comparison_scope
    type: object
    required: true
  - field: alternatives
    type: array[offering_id,name,category,source_ids]
    required: true
  - field: criteria
    type: array[criterion_id,definition,unit,importance]
    required: true
  - field: comparison_matrix
    type: array[{offering_id,criterion_id,value,status,source_id,version,observed_date}]
    required: true
  - field: normalized_tco
    type: array[object]|null
    required: true
  - field: verified_differences
    type: array[object]
    required: true
  - field: unknowns_and_biases
    type: array[object]
    required: true
  evidence_standard:
    record_type: evidence
    required_fields:
    - 'evidence_id: уникальный ID'
    - 'claim_or_parameter_id: идентификатор вывода/параметра'
    - 'evidence_type: observed_fact | computed | interpretation | assumption | expert_assertion'
    - 'source_title: первоисточник или файл эксперта'
    - 'source_url_or_file_id: прямой путь/ID либо null с причиной'
    - 'dataset_id_and_version: если использован локальный набор'
    - 'date_observed_or_published: исходный год/дата'
    - 'retrieved_at: дата обращения, если внешняя веб-страница'
    - 'geography_and_population: географический охват, совокупность и знаменатель'
    - 'value_unit_formula_filters: значение, единица, формула и фильтры по возможности'
    - 'limitations: методические ограничения, в том числе наличие/отсутствие независимой проверки'
    integrity_rule: |-
      Ни один существенный численный вывод не должен существовать только как текст без ссылки на исходные показатели; предположения, суждения эксперта и наблюдаемые факты не являются одним типом доказательства. Нельзя присваивать статистический статус маркетинговым догадкам. Нельзя выдумывать цену, долю рынка, интервью, цитату, количественную частоту потребности или конверсию.
  status_values:
  - value: complete_with_evidence
    meaning: все существенные шаги проведены; источники и ограничения доступны
  - value: partial
    meaning: проведена подтвержденная часть; неопределенности и пробелы указаны
  - value: hypothesis_only
    meaning: получена проверяемая модель или гипотеза, но нет необходимых наблюдений
  - value: insufficient_data
    meaning: без ключевых данных выполнение метода недостоверно
  - value: not_applicable
    meaning: метод неприменим к задаче; причина записана
  serialization_policy: Числа как числа, не строки; отдельно валюты, периоды, единицы, знаменатели; null при неизвестном
    значении; дата и URL исходного источника; никаких фабрикованных данных
worked_example:
  is_synthetic: true
  case: Условный SaaS «Учёт заявок» против двух альтернатив и Excel
  inputs:
  - 'Сервис A: 700 руб. за активное место в месяц, 10 мест; никаких доплат в учебном допущении'
  - 'Сервис B: 4 000 руб. за организацию в месяц, функции требуют проверки'
  - 'Excel: лицензия не сравнима по цене с затратами ручной работы и ошибками'
  procedure:
  - 'Сервис A: 700 × 10 × 12 = 84 000 руб./год.'
  - 'Сервис B: 4 000 × 12 = 48 000 руб./год.'
  - По задаче «заявка → исполнение → SLA» функции сервисов сравнить только при наличии проверки; в учебном примере они
    unknown.
  - Для Excel отдельно оценить время сотрудников, если есть учет трудозатрат.
  output: Матрица условий, несопоставимых данных и TCO; вывод о «самом выгодном» пока недопустим.
  not_real_data_warning: Названия и тарифы вымышлены; числа не отражают действующие российские предложения.
