    denominator_in_catalog: Численность пользователей интернета 15+ за последние 3 месяца, не всё население
    quality_status_in_catalog: published_hse_table_reproducing_rosstat_data
  external_data_candidates:
  - Интервью с покупателем и пользователем
  - Видеозаписи/логи процесса, результаты пилотов
  - Спецификации, существующие функции, техусловия
  - Публичные данные заменителей
  data_use_rule: |-
    Указанные наборы «Рыночного агента» являются кандидатами, а не готовыми значениями. По каждому необходимы доступ к CSV, паспорт, первоисточник, проверка охвата, года и знаменателя; использовать только действительно совместимые наблюдения. Статистика 2020–2024 и публикации 2025 года не должна представляться как измерение 2026 года.
procedure:
- step: 06.1 Один профиль
  procedure: |-
    Выбрать один клиентский сегмент и ситуацию. Не объединять в одной схеме студента, ИТ-директора и промышленного закупщика; при разных jobs нужны отдельные профили.
  verification: |-
    Указана роль экономического покупателя, если отличается от пользователя.
  output: customer_profile_context
- step: 06.2 Клиентские задачи
  procedure: |-
    Перечислить 3–8 задач, каждую формулировать как результат в обстоятельствах. Разделить функциональный и при наличии подтверждений социальный/эмоциональный компоненты. Добавить ID наблюдений или пометку гипотезы.
  verification: |-
    «Хочет мобильное приложение» — не готовое job без описания результата.
  output: jobs
- step: 06.3 Боли и выгоды
  procedure: |-
    Для каждой задачи описать конкретные нежелательные последствия и ожидаемые выгоды, их значимость и измеримый признак. Вынести гипотетические пункты отдельно от подтвержденных интервью/пилотами.
  verification: |-
    Общая фраза «экономит время» без процесса и метрики не является измеренным эффектом.
  output: pains_and_gains
- step: 06.4 Карта продукта
  procedure: |-
    Перечислить существующие функции, услуги внедрения, поддержку, интеграции и запланированные элементы. Для каждого задать статус shipped/validated/planned/unknown и минимальные требования к использованию.
  verification: |-
    Не обещать планируемую функцию как работающую.
  output: offerings
- step: 06.5 Матрица соответствия
  procedure: |-
    Для каждой существенной боли/выгоды построить связь с конкретным mechanism_id. Записать механизм, ожидаемое изменение измеримой величины, требуемую предпосылку и свидетельства, что он работает.
  verification: |-
    Свойства без связанной важной задачи не являются доказанной ценностью; задачи без решений должны оставаться как gaps.
  output: fit_links
- step: 06.6 Относительная приоритизация
  procedure: |-
    Сопоставить важность потребности, подтвержденность, охват у данного сегмента, стоимость реализации. При качественных рейтингах определить шкалы и источник оценок; не считать неопределенность количественной вероятностью.
  verification: |-
    Не ранжировать автоматически на основе частоты упоминания в нерепрезентативных отзывах.
  output: value_priorities
- step: 06.7 Проверка на клиенте
  procedure: |-
    Предложить измерение ключевой связи: пилот на рабочем процессе, наблюдаемое время выполнения, точность, ошибки, успешный переход, оплаченный контракт. Указать базовую линию, целевую метрику и условия теста.
  verification: |-
    Факт использования функции не обязательно означает экономическую ценность.
  output: validation_plan
- step: 06.8 Вывод
  procedure: |-
    Представить подтвержденные элементы fit, непроверенные предпосылки и незакрытые важные задачи. Сформулировать 1–3 варианта изменения продуктовой комплектации с последствиями.
  verification: |-
    Не переводить продуктовую ценность в слоган, креативы или медиаплан — это отдельная коммуникационная методика.
  output: value_fit_assessment
russian_digital_market: |-
  В России клиентская ценность цифрового решения может включать эксплуатацию в локальном контуре, поддержку отечественных систем, доступность оплаты, хранение и обработку данных, работу без иностранных сервисов — только если это действительно важно выбранному сегменту и подтверждено требованиями или наблюдениями. Для B2B разделять экономический эффект работодателя и удобство конечного сотрудника. Для B2G отличать формальное соответствие условиям закупки и реальную потребительскую ценность. Наименования реестров/сертификатов сами по себе не свидетельствуют о пользовательском fit.
interpretation_rules: |-
  Value Proposition Canvas устанавливает карту гипотез соответствия. Заполненный шаблон НЕ равен доказанному product-market fit. Наличие перечня pains и relievers не означает, что проблема частая или что за её решение заплатят. Оценивать только те улучшения, для которых есть базовая линия и источник измерения.
quality_control:
  execution_clarifications:
    - "В результате отдельно маркировать предполагаемое соответствие потребностей и решения (hypothesized_fit) и подтверждённое эмпирическими наблюдениями соответствие (validated_fit); заполнение canvas само по себе не допускает статуса proven_fit."
    - "Для подтверждения соответствия связывать конкретное утверждение с наблюдением о поведении или результатом исследования; без такого наблюдения вывод остаётся гипотезой независимо от полноты canvas."
  global_data_checks:
  - Проверять существование исходного файла, dataset_id, паспорт и версию; каталог сам по себе не подтверждает значения.
  - 'Сопоставлять единицу наблюдения: компания, ИП, субъект МСП, домохозяйство, человек или пользователь 15+.'
  - Проверять дату, территорию, классификатор, числитель, знаменатель и охват выборки перед соединением таблиц.
  - При суммировании регионов исключать пересечения территорий и вложенные автономные округа; предпочитать национальный
    итог издателя.
  - Не объединять доли из разных генеральных совокупностей без отдельного, проверяемого обоснования.
  - Отличать отсутствие данных от числового нуля; не восстанавливать несуществующие совместные разрезы.
  - Помечать синтетические примеры как учебные, выводы и оценки — по уровню подтверждения.
  - Не утверждать существование работающего внешнего коннектора только потому, что источник описан в каталоге.
  method_specific:
  - Для каждой важной боли указан клиентский контекст и степень доказанности
  - Для заявленного fit дана конкретная связка job/pain → feature → measurable outcome
  - Указан статус функции
  - Противоречащие наблюдения не удалены
  - Нет бездоказательных утверждений о product-market fit
  - Не вошёл медиаплан/рекламное сообщение
  anti_patterns:
  - Ценность = список функций без указания эффекта
  - «Топ боли» выведены из рекламы конкурента
  - В одной карте смешаны несовместимые аудитории
  - Планируемая функция указана как существующая
  - Показатель цифровизации принят за доказательство нужды в продукте
  - Коммуникационный слоган подменяет продуктовый механизм
  stop_if: 'Не выводить численное заключение, если требуется отсутствующая генеральная совокупность, база пересчета,
    существенный коэффициент или независимое подтверждение: пометить результат partial/hypothesis_only/insufficient_data.'
structured_analytical_result:
  note: Схема результата — перечень логических полей, не самостоятельная JSON Schema; значения формируются при реальном
    применении.
  top_level_required:
  - method_id
  - case_id
  - analysis_date
  - product_context
  - status
  - inputs_used
  - outputs
  - evidence_register
  - assumptions_and_gaps
  - interpretation
  - quality_checks
  - expert_decision_required
  method_fields:
  - field: target_customer
    type: object
    required: true
  - field: customer_jobs
    type: array[object]
    required: true
  - field: pains
    type: array[object]
    required: true
  - field: gains
    type: array[object]
    required: true
  - field: product_components
    type: array[object]
    required: true
  - field: fit_links
    type: array[{job_or_pain_id,mechanism_id,expected_effect,evidence_ids,verification_status}]
    required: true
  - field: gaps_and_unproven_benefits
    type: array[object]
    required: true
  - field: product_configuration_options
    type: array[object]
    required: true
  evidence_standard:
    record_type: evidence
    required_fields:
    - 'evidence_id: уникальный ID'
    - 'claim_or_parameter_id: идентификатор вывода/параметра'
    - 'evidence_type: observed_fact | computed | interpretation | assumption | expert_assertion'
    - 'source_title: первоисточник или файл эксперта'
    - 'source_url_or_file_id: прямой путь/ID либо null с причиной'
    - 'dataset_id_and_version: если использован локальный набор'
    - 'date_observed_or_published: исходный год/дата'
    - 'retrieved_at: дата обращения, если внешняя веб-страница'
    - 'geography_and_population: географический охват, совокупность и знаменатель'
    - 'value_unit_formula_filters: значение, единица, формула и фильтры по возможности'
    - 'limitations: методические ограничения, в том числе наличие/отсутствие независимой проверки'
    integrity_rule: |-
      Ни один существенный численный вывод не должен существовать только как текст без ссылки на исходные показатели; предположения, суждения эксперта и наблюдаемые факты не являются одним типом доказательства. Нельзя присваивать статистический статус маркетинговым догадкам. Нельзя выдумывать цену, долю рынка, интервью, цитату, количественную частоту потребности или конверсию.
  status_values:
  - value: complete_with_evidence
    meaning: все существенные шаги проведены; источники и ограничения доступны
  - value: partial
    meaning: проведена подтвержденная часть; неопределенности и пробелы указаны
  - value: hypothesis_only
    meaning: получена проверяемая модель или гипотеза, но нет необходимых наблюдений
  - value: insufficient_data
    meaning: без ключевых данных выполнение метода недостоверно
  - value: not_applicable
    meaning: метод неприменим к задаче; причина записана
  serialization_policy: Числа как числа, не строки; отдельно валюты, периоды, единицы, знаменатели; null при неизвестном
    значении; дата и URL исходного источника; никаких фабрикованных данных
worked_example:
  is_synthetic: true
  case: Условный сервис заявки на ремонт
  inputs:
  - 'Job: обеспечить исполнение заявок без потери информации'
  - 'Pain (гипотеза): заявки теряются при пересылке между сменами'
  - 'Функция (предположим существует): уникальный номер и статус заявки'
  procedure:
  - Связать pain с возможностью отслеживания и подтверждением передачи смены.
  - 'Предположить метрику: число потерянных заявок на 100 заявок.'
  - Провести пилот и проверить до/после при сопоставимых условиях.
  - Если метрики нет — написать fit_unverified, даже при существующей функции.
  output: Карта связей механизмов и потребностей с планом проверки; текст рекламы отсутствует.
  not_real_data_warning: Боль и продуктовые свойства приведены для обучения, не как результат пользовательского исследования.
