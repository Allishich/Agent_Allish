meta:
  schema_version: '1.0'
  method_id: M06
  slug: value_proposition_canvas
  title: Value Proposition Canvas — проверка соответствия клиентской задаче
  language: ru
  version: 1.0.1
  prepared_on: '2026-11-21'
  method_family: Разработка и проверка ценностного предложения
  document_status: полная методологическая спецификация; не отчет по конкретному продукту
  editorial_license_note: Оригинальное изложение общепринятых методов; тексты SKILL.md Dean Peters не воспроизводятся
role:
  goal: |-
    Сформировать для выбранного сегмента модель соответствия между задачами/проблемами/выгодами клиента и реально предлагаемыми свойствами цифрового продукта. Показывать отдельными сущностями уже доказанное соответствие, предположения и несоответствия; не ограничиваться рекламной формулой ценности.
  questions:
  - Какие задачи, барьеры и результаты имеют наибольшее значение для данного клиента?
  - Какие свойства продукта непосредственно решают их?
  - Где имеются доказательства fit, а где только проектное обещание?
  - Какие свойства не дают доказанной пользы сегменту?
  applicability:
  - Создание цифрового продукта
  - Переоценка набора функций
  - Выбор комплектации/редакции
  - Проверка product–problem fit
  not_applicable_when:
  - Сегмент и клиентская задача отсутствуют даже в виде гипотезы
  - Требуется оценка размера рынка или поставщиков инфраструктуры
  mode: Самостоятельный метод; не требует выполнения других 9 методов
  scope_boundary: |-
    Предмет — продуктовая стратегия цифрового продукта для российского рынка. Выбор каналов продвижения, медиаплан и коммуникационные сообщения не являются результатом данного метода. Метод не принимает решений за эксперта: фиксирует варианты и их фактическую обоснованность.
theory:
  concepts:
  - term: Customer Jobs
    meaning: Функциональные, социальные и эмоциональные задачи клиента в указанной ситуации.
  - term: Pains
    meaning: Нежелательные затраты, препятствия, риски и разочарования при выполнении задач.
  - term: Gains
    meaning: Значимые результаты, улучшения и выгоды с описанными критериями успеха.
  - term: Products and Services
    meaning: 'Что действительно входит в предложение: ПО, внедрение, поддержка, интеграции.'
  - term: Pain Relievers
    meaning: Механизмы, посредством которых конкретная функция снижает конкретную боль.
  - term: Gain Creators
    meaning: Механизмы создания подтверждаемого результата или преимущества.
  - term: Fit
    meaning: Связь важной потребности и работающего механизма решения, подтверждённая наблюдением или экспериментом;
      не автоматически доказанный спрос.
  formulas:
  - name: Эффект на процесс, если есть измерения
    expression: delta_time = median(time_before) - median(time_after)
    units: минут/операцию
    conditions: |-
      Сопоставимая процедура, задачи и группы; указать дизайн сравнения, периоды, число наблюдений и ограничения причинного вывода.
    interpretation: |-
      Измеренное изменение времени в выборке, не автоматически годовая экономия всего рынка.
  - name: Относительное улучшение
    expression: relative_improvement = (baseline_value - observed_value) / baseline_value
    units: доля
    conditions: |-
      Базовая величина положительна, метрика имеет направление «меньше — лучше»; для «больше — лучше» формула меняется.
    interpretation: |-
      Сопоставимый эффект для конкретного измерения, не оценка willingness-to-pay.
input_contract:
  mandatory:
  - field: target_segment_and_role
    definition: Один сегмент и различение покупателя/пользователя
    data_type: text
    preferred_source: Эксперт, подтвержденная клиентская структура
    if_missing: Зафиксировать отсутствие; не подменять догадкой
  - field: customer_jobs
    definition: Перечень конкретных задач клиента в определённых ситуациях
    data_type: array[object]
    preferred_source: JTBD/интервью/наблюдения
    if_missing: Разрешена гипотеза с явной пометкой
  - field: pains_gains
    definition: Боли и результаты с относительной значимостью и основаниями
    data_type: array[object]
    preferred_source: Клиентские материалы и исследования
    if_missing: Не утверждать «топ-3 боли рынка»
  - field: product_mechanisms
    definition: Набор реально существующих или только планируемых продуктовых механизмов
    data_type: text
    preferred_source: Спецификации, интерфейс, тест, эксперт
    if_missing: Зафиксировать отсутствие; не подменять догадкой
  helpful:
  - field: validated_outcomes
    definition: Измерения сокращения времени, ошибок, стоимости, роста выработки
    data_type: text
    preferred_source: Продуктовая аналитика, пилоты
    if_missing: Зафиксировать отсутствие; не подменять догадкой
  - field: competitor_alternatives
    definition: Текущие способы решения задачи и их ограничения
    data_type: text
    preferred_source: Подтвержденный benchmarking
    if_missing: Зафиксировать отсутствие; не подменять догадкой
  - field: adoption_barriers
    definition: Интеграционные, организационные, юридические и доверительные препятствия
    data_type: text
    preferred_source: Интервью и техдокументация
    if_missing: Зафиксировать отсутствие; не подменять догадкой
  expert_inputs:
  - Какая версия продукта реально существует
  - Какие результаты клиенту обещают и что измерено
  - Какие роли принимают решение о внедрении
  local_data_candidates:
  - dataset_id: RU_DIG_010
    possible_use: Возможные общие барьеры освоения цифровых сервисов по возрасту
    critical_limit: Не свидетельство о конкретных болях/выгодах пользователя.
    data_file_url: https://drive.google.com/file/d/10Dhiatiysd4TTWz_hzPCTstXEkoTLaf5/view
    data_file_drive_id: 10Dhiatiysd4TTWz_hzPCTstXEkoTLaf5
    passport_url: https://drive.google.com/file/d/1aMGreKeOcgAeP_UVh7hTwNGUyLCNetyd/view
    source_publication: https://issek.hse.ru/mirror/pubs/share/1122445658.pdf
    years_in_catalog:
    - 2024
    population_in_catalog: Население 15 лет и старше в соответствующей возрастной группе
    denominator_in_catalog: Все лица соответствующей возрастной группы
    quality_status_in_catalog: published_hse_table_reproducing_rosstat_data
  - dataset_id: ru_b2b_small_enterprise_digital_by_industry_2024
    possible_use: Инфраструктурный фон использования технологий предприятиями
    critical_limit: Нельзя заключить о pain reliever конкретного решения.
    data_file_url: https://drive.google.com/file/d/1ITYCYdTh5OMCbgoaWAovg9blrToflt5B/view
    data_file_drive_id: 1ITYCYdTh5OMCbgoaWAovg9blrToflt5B
    passport_url: https://drive.google.com/file/d/1wFHEoM_KQQibzYFwdGo7Ab53RnBkj1_b/view
    source_publication: HSE_ISEK_2026
    years_in_catalog: null
    population_in_catalog: null
    denominator_in_catalog: null
    quality_status_in_catalog: official_HSE_screenshot_checked
  - dataset_id: RU_DIG_005
    possible_use: Контекст отдельных задач использования интернета
    critical_limit: Не подтверждает востребованность конкретного механизма продукта.
    data_file_url: https://drive.google.com/file/d/15d7qcO5gzZES0LByHreE8R252JoeQ3PT/view
    data_file_drive_id: 15d7qcO5gzZES0LByHreE8R252JoeQ3PT
    passport_url: https://drive.google.com/file/d/1-Xvct04pZYm3p0Et-JIAMV2uFUdW562h/view
