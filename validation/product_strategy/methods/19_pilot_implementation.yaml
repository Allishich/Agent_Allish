meta:
  schema_version: '1.0'
  method_id: M19
  slug: pilot_implementation
  title: Пилотное внедрение цифрового продукта
  language: ru
  version: 1.0.1
  prepared_on: '2026-11-21'
  method_family: Практическая валидация
  method_group: existing_product
  document_status: самостоятельная прикладная методика, не отчёт о продукте
  reuse_policy: Самостоятельное изложение классического метода; тексты сторонних SKILL.md не копируются.
role:
  goal: Проверить работу продукта в реальной организации/среде, процесс внедрения, наблюдаемые результаты и
    эксплуатационные ограничения.
  decision_question: Можно ли масштабировать продукт или необходимо исправить условия внедрения и поддержки?
  applicability:
  - B2B SaaS или on-premise с внедрением
  - Новый цифровой модуль в организации
  - Интеграционно сложный продукт
  not_applicable_when:
  - Нужно измерить причинный эффект без контроля смешивающих факторов — пилот сам по себе не даёт его
  - Нет согласованных условий доступа и показателей до запуска
  autonomy: Самостоятельный метод; не требует применения остальных 20 методов.
  scope_boundary: Продуктовая стратегия цифрового продукта для российского рынка; не медиаплан, не копирайтинг,
    не разработка рекламной кампании.
theory:
  concepts:
  - term: Пилот
    meaning: Ограниченное внедрение с заранее определёнными целями, организационными условиями и критериями
      завершения.
  - term: Baseline
    meaning: Состояние измеряемых процессов до внедрения, определённое в тех же единицах, что и после.
  formulas: []
input_contract:
  minimum:
  - Описание пилотного сценария, сроков и границ
  - Ответственные стороны и критерии успеха
  - Baseline по целевым операциям
  - Журнал изменений, сбоев и фактического использования
  optional:
  - Согласованная контрольная группа/период
  - Условия поддержки, обучения и интеграций
  public_data_role: Отраслевые данные полезны для контекста, но результат пилота измеряется на конкретной организации.
expert_instruction:
  purpose: 'Краткая инструкция человеку: выполнить только недоступные консультанту действия и передать исходные
    сведения.'
  steps:
  - step: 1
    action: Определить цель пилота, одного или нескольких измеряемых результатов и критерии технической/организационной
      готовности.
  - step: 2
    action: 'Зафиксировать условия: тип организации, используемые системы, права доступа, интеграции, объём
      пользователей, срок и ответственных.'
  - step: 3
    action: Собрать baseline до запуска; согласовать, какие изменения процессов вне продукта также будут происходить.
  - step: 4
    action: Запустить ограниченный пилот; вести журнал сбоев, обращений, обучения, изменений версии и фактического
      использования.
  - step: 5
    action: По завершении собрать данные тех же показателей, что и до пилота; отдельно описать изменения условий.
  - step: 6
    action: Передать измерения, список ограничений и решение стороны-пилотного заказчика, не скрывая неудачи.
  minimum_record_fields:
  - pilot_id
  - organization_profile
  - deployment_type
  - product_version
  - baseline_window
  - pilot_window
  - metric_definitions
  - before_values
  - after_values
  - usage_logs
  - incident_log
  - training_support_costs
  - scope_deviations
  data_transfer_rule: Предавать исходные записи/таблицы и определения полей с информацией о способе сбора, периоде,
    пропусках и ограничениях. По возможности псевдонимизировать людей и организации; доступ к исходникам ограничить.
analytical_procedure:
  quality_checks_before_analysis:
  - Одинаковое определение показателей до/после и сопоставимые единицы.
  - Отдельно учитывать сезонность, обучение и одновременные изменения процессов.
  - Не приписывать все изменения исключительно продукту при отсутствии контролируемого дизайна.
  steps:
  - Сопоставить baseline и результаты с объяснением различий условий.
  - Оценить выполнение эксплуатационных и продуктовых критериев, цену внедрения и ограничения переносимости.
  - Сформировать решение о расширении/исправлениях/повторном пилоте и условия масштабирования.
russian_digital_market: Для российской организации проверять выбранные условия поставки (SaaS или on-premise),
  требования по ИБ и персональным данным, совместимость с применяемым ПО, интеграции, закупочный и договорной
  цикл. Не делать универсальных правовых выводов без анализа сферы применения.
interpretation_rules:
- Один успешный пилот не доказывает достижимый объём рынка.
- Пилот без контрольной группы не всегда позволяет оценить причинный эффект.
quality_control:
  execution_clarifications:
    - "Критерии успеха и допустимые пороги ухудшения должны быть согласованы до начала пилота: целевые KPI, baseline и способ измерения, период наблюдения, ответственный за решение и минимальные требования к эксплуатации."
    - "До запуска фиксировать stop/go/no-go: условия остановки по безопасности, нарушениям обязательств, отказам, превышению расходов и невозможности собрать достоверные данные; после завершения нельзя подбирать критерии задним числом, чтобы объявить пилот успешным."
  common_gates:
  - У исследования есть конкретный вопрос и решение, для которого собираются данные.
  - Источник каждого вывода прослеживается до исходного наблюдения, анкеты или расчёта.
  - Ненаблюдаемые величины, гипотезы и ограничения явно маркируются; недостающее не подменяется выдуманными
    значениями.
  - Не переносить результаты нерепрезентативной выборки на всё население или рынок России.
  - При обработке персональных данных определить законное основание, минимизацию состава данных, права участников,
    безопасность и сроки хранения.
  completion_gates:
  - У исходных записей установлены единица наблюдения, дата, источники и условия измерения.
  - Показатели воспроизводимы; знаменатели и исключения записаны.
  - Применение метода не подменяется предположениями, когда требуется внешний сбор.
  - Честно записаны ограничения причинности, выборки и переносимости результатов.
structured_analytical_result:
  serialization_target: JSON после применения метода; эта методическая спецификация остаётся YAML.
  required_common_fields:
  - method_id
  - case_id
  - product_scope
  - data_collection_status
  - analysis_status
  - period
  - observations_count
  - inputs_and_source_refs
  - method_findings
  - quality_warnings
  - assumptions
  - limitations
  - decision_implications
  method_specific_fields:
  - pilot_scope
  - baseline_and_after
  - adoption_usage
  - technical_constraints
  - costs_and_incidents
  - scalability_conditions
  possible_statuses:
  - not_started
  - data_collection_needed
  - partial
  - completed_with_evidence
  - not_applicable
  no_report_rule: Выход — структурированные факты и выводы, не готовая презентация или рекламный текст.
worked_example:
  synthetic: true
  situation: Пилот электронного согласования на одном производственном участке.
  expert_action: Сравнил длительность согласования до и после, зафиксировал обучение и параллельную смену регламента.
  structured_result: Изменения процесса и условия масштабирования с ограничением на причинную интерпретацию.
related_core_methods_optional:
- M07 Business Model Canvas
- M08 Strategic Alternatives
sources:
- title: Microsoft Research, Patterns of Trustworthy Experimentation
  url: https://evaluation.treasury.gov.au/publications/evaluating-pilot-programs-guide
- title: Федеральный закон №152-ФЗ «О персональных данных» — действующая редакция проверяется перед исследованием
  url: https://www.consultant.ru/document/cons_doc_LAW_61801/
  relevance: Если исследование обрабатывает персональные данные, определить основание, цель, сроки хранения
    и меры защиты; не заменяет юридическую проверку.
