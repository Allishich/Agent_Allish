meta:
  schema_version: '1.0'
  method_id: M18
  slug: usability_testing
  title: Юзабилити-тестирование цифрового продукта
  language: ru
  version: 1.0.0
  prepared_on: '2026-11-21'
  method_family: Проверка удобства выполнения задач
  method_group: existing_product
  document_status: самостоятельная прикладная методика, не отчёт о продукте
  reuse_policy: Самостоятельное изложение классического метода; тексты сторонних SKILL.md не копируются.
role:
  goal: Определить, могут ли представители целевого сегмента выполнять приоритетные задачи в интерфейсе без
    наведения на ответ.
  decision_question: Какие препятствия в интерфейсе необходимо исправить и что можно измерить повторно?
  applicability:
  - Рабочий интерфейс или реалистичный прототип
  - Редизайн ключевого сценария
  - Низкая завершённость операции
  not_applicable_when:
  - Нужно исследовать причины покупки вместо поведения в интерфейсе — полезнее интервью
  - Нет воспроизводимых задач или доступного окружения
  autonomy: Самостоятельный метод; не требует применения остальных 20 методов.
  scope_boundary: Продуктовая стратегия цифрового продукта для российского рынка; не медиаплан, не копирайтинг,
    не разработка рекламной кампании.
theory:
  concepts:
  - term: Качественный usability test
    meaning: Выявление конкретных препятствий, наблюдая действия небольшого числа пользователей.
  - term: Количественный usability test
    meaning: Оценивание успешности/времени/ошибок с достаточной выборкой и заранее определённой метрикой.
  formulas: []
input_contract:
  minimum:
  - Определённая аудитория
  - Репрезентативные пользовательские задачи, не содержащие подсказку к решению
  - Стабильная версия интерфейса
  - Порядок записи успеха, ошибок и вмешательства модератора
  optional:
  - Предыдущая версия для сопоставления
  - Событийные логи для воспроизведения проблем
  public_data_role: Рыночная статистика может помочь с определением сегмента, но не измерит удобство интерфейса.
expert_instruction:
  purpose: 'Краткая инструкция человеку: выполнить только недоступные консультанту действия и передать исходные
    сведения.'
  steps:
  - step: 1
    action: Выбрать 2–4 критических действия пользователя и определить условие успешного завершения каждого.
  - step: 2
    action: Подготовить одинаковые задачи и тестовое окружение; заранее указать, что модератор не подсказывает
      решение.
  - step: 3
    action: 'Набрать представителей разных ключевых ролей; число участников зависит от цели: качественный поиск
      проблем или количественная оценка метрики.'
  - step: 4
    action: Наблюдать выполнение, записывать ошибки, время и просьбы о помощи; после действия уточнить контекст
      затруднения.
  - step: 5
    action: Передать записи на уровне участник × задача вместе с версией интерфейса, условиями теста и материалами
      наблюдений.
  minimum_record_fields:
  - participant_id
  - role
  - interface_version
  - task_id
  - task_success
  - time_to_complete
  - error_type
  - number_of_hints
  - observation_note
  - test_environment
  - session_date
  data_transfer_rule: Предавать исходные записи/таблицы и определения полей с информацией о способе сбора, периоде,
    пропусках и ограничениях. По возможности псевдонимизировать людей и организации; доступ к исходникам ограничить.
analytical_procedure:
  quality_checks_before_analysis:
  - Чёткое определение успеха и сопоставимые условия теста.
  - Процент успешности при 5 участниках не является стабильной популяционной оценкой.
  - Не объединять без анализа разные роли и задачи.
  - Проверить, менялись ли интерфейс и формулировка задачи между сессиями.
  steps:
  - Для качественного теста сгруппировать затруднения, указать частоту обнаружения в сессиях без обобщения на
    рынок.
  - Для количественного теста при достаточной выборке оценить успешность, время и неопределённость.
  - Ранжировать проблемы по влиянию на выполнение приоритетной задачи.
russian_digital_market: Проверить доступность интерфейса на распространённых у целевой группы устройствах, роль
  российских сервисов аутентификации/оплаты и организационные ограничения B2B. Эти сценарии включать только
  при их фактической значимости.
interpretation_rules:
- Малое качественное тестирование не даёт точной доли всех пользователей с проблемой.
- Наличие проблемы не устанавливает её влияние на покупку без отдельного исследования.
quality_control:
  common_gates:
  - У исследования есть конкретный вопрос и решение, для которого собираются данные.
  - Источник каждого вывода прослеживается до исходного наблюдения, анкеты или расчёта.
  - Ненаблюдаемые величины, гипотезы и ограничения явно маркируются; недостающее не подменяется выдуманными
    значениями.
  - Не переносить результаты нерепрезентативной выборки на всё население или рынок России.
  - При обработке персональных данных определить законное основание, минимизацию состава данных, права участников,
    безопасность и сроки хранения.
  completion_gates:
  - У исходных записей установлены единица наблюдения, дата, источники и условия измерения.
  - Показатели воспроизводимы; знаменатели и исключения записаны.
  - Применение метода не подменяется предположениями, когда требуется внешний сбор.
  - Честно записаны ограничения причинности, выборки и переносимости результатов.
structured_analytical_result:
  serialization_target: JSON после применения метода; эта методическая спецификация остаётся YAML.
  required_common_fields:
  - method_id
  - case_id
  - product_scope
  - data_collection_status
  - analysis_status
  - period
  - observations_count
  - inputs_and_source_refs
  - method_findings
  - quality_warnings
  - assumptions
  - limitations
  - decision_implications
  method_specific_fields:
  - task_outcomes
  - friction_clusters
  - critical_failures
  - metrics_if_powered
  - recommended_ux_changes
  - retest_plan
  possible_statuses:
  - not_started
  - data_collection_needed
  - partial
  - completed_with_evidence
  - not_applicable
  no_report_rule: Выход — структурированные факты и выводы, не готовая презентация или рекламный текст.
worked_example:
  synthetic: true
  situation: Пользователи не находят выгрузку документов в веб-сервисе.
  expert_action: Поручил выполнить одно и то же действие без подсказок и записал отказы, помощь, ошибки.
  structured_result: Перечень воспроизводимых препятствий и действия для перепроверки после доработки.
related_core_methods_optional:
- M06 Value Proposition Canvas
sources:
- title: Nielsen Norman Group, How Many Test Users in a Usability Study?
  url: https://www.nngroup.com/articles/how-many-test-users/
- title: Nielsen Norman Group, Why 5 Participants Are Okay in a Qualitative Study, but Not in a Quantitative
    One
  url: https://www.nngroup.com/articles/5-test-users-qual-quant/
- title: Федеральный закон №152-ФЗ «О персональных данных» — действующая редакция проверяется перед исследованием
  url: https://www.consultant.ru/document/cons_doc_LAW_61801/
  relevance: Если исследование обрабатывает персональные данные, определить основание, цель, сроки хранения
    и меры защиты; не заменяет юридическую проверку.
