meta:
  schema_version: '1.0'
  method_id: M05
  slug: jobs_to_be_done
  title: Jobs to Be Done — выявление задачи клиента и причин выбора
  language: ru
  version: 1.0.0
  prepared_on: '2026-11-21'
  method_family: Качественное исследование клиентской потребности
  document_status: полная методологическая спецификация; не отчет по конкретному продукту
  editorial_license_note: Оригинальное изложение общепринятых методов; тексты SKILL.md Dean Peters не воспроизводятся
role:
  goal: |-
    Выявить обстоятельства, желаемый прогресс, триггеры выбора, барьеры и фактические альтернативы, из которых следует ценность продукта. Не подменять работающие клиентские задачи списком функций и не выводить мотивы из демографии без исследования.
  questions:
  - В какой ситуации человек/организация начинает искать решение?
  - Какой прогресс клиент ожидает получить и как измеряет результат?
  - Что делает сейчас и почему иногда меняет решение?
  - Почему покупатель и пользователь могут иметь разные критерии успеха?
  applicability:
  - Новая концепция продукта
  - Неочевидные потребности и замещающие решения
  - Повторяющиеся отказы и миграции
  - Определение ценности функций
  not_applicable_when:
  - 'Нет ни одного наблюдения или высказывания клиента, а исследование представить невозможно: допускаются только гипотезы'
  - Требуется только подсчет фирм/населения
  mode: Самостоятельный метод; не требует выполнения других 9 методов
  scope_boundary: |-
    Предмет — продуктовая стратегия цифрового продукта для российского рынка. Выбор каналов продвижения, медиаплан и коммуникационные сообщения не являются результатом данного метода. Метод не принимает решений за эксперта: фиксирует варианты и их фактическую обоснованность.
theory:
  concepts:
  - term: Job
    meaning: Работа/прогресс, который клиент пытается совершить в обстоятельствах, не названный интерфейсом продукта.
  - term: Functional dimension
    meaning: 'Практический результат: сэкономить время, исключить ошибки, обеспечить выполнение требования.'
  - term: Emotional/social dimensions
    meaning: Ощущение контроля, спокойствия, репутация перед коллегами и контрагентами.
  - term: Circumstance
    meaning: Когда и почему задача становится важной; контекст и ограничения выбора.
  - term: Switching forces
    meaning: Толчок от старой альтернативы, привлекательность нового решения, опасения и инерция.
  - term: Evidence hierarchy
    meaning: Реальное прошлое действие сильнее ответа «мне было бы интересно купить», но выборка и контекст важны.
  formulas: []
input_contract:
  mandatory:
  - field: job_context
    definition: Конкретный сценарий/ситуация, пользователь и экономический покупатель
    data_type: text
    preferred_source: Эксперт и подтверждаемые наблюдения
    if_missing: Зафиксировать отсутствие; не подменять догадкой
  - field: qualitative_evidence
    definition: Датированные интервью, обращения, жалобы, дневники или записи процесса
    data_type: array[verbatim,source,participant]
    preferred_source: Полные исходные материалы, не AI-генерация
    if_missing: Только гипотетическая карта Jobs без заявлений о валидированности
  - field: current_alternatives
    definition: Существующие способы выполнить работу, включая ручной
    data_type: text
    preferred_source: Интервью и наблюдения
    if_missing: Зафиксировать отсутствие; не подменять догадкой
  - field: outcome_definition
    definition: Желаемый результат в терминах клиента, не функция ПО
    data_type: text
    preferred_source: Высказывания/наблюдения клиентов
    if_missing: Зафиксировать отсутствие; не подменять догадкой
  helpful:
  - field: switch_cases
    definition: Истории реального изменения инструмента или отказа от покупки
    data_type: text
    preferred_source: Интервью о конкретных прошлых событиях
    if_missing: Зафиксировать отсутствие; не подменять догадкой
  - field: business_roles
    definition: Закупщик, пользователь, ИТ-администратор, согласующий, контролер
    data_type: text
    preferred_source: Оргструктура/интервью
    if_missing: Зафиксировать отсутствие; не подменять догадкой
  - field: task_frequency_and_time
    definition: Наблюдения частоты задач, затрат времени, последствий ошибок
    data_type: text
    preferred_source: Процессные логи/учет времени
    if_missing: Зафиксировать отсутствие; не подменять догадкой
  expert_inputs:
  - Кто реально выполняет задачу, а кто платит
  - Какие события заставили искать решение
  - Сколько стоит неудача по опыту эксперта — как гипотеза
