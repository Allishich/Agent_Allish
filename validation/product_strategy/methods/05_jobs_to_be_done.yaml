  external_data_candidates:
  - Интервью об опыте переключения с одного решения на другое
  - Тикеты поддержки и сообщения пользователей с разрешенным доступом
  - Публичные отзывы с указанием смещений
  - Логи реального процесса при согласованном доступе
  data_use_rule: |-
    Указанные наборы «Рыночного агента» являются кандидатами, а не готовыми значениями. По каждому необходимы доступ к CSV, паспорт, первоисточник, проверка охвата, года и знаменателя; использовать только действительно совместимые наблюдения. Статистика 2020–2024 и публикации 2025 года не должна представляться как измерение 2026 года.
procedure:
- step: 05.1 Определение job-ситуации
  procedure: |-
    Описать три элемента: кто (роль, не демографический ярлык), обстоятельства («когда...»), желаемый прогресс («хочу...»). Отделить попытку выполнить работу от названия решения.
  verification: |-
    «Хочу использовать чат-бот» — технология, а не доказанная работа клиента.
  output: job_frame
- step: 05.2 Исследовательский дизайн
  procedure: |-
    Определить 1–3 ключевые роли, критерии включения интервьюируемых, типичные и контрастные случаи (выбрали/отказались/перешли на альтернативу). Подготовить вопросы о реальных прошлых событиях и текущем процессе, а не о пожеланиях к гипотетическому продукту.
  verification: |-
    Зафиксировать способ отбора и отсутствие репрезентативности качественной выборки.
  output: research_plan
- step: 05.3 Сбор наблюдений
  procedure: |-
    Записать конкретные инциденты: что случилось, что предшествовало, какой вариант применяли, какую цену заплатили временем/деньгами/риском, кто участвовал. Хранить короткие точные цитаты со ссылкой на источник и согласие на использование.
  verification: |-
    Нельзя генерировать интервью или цитаты; не считать пересказ ассистента первичным наблюдением.
  output: observations
- step: 05.4 Разделение типов результата
  procedure: |-
    Для каждой задачи выделить функциональный результат, социальный/эмоциональный компонент, ограничения, критерии успеха. Различать роль пользователя и покупателя.
  verification: |-
    Ни один мотив не должен быть выведен только из возраста, ОКВЭД или дохода.
  output: job_dimensions
- step: 05.5 Альтернативы и переход
  procedure: |-
    Описать текущие заменители и силы переключения: что подтолкнуло, чем привлекает новый подход, чего боятся при переходе, что удерживает в старом. Указать признаки реального выбора.
  verification: |-
    Интерес без оплаченного/наблюдаемого действия не трактовать как подтвержденное принятие продукта.
  output: switching_model
- step: 05.6 Синтез
  procedure: |-
    Сгруппировать сходные ситуации по схожести задачи. Для каждой темы записать число участников, выразивших наблюдение, и характеристики выборки. Отдельно отметить возражения и редкие противоречащие случаи.
  verification: |-
    «6 из 8 интервью» не означает 75% рынка. Не подменять число высказываний числом людей.
  output: job_patterns
- step: 05.7 Opportunity statement
  procedure: |-
    Сформулировать незакрытую потребность без решения, указать измеримое желаемое улучшение и актуальную альтернативу. Приоритизировать лишь при подтвержденной важности или обозначить экспертное ранжирование.
  verification: |-
    Слова о «главной боли всех клиентов» недопустимы без репрезентативной проверки.
  output: jobs_and_opportunities
- step: 05.8 Ограничения и проверка
  procedure: |-
    Показать отсутствующие клиентские роли, доступные но непроверенные сегменты, смещение рекрутинга, критические неустановленные причины. Сформировать уточняющие исследовательские действия.
  verification: |-
    Если интервью отсутствуют, статус hypothesis_only, а не complete_with_evidence.
  output: job_validation_gaps
russian_digital_market: |-
  На российском B2B-рынке разделение ролей часто существенно: непосредственный пользователь, руководитель подразделения, директор, ИТ и служба безопасности оценивают разные исходы. В государственном и крупном корпоративном секторе мотив внедрения может быть связан с процедурами и требованиями, но их применимость проверяется для конкретного клиента. Для B2C учитывать особенности цифровой грамотности и поведения 15+ без вывода мотива из статистической корреляции. Публичные отзывы с российских площадок могут быть доступны, но отражают самоотбор и не дают долю клиентской потребности.
interpretation_rules: |-
  JTBD — качественное объяснение механизма выбора, не статистическая оценка частоты на генеральной совокупности. Отдельно представить наблюдение, интерпретацию и гипотезу; предлагать опросы/поведенческую проверку, если нужно распространить вывод на рынок.
quality_control:
  global_data_checks:
  - Проверять существование исходного файла, dataset_id, паспорт и версию; каталог сам по себе не подтверждает значения.
  - 'Сопоставлять единицу наблюдения: компания, ИП, субъект МСП, домохозяйство, человек или пользователь 15+.'
  - Проверять дату, территорию, классификатор, числитель, знаменатель и охват выборки перед соединением таблиц.
  - При суммировании регионов исключать пересечения территорий и вложенные автономные округа; предпочитать национальный
    итог издателя.
  - Не объединять доли из разных генеральных совокупностей без отдельного, проверяемого обоснования.
  - Отличать отсутствие данных от числового нуля; не восстанавливать несуществующие совместные разрезы.
  - Помечать синтетические примеры как учебные, выводы и оценки — по уровню подтверждения.
  - Не утверждать существование работающего внешнего коннектора только потому, что источник описан в каталоге.
  method_specific:
  - У каждой прямой цитаты есть источник и ID
  - Указан способ рекрутинга и охват ролей
  - Задачи формулируются без названия решения
  - Есть минимум один заменитель
  - Противоречащие наблюдения не удалены
  - Если нет интервью — итог гипотетический
  anti_patterns:
  - Придумывание цитат и интервью
  - Подмена задачи функциональностью «нужен ИИ/CRM»
  - Проценты рынка из 5–10 качественных интервью
  - Игнорирование случая отказа от покупки
  - Смешение боли пользователя и критерия закупщика
  - «Потребность» на основании одной демографической категории
  stop_if: 'Не выводить численное заключение, если требуется отсутствующая генеральная совокупность, база пересчета,
    существенный коэффициент или независимое подтверждение: пометить результат partial/hypothesis_only/insufficient_data.'
structured_analytical_result:
  note: Схема результата — перечень логических полей, не самостоятельная JSON Schema; значения формируются при реальном
    применении.
  top_level_required:
  - method_id
  - case_id
  - analysis_date
  - product_context
  - status
  - inputs_used
  - outputs
  - evidence_register
  - assumptions_and_gaps
  - interpretation
  - quality_checks
  - expert_decision_required
  method_fields:
  - field: job_frames
    type: array[{role,circumstance,progress,observations,evidence_ids}]
    required: true
  - field: observations
    type: array[{participant_id,role,event,verbatim,source_id,date}]
    required: true
  - field: functional_emotional_social
    type: array[object]
    required: true
  - field: switching_forces
    type: array[object]
    required: true
  - field: jobs_ranked
    type: array[{job_id,importance_basis,evidence_strength}]
    required: true
  - field: bias_and_gaps
    type: array[text]
    required: true
  evidence_standard:
    record_type: evidence
    required_fields:
    - 'evidence_id: уникальный ID'
    - 'claim_or_parameter_id: идентификатор вывода/параметра'
    - 'evidence_type: observed_fact | computed | interpretation | assumption | expert_assertion'
    - 'source_title: первоисточник или файл эксперта'
    - 'source_url_or_file_id: прямой путь/ID либо null с причиной'
    - 'dataset_id_and_version: если использован локальный набор'
    - 'date_observed_or_published: исходный год/дата'
    - 'retrieved_at: дата обращения, если внешняя веб-страница'
    - 'geography_and_population: географический охват, совокупность и знаменатель'
    - 'value_unit_formula_filters: значение, единица, формула и фильтры по возможности'
    - 'limitations: методические ограничения, в том числе наличие/отсутствие независимой проверки'
    integrity_rule: |-
      Ни один существенный численный вывод не должен существовать только как текст без ссылки на исходные показатели; предположения, суждения эксперта и наблюдаемые факты не являются одним типом доказательства. Нельзя присваивать статистический статус маркетинговым догадкам. Нельзя выдумывать цену, долю рынка, интервью, цитату, количественную частоту потребности или конверсию.
  status_values:
  - value: complete_with_evidence
    meaning: все существенные шаги проведены; источники и ограничения доступны
  - value: partial
    meaning: проведена подтвержденная часть; неопределенности и пробелы указаны
  - value: hypothesis_only
    meaning: получена проверяемая модель или гипотеза, но нет необходимых наблюдений
  - value: insufficient_data
    meaning: без ключевых данных выполнение метода недостоверно
  - value: not_applicable
    meaning: метод неприменим к задаче; причина записана
  serialization_policy: Числа как числа, не строки; отдельно валюты, периоды, единицы, знаменатели; null при неизвестном
    значении; дата и URL исходного источника; никаких фабрикованных данных
worked_example:
  is_synthetic: true
  case: Условный продукт для учёта заявок на ремонт оборудования
  inputs:
  - 'Сценарий интервью: инженер записывает неполадки в мессенджере и затем повторно переносит в журнал'
  - Факт этого поведения в реальном исследовании пока не установлен
  procedure:
  - 'Сформулировать Job: «когда возникает неисправность, быстро зафиксировать заявку и обеспечить её исполнение без потери
    деталей».'
  - 'Функциональный исход: сократить задержку и ручное дублирование; эмоциональный: контроль и уверенность.'
  - 'Альтернативы: мессенджер, Excel и устный обмен.'
  - Спроектировать интервью о последней конкретной неисправности, а не о желании купить новый SaaS.
  output: Гипотетическая карточка JTBD со списком необходимых наблюдений; нет утверждений о спросе.
