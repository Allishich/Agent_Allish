meta:
  schema_version: '1.0'
  method_id: M12
  slug: quantitative_survey
  title: Количественный опрос потребностей и поведения
  language: ru
  version: 1.0.1
  prepared_on: '2026-11-21'
  method_family: Количественное исследование
  method_group: new_product_idea
  document_status: самостоятельная прикладная методика, не отчёт о продукте
  reuse_policy: Самостоятельное изложение классического метода; тексты сторонних SKILL.md не копируются.
role:
  goal: Получить оценки распределения ответов и различий между группами при явно описанном способе отбора.
  decision_question: Насколько распространена наблюдаемая характеристика в изученной совокупности и различаются
    ли сегменты?
  applicability:
  - Проверка распространённости гипотез после качественного исследования
  - Описание характеристик потенциальных пользователей
  - Оценка доли явного поведения в заданной выборке
  not_applicable_when:
  - Требуется установить причинный эффект — нужен эксперимент
  - Выборка недостаточно определена или нельзя раскрыть способ её формирования
  autonomy: Самостоятельный метод; не требует применения остальных 20 методов.
  scope_boundary: Продуктовая стратегия цифрового продукта для российского рынка; не медиаплан, не копирайтинг,
    не разработка рекламной кампании.
theory:
  concepts:
  - term: Генеральная совокупность
    meaning: Чётко заданная группа, на которую планируется распространять оценку.
  - term: Вероятностный отбор
    meaning: У каждой единицы известна ненулевая вероятность включения; позволяет при выполнении условий рассчитывать
      дизайн-обоснованную неопределённость.
  - term: Convenience sample
    meaning: Выборка удобства, для которой стандартная погрешность случайной выборки не описывает смещение.
  formulas: []
input_contract:
  minimum:
  - Целевая совокупность и критерии включения
  - Определённый параметр оценки
  - План набора и способ отбора
  - Краткая анкета с единообразными шкалами и периодом вопроса
  - Метаданные неответов
  optional:
  - Демографические веса и подтверждённые доли сегментов
  - Источники для проверки охвата совокупности
  public_data_role: RU_DIG_007 и RU_DIG_010 доступны только как потенциальные проверочные возрастные/поведенческие
    ориентиры; совместимость баз и охватов обязательна.
expert_instruction:
  purpose: 'Краткая инструкция человеку: выполнить только недоступные консультанту действия и передать исходные
    сведения.'
  steps:
  - step: 1
    action: Определить, чьё поведение или мнение измеряется, за какой период, какое решение зависит от ответа.
  - step: 2
    action: Выбрать рамку отбора и канал набора; записать ограничения охвата, ожидаемые неответы и возможное
      смещение.
  - step: 3
    action: 'Составить небольшую анкету: однозначные формулировки, один предмет на вопрос, единые периоды и
      шкалы; добавить фильтры релевантного опыта. Полный опросник консультант не генерирует по умолчанию.'
  - step: 4
    action: Проверить анкету пилотным заполнением и исправить неоднозначности до основного сбора.
  - step: 5
    action: Собрать ответы; хранить одну запись на респондента и отдельную информацию о способе привлечения
      и завершении анкеты.
  - step: 6
    action: Передать обезличенную таблицу, кодировку переменных, план выборки и число приглашённых/ответивших.
  minimum_record_fields:
  - respondent_id
  - segment
  - source_and_sampling_frame
  - eligibility
  - question_id
  - answer_code
  - response_timestamp
  - completion_status
  - recruitment_channel
  - sampling_weight_if_justified
  - questionnaire_version
  data_transfer_rule: Предавать исходные записи/таблицы и определения полей с информацией о способе сбора, периоде,
    пропусках и ограничениях. По возможности псевдонимизировать людей и организации; доступ к исходникам ограничить.
analytical_procedure:
  quality_checks_before_analysis:
  - Не считать процент удобной выборки процентом всех клиентов России.
  - Проверить пропуски, дубликаты и логику ответов.
  - Фиксировать фактический объём выборки по каждому вопросу.
  - Погрешность ±x% допустима только для соответствующего вероятностного дизайна и формулы.
  steps:
  - Вычислить частоты, доли и при необходимости интервалы неопределённости с учётом плана выборки.
  - При сравнении сегментов указать основания, объёмы, интервалы и риск множественных сравнений.
  - Проверить устойчивость выводов к пропускам и составу выборки.
russian_digital_market: Российские регионы, город/село, возрастные границы, B2B ОКВЭД и размеры предприятий
  могут быть важными основаниями стратификации, но только если они наблюдаются в данных. Соблюдать 152-ФЗ при
  сборе контактов и ответов.
interpretation_rules:
- Декларируемая готовность купить не равна фактической покупке.
- Веса не исправляют автоматически неучтённое смещение удобной выборки.
quality_control:
  execution_clarifications:
    - "При расчёте доли всегда указывать числитель, знаменатель, базу вопроса, число пропусков и правило включения ответа; отдельно описывать план выборки, веса и причины их применения."
    - "Для невзвешенной доли из простой случайной выборки допустим биномиальный интервал Уилсона с указанным уровнем доверия; для сложного дизайна учитывать страты/кластеры/веса и эффективный размер выборки подходящим дизайн-ориентированным методом, не применять обычный биномиальный интервал к взвешенной удобной выборке как к репрезентативной."
    - "Если выборка нерепрезентативна или дизайн неизвестен, показывать описательные доли только по участникам исследования без популяционных доверительных интервалов и без экстраполяции на рынок."
  common_gates:
  - У исследования есть конкретный вопрос и решение, для которого собираются данные.
  - Источник каждого вывода прослеживается до исходного наблюдения, анкеты или расчёта.
  - Ненаблюдаемые величины, гипотезы и ограничения явно маркируются; недостающее не подменяется выдуманными
    значениями.
  - Не переносить результаты нерепрезентативной выборки на всё население или рынок России.
  - При обработке персональных данных определить законное основание, минимизацию состава данных, права участников,
    безопасность и сроки хранения.
  completion_gates:
  - У исходных записей установлены единица наблюдения, дата, источники и условия измерения.
  - Показатели воспроизводимы; знаменатели и исключения записаны.
  - Применение метода не подменяется предположениями, когда требуется внешний сбор.
  - Честно записаны ограничения причинности, выборки и переносимости результатов.
structured_analytical_result:
  serialization_target: JSON после применения метода; эта методическая спецификация остаётся YAML.
  required_common_fields:
  - method_id
  - case_id
  - product_scope
  - data_collection_status
  - analysis_status
  - period
  - observations_count
  - inputs_and_source_refs
  - method_findings
  - quality_warnings
  - assumptions
  - limitations
  - decision_implications
  method_specific_fields:
  - survey_frame
  - sampling_design
  - counts_and_denominators
  - proportions_and_uncertainty
  - segment_comparisons
  - bias_assessment
  possible_statuses:
  - not_started
  - data_collection_needed
  - partial
  - completed_with_evidence
  - not_applicable
  no_report_rule: Выход — структурированные факты и выводы, не готовая презентация или рекламный текст.
worked_example:
  synthetic: true
  situation: Проверка частоты ручного согласования актов у малого бизнеса.
  expert_action: Собрал ответы с описанием базы отбора и разных отраслей.
  structured_result: Таблица долей по отраслям с фактическими знаменателями, типом выборки и предупреждением
    о границах обобщения.
related_core_methods_optional:
- M01 STP
- M05 JTBD
- M02 TAM/SAM/SOM
sources:
- title: AAPOR, Best Practices for Survey Research
  url: https://aapor.org/standards-and-ethics/best-practices/
- title: Федеральный закон №152-ФЗ «О персональных данных» — действующая редакция проверяется перед исследованием
  url: https://www.consultant.ru/document/cons_doc_LAW_61801/
  relevance: Если исследование обрабатывает персональные данные, определить основание, цель, сроки хранения
    и меры защиты; не заменяет юридическую проверку.
