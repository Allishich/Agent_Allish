meta:
  schema_version: '1.0'
  method_id: M21
  slug: unit_economics
  title: Unit Economics цифрового продукта
  language: ru
  version: 1.0.1
  prepared_on: '2026-11-21'
  method_family: Экономический анализ продукта
  method_group: existing_product
  document_status: самостоятельная прикладная методика, не отчёт о продукте
  reuse_policy: Самостоятельное изложение классического метода; тексты сторонних SKILL.md не копируются.
role:
  goal: Оценить прибыльность и окупаемость привлечения и обслуживания одной экономически осмысленной единицы
    продукта на основе фактической выручки и затрат.
  decision_question: Есть ли устойчивый вклад клиентов/сделок в валовую прибыль и каковы ограничения роста?
  applicability:
  - Работающий SaaS с клиентскими платёжными данными
  - Платное корпоративное ПО с затратами внедрения и сопровождения
  - Решение об изменении ценовой модели
  not_applicable_when:
  - Нет измеримого объекта монетизации или невозможно разложить выручку/затраты
  - До первой продажи возможна лишь сценарная модель, а не фактическая экономика
  autonomy: Самостоятельный метод; не требует применения остальных 20 методов.
  scope_boundary: Продуктовая стратегия цифрового продукта для российского рынка; не медиаплан, не копирайтинг,
    не разработка рекламной кампании.
theory:
  concepts:
  - term: Unit
    meaning: 'Экономическая единица: платящий аккаунт/организация, договор, пользователь или транзакция; должна
      соответствовать монетизации.'
  - term: CAC
    meaning: Полные затраты на привлечение новых платящих единиц, отнесённые к согласованному периоду и модели
      продаж.
  - term: Contribution margin
    meaning: Выручка минус связанные с единицей переменные/инкрементальные затраты; состав надо определить явно.
  - term: LTV
    meaning: Дисконтированная или недисконтированная прогнозная ценность потока маржи на протяжении жизненного
      цикла в принятой модели.
  formulas:
  - name: Средняя выручка на платящую единицу
    expression: ARPA = net_period_revenue_from_accounts / avg_paying_accounts_in_period
    preconditions: Сопоставимая периодичность и правильно определённое среднее число аккаунтов.
  - name: Валовая маржа
    expression: gross_margin = (net_revenue - COGS) / net_revenue
    preconditions: net_revenue > 0, COGS определены и исключено двойное отнесение расходов.
  - name: CAC
    expression: CAC = eligible_sales_and_marketing_acquisition_cost / new_paying_units
    preconditions: new_paying_units > 0; сопоставимы период, лаг и структура затрат.
  - name: Упрощённая окупаемость CAC
    expression: CAC_payback_months = CAC / monthly_contribution_margin_per_new_customer
    preconditions: Месячная маржа > 0, регулярная модель, исключены значимые разовые эффекты; иначе нужна модель
      денежных потоков.
input_contract:
  minimum:
  - Единица монетизации и временной период
  - Выручка по клиентам/договорам и тарифам
  - COGS и переменные затраты, включая инфраструктуру и поддержку по правилам учёта
  - Затраты на продажи и маркетинг
  - Количество новых платящих единиц
  - История оттока или наблюдения за оплатами
  optional:
  - По-клиентные затраты внедрения и сопровождения
  - Expansion, скидки, возвраты
  - Когортные показатели жизни клиента
  public_data_role: Общие расходы организаций России на цифровые технологии не являются выручкой или затратами
    исследуемого продукта; для unit economics нужны внутренние счета и операции.
expert_instruction:
  purpose: 'Краткая инструкция человеку: выполнить только недоступные консультанту действия и передать исходные
    сведения.'
  steps:
  - step: 1
    action: 'Определить экономическую единицу и модель: подписка, лицензия, внедрение, сопровождение, транзакция.'
  - step: 2
    action: Предоставить выручку с отделением НДС, возвратов, скидок и разовых поступлений от регулярных; зафиксировать
      применённые принципы учёта.
  - step: 3
    action: Разделить прямые расходы обслуживания (COGS), переменные затраты, расходы приобретения клиента и
      постоянные затраты; документировать допущения распределения.
  - step: 4
    action: Сопоставить период затрат привлечения и число новых платящих единиц с учётом длительных B2B-циклов
      и лагов.
  - step: 5
    action: Передать историю churn/retention и расходов; если история короткая, пометить LTV как сценарную модель.
  minimum_record_fields:
  - economic_unit
  - customer_or_account_id
  - period
  - currency
  - revenue_ex_vat
  - discounts_and_refunds
  - one_off_vs_recurring
  - direct_service_costs
  - variable_costs
  - acquisition_spend
  - new_paying_units
  - customer_cohort
  - churn_events
  - allocation_policy
  data_transfer_rule: Предавать исходные записи/таблицы и определения полей с информацией о способе сбора, периоде,
    пропусках и ограничениях. По возможности псевдонимизировать людей и организации; доступ к исходникам ограничить.
analytical_procedure:
  quality_checks_before_analysis:
  - Нельзя делить разовую B2B-лицензию на месяцы без явной модели признания выручки.
  - CAC должен содержать согласованные компоненты привлечения, а не только рекламу.
  - LTV основанный на 1/churn — грубая модель со строгими допущениями; не выдавать её за фактический LTV.
  - Не суммировать выручку с НДС с затратами без сопоставимых учётных основ.
  steps:
  - Согласовать зерно данных, валюту, период, единицу и политику распределения затрат.
  - Рассчитать выручку на единицу, валовую маржу и вклад; проверить отрицательный/нулевой вклад.
  - Рассчитать CAC, если известны связанные с приобретением затраты и число новых клиентов.
  - Оценить LTV по когортным денежным потокам или консервативным сценариям; не экстраполировать короткую историю
    механически.
  - Сравнить LTV/CAC, окупаемость и чувствительность к churn, цене, COGS и времени внедрения без универсальных
    «хороших» порогов.
russian_digital_market: 'В России часто встречаются смешанные модели: годовая лицензия, разовое внедрение, сопровождение,
  on-premise и подписка. Сохранять раздельные потоки и затраты, рублёвую базу, налоговые/учётные основания,
  комиссии посредников, стоимость российской инфраструктуры и интеграции.'
interpretation_rules:
- LTV/CAC не имеет смысла при несопоставимых единицах и периодах.
- Высокий средний чек не доказывает прибыльность после внедрения и сопровождения.
- Внутренняя модель не может заменить фактические бухгалтерские данные при инвестиционном решении.
quality_control:
  execution_clarifications:
    - "Перед расчётом зафиксировать платящую единицу, валюту, период, базу признания выручки, включение возвратов, определения валовой/вкладной маржи и состав прямых расходов. Не смешивать ARPU, ARPA, ARPPU и ACV без явного сопоставления единиц."
    - "CAC = затраты, относимые к привлечению за согласованный период / число новых платящих единиц соответствующей когорты; указать лаг между расходом и покупкой и метод атрибуции. При отсутствии допустимого знаменателя или атрибуции CAC = null."
    - "Основной наблюдаемый LTV = сумма реализованных когортных денежных вкладов по периодам наблюдения на исходную платящую единицу; прогнозный LTV строить отдельно с явной моделью удержания/маржи/горизонта/дисконтирования, если применимо, и маркировать как модельную оценку. Короткую историю не экстраполировать без предпосылок."
    - "Payback рассчитывать как первый момент, когда накопленный вклад на привлечённую единицу компенсирует CAC; если порог не достигнут в наблюдаемом горизонте, указывать «не достигнут», а не назначать фиктивный срок. Отрицательная маржа делает стандартный простой расчёт LTV/CAC неприменимым."
  common_gates:
  - У исследования есть конкретный вопрос и решение, для которого собираются данные.
  - Источник каждого вывода прослеживается до исходного наблюдения, анкеты или расчёта.
  - Ненаблюдаемые величины, гипотезы и ограничения явно маркируются; недостающее не подменяется выдуманными
    значениями.
  - Не переносить результаты нерепрезентативной выборки на всё население или рынок России.
  - При обработке персональных данных определить законное основание, минимизацию состава данных, права участников,
    безопасность и сроки хранения.
  completion_gates:
  - У исходных записей установлены единица наблюдения, дата, источники и условия измерения.
  - Показатели воспроизводимы; знаменатели и исключения записаны.
  - Применение метода не подменяется предположениями, когда требуется внешний сбор.
  - Честно записаны ограничения причинности, выборки и переносимости результатов.
