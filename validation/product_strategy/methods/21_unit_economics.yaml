  serialization_target: JSON после применения метода; эта методическая спецификация остаётся YAML.
  required_common_fields:
  - method_id
  - case_id
  - product_scope
  - data_collection_status
  - analysis_status
  - period
  - observations_count
  - inputs_and_source_refs
  - method_findings
  - quality_warnings
  - assumptions
  - limitations
  - decision_implications
  method_specific_fields:
  - unit_definition
  - period_and_accounting_basis
  - revenue_per_unit
  - gross_or_contribution_margin
  - CAC_if_identifiable
  - LTV_with_method_and_uncertainty
  - payback_if_identifiable
  - scenario_sensitivity
  - limitations
  possible_statuses:
  - not_started
  - data_collection_needed
  - partial
  - completed_with_evidence
  - not_applicable
  no_report_rule: Выход — структурированные факты и выводы, не готовая презентация или рекламный текст.
worked_example:
  synthetic: true
  situation: Российский B2B SaaS с платным внедрением и годовой подпиской.
  expert_action: Разделил цену внедрения, выручку от подписки, затраты поддержки и привлечения по клиентам.
  structured_result: Сегментные COGS, вклад, CAC и сценарный LTV с отдельной проверкой эффекта первоначального
    внедрения.
