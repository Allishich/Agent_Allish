    Указанные наборы «Рыночного агента» являются кандидатами, а не готовыми значениями. По каждому необходимы доступ к CSV, паспорт, первоисточник, проверка охвата, года и знаменателя; использовать только действительно совместимые наблюдения. Статистика 2020–2024 и публикации 2025 года не должна представляться как измерение 2026 года.
procedure:
- step: 07.1 Определить модель
  procedure: |-
    Зафиксировать продукт, сегменты, покупателя, пользователя, рынок, дату и стадию продукта. Для отдельных редакций или сегментов допустимы разные модели — не сводить в один Canvas несовместимые SaaS/B2G/B2C процессы.
  verification: |-
    Есть единица монетизации и понятная граница бизнеса; текущие факты отделены от планов.
  output: model_context
- step: 07.2 Клиенты и ценность
  procedure: |-
    Описать Customer Segments и Value Propositions. Для каждой пары сегмент–ценность указать задачу, результат, альтернативу и доказательство. Отличать пользователя от платящего заказчика.
  verification: |-
    Не описывать ценность как список функциональности без исхода для клиента.
  output: customer_value_pairs
- step: 07.3 Доставка и отношения
  procedure: |-
    Установить Channels как реальные процессы продажи, внедрения, предоставления доступа и обслуживания; Customer Relationships как поддержку, сопровождение и цикл продления. Не проектировать рекламные кампании.
  verification: |-
    Проверить, что модель self-service совместима с требованиями внедрения и согласования закупки.
  output: service_and_relationships
- step: 07.4 Денежные потоки
  procedure: |-
    Построить Revenue Streams по каждому сегменту: за что, как часто, в каких единицах, при каких правилах выставления счета. Разделить подписку, лицензии, внедрение и поддержку, скидки, сезонность.
  verification: |-
    Не складывать MRR и разовые внедренческие платежи как однородный показатель.
  output: revenue_mechanisms
- step: 07.5 Операционная основа
  procedure: |-
    Указать Key Resources, Key Activities, Key Partners с критичностью и заменяемостью. Проверить владение данными, зависимость от инфраструктуры и право эксплуатации компонента.
  verification: |-
    Зависимость от одного провайдера нельзя маскировать общим словом «партнеры».
  output: operational_model
- step: 07.6 Издержки
  procedure: |-
    Составить Cost Structure: фиксированные и переменные расходы, инфраструктура, внедрение, поддержка, лицензии сторонних компонентов, продажи и безопасность. Назвать драйверы затрат, не придумывая величины.
  verification: |-
    Критически важно отделить стоимость разработки продукта от себестоимости обслуживания нового клиента.
  output: cost_drivers
- step: 07.7 Проверить связность
  procedure: |-
    Проследить цепочку: ценность → покупатель → предложение → доставка → поступление денег → операционные ресурсы → себестоимость. Выявить невыполнимые обещания и конфликтующие предпосылки.
  verification: |-
    Canvas с девятью заполненными клетками не считается проверенным, если цепочка ресурсов и денег не связана.
  output: consistency_gaps
- step: 07.8 Варианты модели
  procedure: |-
    Если существует выбор — сравнить 2–3 модели (подписка, лицензия, hybrid) по допущениям, рискам и требованиям к тестам. Если выбор уже сделан, сформировать узкие проверки его жизнеспособности.
  verification: |-
    Не присваивать финансовый ROI без достаточных данных; получить сценарную расчетную модель с missing параметрами.
  output: model_alternatives
- step: 07.9 Итог и требования к данным
  procedure: |-
    Вернуть все девять блоков с фактами и unknown, карту зависимостей, проверки совместимости и гипотезы, способные изменить модель. Эксперт подтверждает выбор, а не метод автоматически.
  verification: |-
    Полнота описания не равна коммерческой жизнеспособности; статус решения должен это отражать.
  output: business_model_result
russian_digital_market: |-
  Для цифрового продукта в России наряду с SaaS встречаются on-prem и смешанные модели, где выручка от внедрения и кастомизации существенна. Для отдельных клиентов имеют значение отечественные инфраструктура и стек, учётные системы, условия хранения и обработки данных, информационная безопасность и специфика закупок. Правовую применимость проверять к категории продукта и данным конкретного заказчика. В финансовой части не смешивать ежемесячную подписку, бессрочную лицензию и стоимость человеко-дней внедрения; при необходимости учитывать НДС, инфляцию и курс раздельно.
interpretation_rules: |-
  Canvas — карта текущих фактов и структурных гипотез, а не автоматический бизнес-план. Его задача выявить причинно связанную модель работы. Даже при заполненных девяти блоках нельзя утверждать положительную маржу или наличие рынка без показателей затрат и продаж. Каналы здесь описывают доставку и коммерческий процесс, а не коммуникационную стратегию коллеги.
quality_control:
  global_data_checks:
  - Проверять существование исходного файла, dataset_id, паспорт и версию; каталог сам по себе не подтверждает значения.
  - 'Сопоставлять единицу наблюдения: компания, ИП, субъект МСП, домохозяйство, человек или пользователь 15+.'
  - Проверять дату, территорию, классификатор, числитель, знаменатель и охват выборки перед соединением таблиц.
  - При суммировании регионов исключать пересечения территорий и вложенные автономные округа; предпочитать национальный
    итог издателя.
  - Не объединять доли из разных генеральных совокупностей без отдельного, проверяемого обоснования.
  - Отличать отсутствие данных от числового нуля; не восстанавливать несуществующие совместные разрезы.
  - Помечать синтетические примеры как учебные, выводы и оценки — по уровню подтверждения.
  - Не утверждать существование работающего внешнего коннектора только потому, что источник описан в каталоге.
  method_specific:
  - Есть девять блоков с пометкой степени подтверждения
  - Проверена логика сегмент → ценность → деньги → доставка → затраты
  - В разделе выручки единицы времени и оплаты совместимы
  - Критические партнерские зависимости названы конкретно
  - Экономические показатели отсутствуют либо вычислены по проверенным входам
  - Каналы рекламного продвижения не подменяют операционные каналы доставки
  anti_patterns:
  - Заполнены девять блоков без связей между ними
  - Вся выручка названа ARR, включая внедрение
  - Внедрение и поддержка заявлены бесплатными без учёта затрат
  - Расходы по облаку забыты при usage-based модели
  - Смешение покупателей, пользователей, интеграторов
  - Пустые финансовые поля скрыты произвольными «рыночными» значениями
  stop_if: 'Не выводить численное заключение, если требуется отсутствующая генеральная совокупность, база пересчета,
    существенный коэффициент или независимое подтверждение: пометить результат partial/hypothesis_only/insufficient_data.'
structured_analytical_result:
  note: Схема результата — перечень логических полей, не самостоятельная JSON Schema; значения формируются при реальном
    применении.
  top_level_required:
  - method_id
  - case_id
  - analysis_date
  - product_context
  - status
  - inputs_used
  - outputs
  - evidence_register
  - assumptions_and_gaps
  - interpretation
  - quality_checks
  - expert_decision_required
  method_fields:
  - field: canvas_blocks
    type: object{customer_segments,value_propositions,channels,customer_relationships,revenue_streams,key_resources,key_activities,key_partners,cost_structure}
    required: true
  - field: segment_value_links
    type: array[object]
    required: true
  - field: revenue_models
    type: array[object]
    required: true
  - field: cost_drivers
    type: array[object]
    required: true
  - field: critical_dependencies
    type: array[object]
    required: true
  - field: consistency_findings
    type: array[object]
    required: true
  - field: business_model_options
    type: array[object]
    required: true
  evidence_standard:
    record_type: evidence
    required_fields:
    - 'evidence_id: уникальный ID'
    - 'claim_or_parameter_id: идентификатор вывода/параметра'
    - 'evidence_type: observed_fact | computed | interpretation | assumption | expert_assertion'
    - 'source_title: первоисточник или файл эксперта'
    - 'source_url_or_file_id: прямой путь/ID либо null с причиной'
    - 'dataset_id_and_version: если использован локальный набор'
    - 'date_observed_or_published: исходный год/дата'
    - 'retrieved_at: дата обращения, если внешняя веб-страница'
    - 'geography_and_population: географический охват, совокупность и знаменатель'
    - 'value_unit_formula_filters: значение, единица, формула и фильтры по возможности'
    - 'limitations: методические ограничения, в том числе наличие/отсутствие независимой проверки'
    integrity_rule: |-
      Ни один существенный численный вывод не должен существовать только как текст без ссылки на исходные показатели; предположения, суждения эксперта и наблюдаемые факты не являются одним типом доказательства. Нельзя присваивать статистический статус маркетинговым догадкам. Нельзя выдумывать цену, долю рынка, интервью, цитату, количественную частоту потребности или конверсию.
  status_values:
  - value: complete_with_evidence
    meaning: все существенные шаги проведены; источники и ограничения доступны
  - value: partial
    meaning: проведена подтвержденная часть; неопределенности и пробелы указаны
  - value: hypothesis_only
    meaning: получена проверяемая модель или гипотеза, но нет необходимых наблюдений
  - value: insufficient_data
    meaning: без ключевых данных выполнение метода недостоверно
  - value: not_applicable
    meaning: метод неприменим к задаче; причина записана
  serialization_policy: Числа как числа, не строки; отдельно валюты, периоды, единицы, знаменатели; null при неизвестном
    значении; дата и URL исходного источника; никаких фабрикованных данных
worked_example:
  is_synthetic: true
  case: 'Условная система учета заявок: SaaS vs on-prem'
  inputs:
  - 'SaaS: 9 000 руб./мес. за компанию — предположение'
  - 'On-prem: 180 000 руб. бессрочно + отдельно внедрение — предположение'
  - Вариант SaaS требует облака и службы поддержки, вариант on-prem требует инсталляции
  procedure:
  - Дать отдельные девять блоков для двух моделей, поскольку операционные ресурсы и выручка разные.
  - SaaS годовая плата на одну компанию при 12 месяцах = 108 000 руб., не включая разовое внедрение.
  - On-prem нельзя автоматически сравнить со 108 000 без горизонта TCO, затрат и модели поддержки.
  - Проверить предпочтения закупщиков и себестоимость поддержки каждого варианта.
  output: Два Canvas, карта противоречий и список необходимых затрат для выбора.
  not_real_data_warning: Тарифы и условия вымышлены для демонстрации.
