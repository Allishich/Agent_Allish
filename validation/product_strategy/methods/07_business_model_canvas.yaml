completion_conditions:
- Каждый требуемый показатель имеет определение и источник либо явно обозначен неизвестным.
- Выходные поля заполнены или содержат null и reason_missing; исключены неподтвержденные значения.
- Решение или альтернативы сопровождаются границами применимости и качеством доказательств.
- Обнаруженные противоречия не скрываются; для спорных фактов сохранены обе версии и их происхождение.
- Пример не интерпретирован как фактический результат российского рынка.
