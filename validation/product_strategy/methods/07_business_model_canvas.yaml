meta:
  schema_version: '1.0'
  method_id: M07
  slug: business_model_canvas
  title: Business Model Canvas — логика создания, доставки и присвоения ценности
  language: ru
  version: 1.0.0
  prepared_on: '2026-11-21'
  method_family: Структурный анализ бизнес-модели
  document_status: полная методологическая спецификация; не отчет по конкретному продукту
  editorial_license_note: Оригинальное изложение общепринятых методов; тексты SKILL.md Dean Peters не воспроизводятся
role:
  goal: |-
    Описать и подвергнуть проверке девять взаимосвязанных компонентов бизнес-модели цифрового продукта: целевые группы, ценность, взаимодействие, способ доставки, выручку, ресурсы, операции, партнёров и затраты. Выявить противоречия между обещанной ценностью, моделью поставки и экономикой без подмены Canvas финансовым прогнозом.
  questions:
  - Кто покупает продукт, кто его использует и за что платит?
  - Какое предложение и схема поставки позволяют обслуживать рынок?
  - Какие зависимости и издержки критичны?
  - Какие элементы модели противоречат друг другу или не подтверждены?
  applicability:
  - Новая цифровая бизнес-модель
  - Перевод лицензии на подписку
  - Выбор SaaS/on-prem/гибрид
  - Пересмотр роли внедрения и поддержки
  - Выход в корпоративный сегмент
  not_applicable_when:
  - Пользователи не определены даже гипотетически
  - Требуется только медиа-стратегия без оценки продукта и бизнес-операций
  mode: Самостоятельный метод; не требует выполнения других 9 методов
  scope_boundary: |-
    Предмет — продуктовая стратегия цифрового продукта для российского рынка. Выбор каналов продвижения, медиаплан и коммуникационные сообщения не являются результатом данного метода. Метод не принимает решений за эксперта: фиксирует варианты и их фактическую обоснованность.
theory:
  concepts:
  - term: Customer Segments
    meaning: Роли и группы покупателей; для B2B разделять пользователи, экономические покупатели, партнеры и интеграторы.
  - term: Value Propositions
    meaning: Результаты и преимущества по сегменту, а не абстрактная «платформа будущего».
  - term: Channels
    meaning: В этой методике — механизм доставки, продажи, внедрения и поддержки продукта, не рекламные каналы и контент.
  - term: Customer Relationships
    meaning: Self-service, сопровождение, сервисные контракты, техническая поддержка и удержание.
  - term: Revenue Streams
    meaning: Подписка, разовая лицензия, платеж за активность/место, внедрение, поддержка, API usage.
  - term: Key Resources
    meaning: Код, инфраструктура, данные, команда, права доступа, патенты/лицензии.
  - term: Key Activities
    meaning: Разработка, внедрение, сопровождение, мониторинг доступности, безопасность.
  - term: Key Partners
    meaning: Облако, дистрибьюторы, интеграторы, правообладатели компонентов, API/данные.
  - term: Cost Structure
    meaning: Разработка, облако, техническая поддержка, внедрение, хранение, продажи и иные расходы.
  formulas:
  - name: Годовая повторяющаяся выручка
    expression: ARR = sum(active_paid_subscriptions_i * net_annual_price_i)
    units: руб./год
    conditions: |-
      Только повторяющиеся доходы; разовые внедрения и невозобновляемые лицензии отдельно.
    interpretation: |-
      Расчетный run-rate или договорная повторяющаяся выручка в зависимости от формулировки; определения фиксировать.
  - name: Месячная валовая прибыль
    expression: gross_profit_month = monthly_revenue - attributable_direct_service_costs
    units: руб./месяц
    conditions: |-
      Сопоставимый месяц, определить прямые расходы; общие офисные расходы не называются себестоимостью без учетной политики.
    interpretation: |-
      Базовая проверка, не полноценный отчет о прибыли.
  - name: Себестоимость на клиента
    expression: cost_per_active_account = direct_service_costs / average_active_accounts
    units: руб./аккаунт/период
    conditions: |-
      Клиенты и затраты в одном периоде; учитывать диапазон нагрузок и тарифы инфраструктуры.
    interpretation: |-
      Драйвер масштабирования модели; нельзя переносить между разными архитектурами без проверки.
input_contract:
  mandatory:
  - field: product_value_and_user
    definition: Описание цифрового продукта, отдельные покупатель и пользователь
    data_type: text
    preferred_source: Эксперт и продуктовая документация
    if_missing: Зафиксировать отсутствие; не подменять догадкой
  - field: revenue_mechanism
    definition: За что и кто платит; цена, период, единица, налоговая база
    data_type: text
    preferred_source: Тарифы, контракты, эксперт
    if_missing: Модель монетизации — только гипотеза
  - field: delivery_model
    definition: SaaS, API, on-prem, гибрид, сервис с внедрением
    data_type: text
    preferred_source: Архитектура и операционная модель
    if_missing: Зафиксировать отсутствие; не подменять догадкой
  - field: nine_canvas_elements
    definition: Девять блоков с описанием известных фактов и допущений
    data_type: object
    preferred_source: Эксперт, документы, публичные условия
    if_missing: Зафиксировать отсутствие; не подменять догадкой
  helpful:
  - field: direct_unit_costs
    definition: Себестоимость на пользователя/клиента/запрос и ее компоненты
    data_type: text
    preferred_source: Финансовые и инфраструктурные логи
    if_missing: Зафиксировать отсутствие; не подменять догадкой
  - field: customer_process
    definition: Закупочные роли, срок сделки, переход, контракт, сопровождение
    data_type: text
    preferred_source: CRM, интервью
    if_missing: Зафиксировать отсутствие; не подменять догадкой
  - field: partner_terms
    definition: Договоры, ограничения API, реселлерские комиссии, облачные тарифы
    data_type: text
    preferred_source: Условия провайдеров, контракты
    if_missing: Зафиксировать отсутствие; не подменять догадкой
  - field: churn_and_expansion
    definition: Фактическое удержание и выручка по аккаунту
    data_type: text
    preferred_source: Финансовая и продуктовая аналитика
    if_missing: Зафиксировать отсутствие; не подменять догадкой
  expert_inputs:
  - Тарифы и продуктовая комплектация
  - Доступные ресурсы команды и инфраструктуры
  - Структура выручки и затрат — факты либо гипотезы
  - Схема внедрения, продаж и поддержки
