  external_data_candidates:
  - 'ФНС МСП и Росстат: база оценки новых сегментов'
  - Публичные конкуренты и требования к новым продуктовым категориям
  - Фактические закупки/тендеры как дополнительный сигнал спроса при сопоставимости
  data_use_rule: |-
    Указанные наборы «Рыночного агента» являются кандидатами, а не готовыми значениями. По каждому необходимы доступ к CSV, паспорт, первоисточник, проверка охвата, года и знаменателя; использовать только действительно совместимые наблюдения. Статистика 2020–2024 и публикации 2025 года не должна представляться как измерение 2026 года.
procedure:
- step: 10.1 Текущая база
  procedure: |-
    Зафиксировать реально продаваемые цифровые продукты, редакции и покупателей компании, период и географию. Отдельно назвать сегменты, в которые компания только собирается выходить.
  verification: |-
    Если исходной базы продаж нет, использовать матрицу только как классификацию альтернатив, не как расчет роста.
  output: existing_baseline
- step: 10.2 Критерий новизны
  procedure: |-
    Определить, что будет считаться существенным новым продуктом: новая задача клиента, платный модуль, иная архитектура/предложение. Новый рынок — новые покупатели/отрасль/территория по проверяемому признаку. Обычная версия интерфейса не обязательно новый продукт.
  verification: |-
    Переход на on-prem для того же клиента может быть новым предложением, но классификацию нужно обосновать.
  output: newness_criteria
- step: 10.3 Варианты
  procedure: |-
    Сформировать для четырех квадрантов конкретные продуктовые инициативы. Проникновение: рост текущих клиентов и использования. Развитие рынка: новая отрасль/регион. Развитие продукта: новая ценность прежним клиентам. Диверсификация: новый продукт новому клиенту.
  verification: |-
    Матрица классифицирует варианты, но не требует заполнить заведомо неприменимый квадрант искусственной идеей.
  output: ansoff_quadrants
- step: 10.4 Спрос и конкуренция
  procedure: |-
    Для каждого варианта описать целевую потребность, существующую альтернативу, подтверждения и конкуренцию. Для новых рынков отдельно оценить доступную совокупность и ограничения выхода.
  verification: |-
    Численность новой отрасли не является доказательством покупки продукта; задачи клиентов не переносятся без проверки.
  output: option_market_cases
- step: 10.5 Ресурсы и компетенции
  procedure: |-
    Рассмотреть недостающие интеграции, стек, надежность, поддержку, цикл сделки, маркетинговые/сбытовые компетенции только как ресурсные зависимости. Выявить общие ресурсы между исходным и новым направлением.
  verification: |-
    Оценка «диверсификация рискованна» должна объясняться конкретными разрывами в навыках и ресурсах.
  output: resource_gaps
- step: 10.6 Экономика и риск
  procedure: |-
    При наличии данных построить прибавку выручки, затраты разработки/внедрения, время до продаж, риск каннибализации. Для непроверенных параметров — сценарий с явными диапазонами, без выдуманных вероятностей.
  verification: |-
    Нельзя суммировать потенциальные рынки как гарантированный прирост выручки.
  output: option_business_cases
- step: 10.7 Сопоставление
  procedure: |-
    Сравнить варианты по величине потребности, достижимости, затратам, времени, зависимостям, неопределенности. Важно сохранять квадрантную классификацию, но не ранжировать автоматически по общему «уровню риска» квадранта.
  verification: |-
    Общее правило «диверсификация наиболее рискованна» не заменяет данные о конкретной компании.
  output: growth_option_comparison
- step: 10.8 Рекомендации и пределы
  procedure: |-
    Выдать перечень гипотез роста, их квадранты, ключевые доказательства и тесты, переходные ресурсы и стратегический смысл. Отметить решение эксперта и условия отмены гипотезы.
  verification: |-
    Не считать готовый квадрантный перечень утвержденной стратегией роста.
  output: growth_options_result
russian_digital_market: |-
  В России расширение ПО на новую отрасль может зависеть от отраслевых информационных систем, документооборота, типовых интеграций и закупочного цикла. Выход из частного B2B в государственный сектор — часто новый рынок с иными процедурами; не считать его простой географической экспансией. Для цифровых продуктов диверсификация может включать новую пользовательскую задачу на том же техническом стеке, но спрос и компетенции должны исследоваться отдельно. Статистика МСП, Росстата и цифровой активности дает лишь исходную численность/условия новых сегментов, а не подтвержденные приросты выручки.
interpretation_rules: |-
  Квадранты Ансоффа — классификация направлений роста относительно исходного бизнеса, а не система объективных оценок риска. Одна инициатива может сочетать развитие рынка и продукта; в таком случае описать составные элементы и не скрывать смешанный характер. Для стартапа без текущего предложения или рынка матрица менее информативна и применяется только как качественный сценарный инструмент.
quality_control:
  global_data_checks:
  - Проверять существование исходного файла, dataset_id, паспорт и версию; каталог сам по себе не подтверждает значения.
  - 'Сопоставлять единицу наблюдения: компания, ИП, субъект МСП, домохозяйство, человек или пользователь 15+.'
  - Проверять дату, территорию, классификатор, числитель, знаменатель и охват выборки перед соединением таблиц.
  - При суммировании регионов исключать пересечения территорий и вложенные автономные округа; предпочитать национальный
    итог издателя.
  - Не объединять доли из разных генеральных совокупностей без отдельного, проверяемого обоснования.
  - Отличать отсутствие данных от числового нуля; не восстанавливать несуществующие совместные разрезы.
  - Помечать синтетические примеры как учебные, выводы и оценки — по уровню подтверждения.
  - Не утверждать существование работающего внешнего коннектора только потому, что источник описан в каталоге.
  method_specific:
  - Определены исходные текущий продукт и рынок
  - Новизна каждого варианта классифицирована по одной логике
  - Каждый вариант связан с реальной клиентской задачей и источником
  - Оценена дополнительная стоимость ресурсов и внедрения
  - Новый рынок не назван автоматически достижимым SAM
  - Ранг не выводится из одной лишь принадлежности квадранту
  anti_patterns:
  - Новая версия интерфейса автоматически названа диверсификацией
  - Выход к госзаказчикам посчитан прежним рынком без проверки
  - Новый рынок определен как «все остальные компании»
  - Квадрант подменяет расчет спроса
  - Рост объема рынка приравнен к продажам компании
  - Диверсификация без оценки недостающих компетенций
  - Отсутствие учета каннибализации и нагрузки поддержки
  stop_if: 'Не выводить численное заключение, если требуется отсутствующая генеральная совокупность, база пересчета,
    существенный коэффициент или независимое подтверждение: пометить результат partial/hypothesis_only/insufficient_data.'
structured_analytical_result:
  note: Схема результата — перечень логических полей, не самостоятельная JSON Schema; значения формируются при реальном
    применении.
  top_level_required:
  - method_id
  - case_id
  - analysis_date
  - product_context
  - status
  - inputs_used
  - outputs
  - evidence_register
  - assumptions_and_gaps
  - interpretation
  - quality_checks
  - expert_decision_required
  method_fields:
  - field: baseline_product_market
    type: object
    required: true
  - field: newness_rules
    type: object
    required: true
  - field: growth_options
    type: array[{option_id,quadrant,product_newness,market_newness,customer_job,market_evidence,resources,risks}]
    required: true
  - field: option_economics
