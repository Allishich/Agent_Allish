meta:
  schema_version: '1.0'
  method_id: M10
  slug: ansoff_matrix
  title: Матрица Ансоффа — выбор направлений продуктово-рыночного роста
  language: ru
  version: 1.0.0
  prepared_on: '2026-11-21'
  method_family: Стратегические варианты развития
  document_status: полная методологическая спецификация; не отчет по конкретному продукту
  editorial_license_note: Оригинальное изложение общепринятых методов; тексты SKILL.md Dean Peters не воспроизводятся
role:
  goal: |-
    Систематизировать варианты роста цифрового продукта по двум независимым осям: существующий/новый продукт и существующий/новый рынок. Для каждой квадрантной стратегии определить конкретные решения, требования к данным, возможную синергию, ресурсы и ключевые неопределенности — не путать классификацию роста с доказательством выгодности.
  questions:
  - Можно ли увеличить проникновение на текущем рынке с текущим продуктом?
  - Есть ли смысл вывести существующий продукт в новый сегмент?
  - Какие новые возможности предложить прежним клиентам?
  - Оправдана ли диверсификация в новый продукт и новый рынок?
  applicability:
  - Планирование роста действующего SaaS/ПО
  - Расширение продуктовой линейки
  - Переход в новый отраслевой сегмент или географию
  - Выбор между развитием текущего продукта и новой инициативой
  not_applicable_when:
  - Нет даже гипотетически определённого исходного продукта и текущего рынка; матрица не заменяет первичное исследование
    новой идеи
  - Требуется диагностика отдельных интерфейсных проблем без выбора роста
  mode: Самостоятельный метод; не требует выполнения других 9 методов
  scope_boundary: |-
    Предмет — продуктовая стратегия цифрового продукта для российского рынка. Выбор каналов продвижения, медиаплан и коммуникационные сообщения не являются результатом данного метода. Метод не принимает решений за эксперта: фиксирует варианты и их фактическую обоснованность.
theory:
  concepts:
  - term: Market Penetration
    meaning: Существующий продукт на существующем рынке; улучшение доли/частоты/удержания.
  - term: Market Development
    meaning: 'Существующий продукт на новом рынке: новая группа покупателей, отрасль, территория/контекст.'
  - term: Product Development
    meaning: Новый продукт или существенное предложение существующим покупателям.
  - term: Diversification
    meaning: Новый продукт на новом рынке, с отдельной оценкой рисков и возможной синергии.
  - term: Existing vs new
    meaning: «Новый» определяется относительно фактически обслуживаемых продуктов/клиентов компании, не относительно
      мировой технологической новизны.
  - term: Adjacent growth
    meaning: Расширение, при котором часть клиентов, компетенций, данных или каналов уже существует; не автоматически
      низкий риск.
  formulas:
  - name: Инкрементальный доход
    expression: incremental_revenue = revenue_with_option - baseline_revenue
    units: руб./год
    conditions: |-
      Равные периоды, учет каннибализации; обе величины должны быть основаны на сопоставимых данных или явных сценариях.
    interpretation: |-
      Ориентир коммерческого эффекта, не гарантированная выручка.
  - name: Чистый денежный эффект до дисконтирования
    expression: net_incremental_effect_H = incremental_revenue_H - incremental_cost_H
    units: рублей за H периодов
    conditions: |-
      Учитывать прямые расходы, разработку, интеграции, поддержку; не называть чистой прибылью без полной структуры затрат и налогов.
    interpretation: |-
      Грубое сравнение вариантов при проверенных предпосылках.
input_contract:
  mandatory:
  - field: current_product_baseline
    definition: Что реально предлагается и покупается сейчас; версия, функциональность, цена
    data_type: text
    preferred_source: Владелец продукта, договоры и аналитика
    if_missing: Зафиксировать отсутствие; не подменять догадкой
  - field: current_market_baseline
    definition: Кто реально покупает сейчас и в каких случаях
    data_type: text
    preferred_source: CRM, контракты, данные о клиентах
    if_missing: Для стартапа матрица предварительная, может быть неприменима
  - field: growth_options
    definition: Перечень обоснованных возможностей роста, не менее одной в релевантных квадрантах
    data_type: array[object]
    preferred_source: Эксперт и исследования рынка
    if_missing: Зафиксировать отсутствие; не подменять догадкой
  - field: newness_rule
    definition: Критерии различения нового продукта и нового рынка для данной компании
    data_type: text
    preferred_source: Явная методическая запись
    if_missing: Зафиксировать отсутствие; не подменять догадкой
  helpful:
  - field: retention_and_expansion
    definition: Продления, MRR/ARR, usage, выручка по сегментам
    data_type: text
    preferred_source: Собственная аналитика
    if_missing: Зафиксировать отсутствие; не подменять догадкой
  - field: new_segment_size
    definition: Число потенциальных клиентов и подтвержденная доступность новых сегментов
    data_type: text
    preferred_source: Росстат/ФНС и исследования
    if_missing: Зафиксировать отсутствие; не подменять догадкой
  - field: incremental_cost
    definition: Прирост затрат на функции, интеграции, продажи, поддержку, технологию
    data_type: text
    preferred_source: Командная оценка и контракты
    if_missing: Зафиксировать отсутствие; не подменять догадкой
  - field: market_access_constraints
    definition: Локализация, закупочные требования, партнеры, переводы, сетевые эффекты
    data_type: text
    preferred_source: Официальные требования и исследование
    if_missing: Зафиксировать отсутствие; не подменять догадкой
  - field: cross_sell_signals
    definition: Подтвержденный запрос существующих клиентов на новую функциональность
    data_type: text
    preferred_source: Интервью/обращения/покупки
    if_missing: Зафиксировать отсутствие; не подменять догадкой
  expert_inputs:
  - Текущие сегменты и контракты
  - Возможности команды для выхода в новую категорию
  - Финансовые/технические ограничения и горизонт роста
