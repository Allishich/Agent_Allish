meta:
  schema_version: '1.0'
  method_id: M11
  slug: in_depth_interviews
  title: 'Глубинные интервью: выявление задач и проблем клиентов'
  language: ru
  version: 1.0.0
  prepared_on: '2026-11-21'
  method_family: Качественное исследование
  method_group: new_product_idea
  document_status: самостоятельная прикладная методика, не отчёт о продукте
  reuse_policy: Самостоятельное изложение классического метода; тексты сторонних SKILL.md не копируются.
role:
  goal: Получить проверяемые описания опыта, контекстов, проблем, альтернатив и мотивов потенциальных пользователей
    и покупателей.
  decision_question: Какая клиентская задача существенна и какие гипотезы требуют проверки?
  applicability:
  - Идея цифрового B2B/B2C-продукта
  - Поиск неудовлетворённой потребности
  - Проверка ошибочных представлений о пользователях
  not_applicable_when:
  - Нужна доля клиентов в генеральной совокупности — нужен количественный дизайн
  - Требуется измерить фактическое выполнение задачи в интерфейсе — нужно наблюдение или usability test
  autonomy: Самостоятельный метод; не требует применения остальных 20 методов.
  scope_boundary: Продуктовая стратегия цифрового продукта для российского рынка; не медиаплан, не копирайтинг,
    не разработка рекламной кампании.
theory:
  concepts:
  - term: Полуструктурированное интервью
    meaning: Беседа с общими тематическими направлениями и уточняющими вопросами без навязывания ответов.
  - term: Наблюдение vs интерпретация
    meaning: Дословно сказанное или описанное участником не равно объяснению причин исследователем.
  formulas: []
input_contract:
  minimum:
  - Определённая клиентская задача и исследовательский вопрос
  - Критерии отбора собеседников по релевантному опыту
  - Список тематических направлений
  - Возможность фиксировать ответы с соблюдением требований к данным
  optional:
  - Статистика сегмента для поиска целевых ролей
  - Предыдущие обращения клиентов и обращения в поддержку
  public_data_role: Наша демографическая и B2B-статистика помогает определить группы поиска респондентов, но
    не заменяет интервью.
expert_instruction:
  purpose: 'Краткая инструкция человеку: выполнить только недоступные консультанту действия и передать исходные
    сведения.'
  steps:
  - step: 1
    action: 'Сформулировать одну исследовательскую цель: какое решение по продукту нужно принять и чего пока
      не знаем.'
  - step: 2
    action: Определить 2–3 категории участников по опыту решения задачи; в B2B отдельно предусмотреть пользователя
      и принимающего решение о покупке.
  - step: 3
    action: 'Самостоятельно сформулировать короткий перечень тем: ситуация возникновения задачи, текущий способ
      решения, затраты/последствия, причины смены решения. Вопросы открытые, нейтральные, о конкретном прошлом
      поведении; готовый вопросник не требуется.'
  - step: 4
    action: Провести беседы; не продавать продукт во время интервью, не предлагать ожидаемые ответы, спрашивать
      про реальные случаи, отмечать противоречия.
  - step: 5
    action: Сразу после каждой беседы записать содержательные ответы, источник и контекст. При разрешённой записи
      сохранить ссылку на расшифровку; при отсутствии разрешения — обезличенные заметки.
  - step: 6
    action: Передать консультанту таблицу наблюдений; сообщить, кого удалось и не удалось опросить. Остановку
      определять разнообразием и повторяемостью существенных тем, а не универсальным числом интервью.
  minimum_record_fields:
  - respondent_id (псевдоним)
  - segment
  - role_buyer_or_user
  - recruitment_method
  - date
  - topic
  - answer_or_observation
  - literal_quote_if_available
  - researcher_interpretation_separate
  - source_record_ref
  - consent_or_lawful_basis_status
  data_transfer_rule: Предавать исходные записи/таблицы и определения полей с информацией о способе сбора, периоде,
    пропусках и ограничениях. По возможности псевдонимизировать людей и организации; доступ к исходникам ограничить.
analytical_procedure:
  quality_checks_before_analysis:
  - Не выдумывать цитаты и числа интервью.
  - Отделять ответ, пересказ интервьюера и его гипотезу.
  - Указать размер и принцип набора выборки.
  - В B2B не смешивать мнения пользователей и бюджетодержателей.
  steps:
  - Закодировать отдельные наблюдения по темам и респондентам.
  - Выделить повторяющиеся потребности и исключения; для каждой темы указать число участников, но не долю всего
    рынка.
  - Сформулировать проверяемые гипотезы и вопросы для последующего наблюдения/опроса.
russian_digital_market: В РФ обеспечить законное основание обработки персональных данных; для корпоративных
  интервью исключить разглашение коммерческой тайны и закрытой информации. Онлайн-источники и статистика полезны
  только для предварительного отбора.
interpretation_rules:
- Интервью не оценивает рыночную долю, распространённость проблемы и готовность реально оплатить продукт.
- Устные обещания покупки не равны сделке.
quality_control:
  common_gates:
  - У исследования есть конкретный вопрос и решение, для которого собираются данные.
  - Источник каждого вывода прослеживается до исходного наблюдения, анкеты или расчёта.
  - Ненаблюдаемые величины, гипотезы и ограничения явно маркируются; недостающее не подменяется выдуманными
    значениями.
  - Не переносить результаты нерепрезентативной выборки на всё население или рынок России.
  - При обработке персональных данных определить законное основание, минимизацию состава данных, права участников,
    безопасность и сроки хранения.
  completion_gates:
  - У исходных записей установлены единица наблюдения, дата, источники и условия измерения.
  - Показатели воспроизводимы; знаменатели и исключения записаны.
  - Применение метода не подменяется предположениями, когда требуется внешний сбор.
  - Честно записаны ограничения причинности, выборки и переносимости результатов.
structured_analytical_result:
  serialization_target: JSON после применения метода; эта методическая спецификация остаётся YAML.
  required_common_fields:
  - method_id
  - case_id
  - product_scope
  - data_collection_status
  - analysis_status
  - period
  - observations_count
  - inputs_and_source_refs
  - method_findings
  - quality_warnings
  - assumptions
  - limitations
  - decision_implications
  method_specific_fields:
  - themes_by_segment
  - observations_with_source_ids
  - contradictions
  - unsupported_claims
  - follow_up_research_needs
  possible_statuses:
  - not_started
  - data_collection_needed
  - partial
  - completed_with_evidence
  - not_applicable
  no_report_rule: Выход — структурированные факты и выводы, не готовая презентация или рекламный текст.
worked_example:
  synthetic: true
  situation: Сервис электронного согласования документов для небольших производств.
  expert_action: Поговорил с мастерами и директорами об уже происходивших задержках согласования и записал разные
    ответы по ролям.
  structured_result: Список подтверждённых эпизодов, различий ролей, текущих альтернатив и гипотез без процента
    рынка.
related_core_methods_optional:
- M01 STP
- M05 JTBD
- M06 Value Proposition Canvas
sources:
- title: Nielsen Norman Group, User Interviews 101
  url: https://www.nngroup.com/articles/user-interviews/
- title: Nielsen Norman Group, Why User Interviews Fail
  url: https://www.nngroup.com/articles/why-user-interviews-fail/
- title: Федеральный закон №152-ФЗ «О персональных данных» — действующая редакция проверяется перед исследованием
  url: https://www.consultant.ru/document/cons_doc_LAW_61801/
  relevance: Если исследование обрабатывает персональные данные, определить основание, цель, сроки хранения
    и меры защиты; не заменяет юридическую проверку.
