schema_version: "0.2"
method_id: M10
name: "Проектирование коммуникационного пути"
stage: C05
selection: conditional
trigger: "Последовательность контактов, onboarding, напоминания, CRM или переход между каналами способны изменить коммуникационное решение"
purpose: "Спроектировать проверяемую последовательность коммуникационных контактов с понятными задачами, триггерами, разрешёнными сообщениями и ограничениями, не выдавая гипотетический пользовательский путь за наблюдаемый."
inputs:
  required: [confirmed_brief]
  optional: [available_product_outputs, M03_audience_contexts, M04_barrier_hypotheses, M06_recommendation, M07_audience_message_matrix, M08_allowed_wording, M09_touchpoint_map, M09_recommended_portfolio, behavioral_data, customer_research, consent_rules, team_capacity]
selection_gate:
  select_if:
    - "Порядок касаний влияет на понимание, доверие, согласие или целевое действие"
    - "Есть несколько этапов onboarding, CRM, повторных касаний или переходов между каналами"
  skip_if:
    - "Одного контакта достаточно и проектирование последовательности не изменит решение"
  record: [decision_question, selection_reason, expected_decision_impact]
definitions:
  journey_stage: "Этап решения аудитории, а не обязательно экран или функция продукта."
  touchpoint: "Конкретный момент и канал контакта."
  trigger: "Наблюдаемое событие или условие, при котором коммуникация уместна."
  next_action: "Проверяемое действие пользователя, которое доступно на текущем этапе продукта."
procedure:
  - step: "01_define_scope_and_entry"
    actions:
      - "Укажи аудиторию, цель, начало и конец пути, географию, стадию продукта и ключевое действие; неизвестные параметры пометь unknown."
      - "Возьми аудиторию и контекст из M03, барьеры из M04, сообщения из M07, запреты M08 и каналы/точки контакта из M09."
      - "Не проектируй путь реального пользователя работающего сервиса, если существует только идея; в таком случае проектируй путь проверки концепции."
      - "Проверь условие запуска метода и запиши, почему он нужен или почему его следует пропустить."
  - step: "02_collect_actual_behavior"
    actions:
      - "Проверь доступные события аналитики, результаты интервью, записи поддержки, реальные коммуникации, данные о согласии и причины отказа."
      - "Для каждого наблюдения сохрани источник, дату, аудиторию, размер и ограничения выборки; отдели фактическое поведение от предположения."
      - "Если нужны данные общего цифрового контекста по РФ, используй research_data/START_HERE.md, data_rules.md, routing.json, manifest.json, паспорт и фактический CSV по релевантному маршруту; не выводи путь конкретного продукта из общей интернет-статистики."
      - "Если данных нет, обозначь будущие этапы как hypothesis и не придумывай частоты переходов, отток или конверсию."
  - step: "03_map_decision_stages"
    actions:
      - "Определи только необходимые этапы: обнаружение, понимание механики, проверка доверия, решение, действие, возвращение; исключи лишние."
      - "Для каждого этапа укажи вопрос пользователя, барьер, требуемое доказательство, целевое действие и возможную причину остановки."
      - "Отдельно зафиксируй выход без действия, отказ и возможность прекратить коммуникацию; не считай всех людей движущимися по одной линейной воронке."
      - "Различай продуктовые события и коммуникационные касания; не выдумывай существующие функции."
  - step: "04_design_touchpoints_and_triggers"
    actions:
      - "Для каждого этапа выбери подходящий канал из M09, разрешённое сообщение из M07/M08, формат, наблюдаемый триггер и следующее действие."
      - "Предусмотри ветвления для непонимания, отсутствия интереса, недоверия, отказа и возврата; не дублируй одно сообщение на всех этапах."
      - "Не назначай триггеры на недоступные события и не требуй данных, которые продукт не собирает."
      - "Если канал или триггер гипотетический, укажи зависимость и способ проверки."
  - step: "05_set_frequency_consent_and_safety"
    actions:
      - "Укажи предварительные ограничения частоты, повторов, времени контакта и прекращения сообщений; если нет данных, не выдавай выбранную частоту за оптимальную."
      - "Проверь законное основание коммуникации, пользовательское согласие, отписку, приватность и возрастные ограничения для соответствующей географии; юридическую проверку помечай как необходимую, а не проведённую."
      - "Для чувствительных сценариев не раскрывай личные данные, участие в сервисе или сведения о встречах через неподходящие уведомления."
      - "Не используй давление, ложную срочность или обещания, запрещённые M08."
  - step: "06_evaluate_feasibility"
    actions:
      - "Проверь, может ли команда реализовать каждый контакт: канал, контент, событие, инструмент, владелец, время и ресурс."
      - "Раздели минимальный путь для проверки гипотезы и расширенный путь после подтверждения продукта."
      - "Если критическая функция отсутствует, создай product_gap_flag и передай главному агенту; не маскируй пробел сообщением."
  - step: "07_design_measurement_and_test"
    actions:
      - "Для каждого перехода определи событие, числитель и знаменатель метрики, доступность измерения и наблюдаемое нежелательное последствие."
      - "Сравни минимальный путь с альтернативной последовательностью или отсутствием дополнительного касания; не считай корреляцию доказательством причинности."
      - "Задай период наблюдения, критерии остановки, пересмотра и проверки понимания; не выдумывай результаты или статистическую значимость."
      - "Если продукт на стадии идеи, измеряй понимание и осмысленный интерес, а не реальные свидания или удержание."
  - step: "08_handoff_and_quality_gate"
    actions:
      - "Передай M11 гипотезы, контрольный вариант, события и метрики; главному агенту — зависимости, запросы данных и ограничения."
      - "Проверь, что каждое касание имеет задачу, допустимое сообщение, реальный или условный триггер и понятный следующий шаг."
      - "При нехватке данных верни partial с минимальным условным путём и планом проверки, а не фиктивной воронкой."
outputs:
  required: [question, selection_rationale, journey_scope, evidence_refs, stage_map, touchpoint_sequence, branches_and_exits, frequency_and_consent_constraints, measurement_plan, product_gap_flags, decision_impact, assumptions, limitations, data_requests, status]
  stage_fields: [stage_id, audience_question, barrier, required_proof, desired_action, evidence_status]
  touchpoint_fields: [stage_id, channel, trigger, message_ref, allowed_wording_status, next_action, owner_or_dependency, frequency_limit, opt_out]
  measurement_fields: [transition, event, numerator, denominator, baseline_or_comparison, observation_period, stop_or_revisit_condition, harm_signal]
quality_checks:
  - "Метод действительно нужен, а не выбран автоматически?"
  - "Этапы основаны на поведении или явно помечены как гипотезы?"
  - "Все каналы и сообщения согласованы с M09 и M08?"
  - "У каждого касания есть триггер, действие, возможность выхода и ограничения частоты?"
  - "Не заявлены несуществующие продуктовые события или конверсии?"
  - "Можно проверить, улучшает ли последовательность результат по сравнению с альтернативой?"
evidence_rules:
  do_not_fabricate_primary_research: true
  label_hypotheses: true
  no_unsupported_metrics: true
  insufficient_data: partial
  no_assumed_user_journey: true
  respect_consent_and_opt_out: true
example_case:
  input: "Только идея сервиса знакомств без лайков, где люди сразу идут на свидания; нет приложения и подтверждённого сценария."
  acceptable_output: "Условный путь проверки концепции: человек видит честное описание идеи → читает предполагаемую механику → отвечает на нейтральные вопросы о понимании и интересе → по отдельному согласию может оставить контакт для обновлений. Нельзя изображать состоявшуюся регистрацию, подбор пары или свидание."
  unacceptable_output: "После регистрации пользователь автоматически получает партнёра, а через 24 часа — гарантированное свидание; напоминания увеличивают конверсию на 30%."
