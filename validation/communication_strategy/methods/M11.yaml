schema_version: "0.2"
method_id: M11
name: "План проверки коммуникационных гипотез"
stage: C06
selection: base
trigger: "Всегда"
purpose: "Спроектировать проверку коммуникационного решения, позволяющую отличить понимание и доверие к сообщению от реального спроса и продуктового эффекта, с контрольным вариантом, метриками и заранее заданными правилами решения."
inputs:
  required: [confirmed_brief]
  optional: [available_product_outputs, M03_audience_contexts, M04_barrier_hypotheses, M06_recommendation, M07_message_house, M08_allowed_wording, M09_recommended_portfolio, M10_touchpoint_sequence, existing_analytics, research_findings, resources, relevant_evidence]
definitions:
  communication_hypothesis: "Проверяемое предположение о влиянии конкретного сообщения, формата, канала или последовательности контактов на понимание, доверие или наблюдаемое действие."
  primary_metric: "Одна главная измеримая величина, соответствующая решению."
  guardrail_metric: "Показатель нежелательного эффекта, который может остановить тест даже при улучшении основной метрики."
  control: "Сопоставимый вариант без проверяемого изменения; при отсутствии возможности контроля явно обозначить ограничение причинного вывода."
procedure:
  - step: "01_define_decision"
    actions:
      - "Сформулируй, какое конкретное коммуникационное решение будет принято по результатам: оставить, изменить, остановить или проверить дополнительно."
      - "Укажи аудиторию, географию, стадию продукта, доступные ресурсы и ключевую неопределённость; неизвестное пометь unknown."
      - "Возьми утверждения и барьеры из M03/M04, позицию M06, сообщения M07, запреты M08, каналы M09 и путь M10, если он был выбран."
      - "Отдели коммуникационный вопрос от продуктового: тест текста не доказывает работоспособность функции, безопасность или рыночный спрос."
  - step: "02_prioritize_hypotheses"
    actions:
      - "Собери кандидаты-гипотезы, связанные с конкретным решением, и выбери одну главную для первого теста; дополнительные пометь как будущие."
      - "Для главной гипотезы укажи аудиторию, изменение X, ожидаемый эффект Y, наблюдаемое действие Z и механизм, почему эффект возможен."
      - "Запиши альтернативные объяснения и условия, при которых гипотеза может оказаться неверной."
      - "Не используй выдуманные проценты улучшения и не представляй предположение как установленный инсайт."
  - step: "03_choose_test_design"
    actions:
      - "Выбери подходящий дизайн: качественный тест понимания, интервью с нейтральными вопросами, контролируемое сравнение сообщений, рандомизированный A/B-тест или ограниченный пилот."
      - "Для A/B-теста определи контроль, вариант, единицу распределения, сопоставимость аудитории, способ рандомизации и минимизацию параллельных изменений."
      - "Если трафика, выборки или инструментов недостаточно, не имитируй A/B-тест: предложи качественный тест и честно обозначь его ограничения."
      - "Проверь, что тестируемые сообщения разрешены M08 и не создают ложных ожиданий."
  - step: "04_define_measurement"
    actions:
      - "Выбери одну primary_metric и объясни, почему она соответствует решению; определи событие, числитель, знаменатель, единицу наблюдения и период."
      - "Добавь диагностические метрики: понимание, доверие, качество интереса, действие — только те, которые можно реально измерить."
      - "Укажи guardrails: ложные ожидания, жалобы, отписки, раскрытие чувствительных данных или иные релевантные риски."
      - "Не смешивай клики, заявленный интерес, регистрацию, реальные встречи и удержание; они измеряют разные вещи."
      - "Если есть исходные данные, проверь источник, качество, период и совместимость; если нет, baseline=unknown."
  - step: "05_set_decision_rules_before_test"
    actions:
      - "До запуска зафиксируй ожидаемое направление эффекта, практический порог решения, условия успеха, провала и неопределённости."
      - "Определи длительность, необходимый объём наблюдений или способ его расчёта с указанием исходных допущений; не выдумывай мощность и статистическую значимость."
      - "Заранее укажи, когда остановить тест по рискам, технической ошибке или недостатку качества данных."
      - "Если порог невозможно обосновать, пометь его provisional и опиши, кто должен согласовать его до запуска."
  - step: "06_check_feasibility_and_ethics"
    actions:
      - "Укажи владельца теста, канал, доступные инструменты, требования к аналитике, бюджетные и временные ограничения."
      - "Проверь согласие, конфиденциальность, возрастные ограничения, доступность отказа и необходимость профильной юридической проверки."
      - "Не собирай лишние персональные данные и не вводи участников в заблуждение о существовании продукта или гарантированном результате."
      - "При отсутствии инструмента измерения сформируй конкретный запрос на данные или упрощённый дизайн."
  - step: "07_plan_interpretation"
    actions:
      - "Заранее опиши действия для трёх исходов: поддержка гипотезы, опровержение, недостаточно данных."
      - "Отдельно укажи возможные смешивающие факторы: самовыборка, различия групп, сезонность, канал, эффект формулировки, технические сбои."
      - "Не переноси результат удобной выборки на весь рынок и не делай причинных выводов из наблюдательного сравнения."
      - "Определи, какие результаты передаются M12 для анализа, а какие продуктовые вопросы — главному агенту."
  - step: "08_handoff_and_quality_gate"
    actions:
      - "Составь исполнимый протокол: вопрос, гипотеза, аудитория, варианты, процедура, метрики, критерии, риски, источники и следующий шаг."
      - "Проверь, что тест действительно может изменить решение и что отрицательный результат не будет автоматически оправдан постфактум."
      - "Если данных мало, верни partial с минимально осуществимым тестом и конкретными запросами, не выдумывая результаты."
outputs:
  required: [question, decision_to_make, hypothesis_backlog, priority_hypothesis, test_design, control_and_variant, audience_and_sampling, primary_metric, diagnostic_metrics, guardrail_metrics, observation_plan, decision_rules, confounders, evidence_refs, handoff_to_M12, product_gap_flags, decision_impact, assumptions, limitations, data_requests, status]
  hypothesis_fields: [id, audience, change, expected_direction, outcome, mechanism, evidence_status, alternative_explanations]
  metric_fields: [name, event_or_question, numerator, denominator, observation_unit, measurement_source, period]
  decision_rule_fields: [success, failure, inconclusive, stop_for_harm, practical_threshold_status]
quality_checks:
  - "Есть одно ясное решение и приоритетная проверяемая гипотеза?"
  - "Контроль или причина его отсутствия указаны?"
  - "Главная метрика операционализирована, а не просто названа?"
  - "Правила решения заданы до теста, а не после результатов?"
  - "Есть защита от ложных ожиданий и ненадлежащего сбора данных?"
  - "Выводы не выходят за пределы дизайна и выборки?"
evidence_rules:
  do_not_fabricate_primary_research: true
  label_hypotheses: true
  no_unsupported_metrics: true
  insufficient_data: partial
  no_claimed_causality_without_design: true
  no_claimed_statistical_significance_without_justification: true
example_case:
  input: "Только идея сервиса знакомств без лайков с фокусом на встречах; нет продукта, трафика и пользовательских исследований."
  acceptable_output: "Гипотеза: объяснение 'знакомства с фокусом на встречах' понятнее нейтрального описания 'сервис знакомств без лайков'. Сначала качественно сравнить понимание и ложные ожидания на доступной, явно ограниченной выборке; если возможен сопоставимый эксперимент — определить контроль и распределение. Не считать заявленный интерес доказательством спроса или гарантией свиданий."
  unacceptable_output: "A/B-тест доказал рост конверсии на 25%, поэтому рынок подтвердил спрос."
