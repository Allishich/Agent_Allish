schema_version: "0.2"
method_id: M04
name: "Барьеры восприятия и доверия"
stage: C02
selection: conditional
trigger: "Есть существенная неопределённость о причинах непонимания, недоверия, бездействия или отказа; проверка способна изменить коммуникационное решение"
purpose: "Различить наблюдаемые барьеры и конкурирующие гипотезы, установить их доказательность и выбрать проверяемые коммуникационные ответы без подмены продуктовых проблем рекламными обещаниями."
inputs:
  required: [confirmed_brief]
  optional: [available_product_outputs, M03_audience_contexts, existing_communications, customer_research, behavioral_data, support_tickets, relevant_evidence]
selection_gate:
  select_if:
    - "Неясный барьер способен изменить позиционирование, сообщения, доказательства или роль каналов"
    - "Есть противоречивые признаки доверия, понимания или выбора"
  skip_if:
    - "Причина достаточно подтверждена и дополнительная диагностика не изменит решение"
  log: [decision_question, why_selected_or_skipped, expected_decision_impact]
procedure:
  - step: "01_frame_decision"
    actions:
      - "Назови конкретную аудиторию и действие/решение, перед которым возникает возможный барьер; используй сегменты продуктового модуля и контекст M03."
      - "Определи, что изменится в коммуникационной стратегии, если барьер подтвердится или будет опровергнут."
      - "Если неизвестны география, механизм продукта или аудитория, не заполняй их догадками; запроси только критически важные сведения через главного агента."
  - step: "02_collect_evidence"
    actions:
      - "Проверь предоставленные интервью, открытые ответы, обращения поддержки, результаты тестов, аналитику воронки, реальные коммуникационные материалы и доступные исследования."
      - "Если есть исследовательская база research_data, начни с research_data/START_HERE.md и research_data/AI_CONTEXT/data_rules.md; через routing.json и manifest.json ищи только подходящий контекст. Общая статистика НЕ доказывает страх, мотив или доверие конкретной аудитории."
      - "При необходимости ищи внешние первичные исследования и материалы с датой, выборкой, методикой и релевантной географией. Если нет доступа к поиску или источнику, зафиксируй пробел и конкретную ссылку/запрос, но не утверждай, что источник изучен."
      - "Для каждого утверждения запиши источник, охват, дату, способ получения и ограничения. Отдели прямую цитату респондента от интерпретации исследователя."
  - step: "03_generate_competing_explanations"
    actions:
      - "Составь минимум две конкурирующие гипотезы для каждого значимого симптома: например, непонимание механики, отсутствие доказательств, продуктовый риск, недостаточная мотивация, неподходящий момент."
      - "Не называй все возможные барьеры одновременно подтверждёнными. Отмечай observed, inferred или hypothesis."
      - "Учитывай альтернативу: барьер может отсутствовать или быть некоммуникационным."
  - step: "04_distinguish_product_from_communication"
    actions:
      - "Для каждого барьера классифицируй: communication, product, mixed или unknown."
      - "Если продукт не обеспечивает безопасность, доступность, совместимость или реальное исполнение обещания, не предлагай исправить это рекламой. Передай product_gap_flag главному агенту."
      - "Формулируй коммуникационное решение только в пределах проверенных возможностей продукта."
  - step: "05_prioritize_and_design_test"
    actions:
      - "Оцени важность барьера качественно: потенциальное влияние на выбор, сила доказательств, исправимость коммуникацией и цена ошибочного вывода. Не придумывай численные баллы."
      - "Для каждого приоритетного барьера задай проверку: что спрашивать/наблюдать, кого привлекать, чем сравнить, что будет считаться подтверждением и опровержением."
      - "Интервью: используй нейтральные вопросы о последнем реальном опыте, а не наводящие вопросы о предполагаемом страхе. Не выдавай предложенные вопросы за проведённые интервью."
      - "Тест сообщения: сравни нейтральный контроль с вариантом, устраняющим конкретное непонимание; измеряй не только интерес, но и корректность понимания и ложные ожидания."
      - "Укажи примерный период/план сбора данных, критерий остановки или пересмотра и риски; не обещай статистическую значимость без обоснованной выборки."
  - step: "06_translate_to_strategy"
    actions:
      - "Для каждого подтверждённого или гипотетического барьера запиши допустимое сообщение, необходимое доказательство, подходящую точку контакта и что нельзя обещать."
      - "Если доказательств нет, предложи условное решение и условия его отмены."
      - "Передай M06/M07/M08 выводы, альтернативы, ограничения и продуктовые зависимости."
  - step: "07_quality_gate"
    actions:
      - "Проверь, что барьеры не выдуманы и причинность не выведена из корреляции или единичного отзыва."
      - "Убедись, что все существенные выводы связаны с источником или явно помечены как гипотезы."
      - "Верни partial или awaiting_data при нехватке данных, но предоставь полезные гипотезы и план проверки."
outputs:
  required: [question, selection_rationale, barrier_hypotheses, evidence_refs, alternative_explanations, priority_barriers, tests, communication_implications, product_gap_flags, assumptions, limitations, data_requests, decision_impact, status]
  barrier_fields: [audience, observed_symptom, hypothesis, alternative_explanation, evidence_status, source_refs, classification, impact_if_true, disconfirming_evidence]
  test_fields: [barrier_id, method, target_participants, neutral_questions_or_variants, baseline_or_comparison, metrics, observation_period, confirm_criteria, refute_criteria, unintended_effects]
  communication_fields: [barrier_id, message, required_proof, touchpoint, prohibited_claims, validation_condition]
quality_checks:
  - "Есть ли как минимум две конкурирующие версии причин, включая возможность продуктового барьера?"
  - "Не названа ли гипотеза о страхе подтверждённым инсайтом?"
  - "Для каждого предлагаемого обещания существует ли проверяемое продуктовое основание?"
  - "Можно ли реально провести предложенный тест и отличить подтверждение от опровержения?"
  - "Объяснено ли, какое коммуникационное решение меняется?"
evidence_rules:
  do_not_fabricate_primary_research: true
  do_not_infer_motives_from_demographics: true
  label_hypotheses: true
  no_unsupported_metrics: true
  insufficient_data: partial_or_awaiting_data
  do_not_hide_product_risks_with_marketing: true
example_case:
  input: "Есть только идея сервиса знакомств без лайков, где люди сразу идут на свидания"
  acceptable_output: "Гипотеза А: непонятно, как выбирается партнёр; гипотеза Б: понятен формат, но нет доверия к организации встреч; гипотеза В: пользователям не нужна такая механика. Проверить на нейтральных интервью и тесте объяснений. Нельзя утверждать, что люди боятся встреч, и обещать безопасность без продуктовых подтверждений."
  unacceptable_output: "Исследование показало, что 70% боятся встреч, поэтому обещаем гарантированно безопасные свидания."
