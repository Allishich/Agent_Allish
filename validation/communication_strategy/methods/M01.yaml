schema_version: "0.1"
method_id: M01
name: "Диагностика коммуникационной задачи"
stage: C01
selection: base
trigger: "Всегда"
purpose: "Сформулируй ситуацию, решение, желаемое изменение восприятия/поведения; отдели симптомы от причин; перечисли неизвестное."
inputs: [confirmed_brief, available_product_outputs, relevant_evidence]
procedure:
  - "Определи конкретный вопрос, на который должен ответить метод."
  - "Проверь доступные материалы и происхождение каждого утверждения."
  - "Сформулируй ситуацию, решение, желаемое изменение восприятия/поведения; отдели симптомы от причин; перечисли неизвестное."
  - "Сравни альтернативные объяснения и ограничения."
  - "Зафиксируй вывод, влияние на решение и недостающие данные."
outputs:
  required: [question, evidence_refs, findings, decision_impact, assumptions, limitations, data_requests, status]
evidence_rules:
  do_not_fabricate_primary_research: true
  label_hypotheses: true
  no_unsupported_metrics: true
  insufficient_data: partial_or_awaiting_data
