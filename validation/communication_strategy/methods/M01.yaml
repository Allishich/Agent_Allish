schema_version: "0.2"
method_id: M01
name: "Диагностика коммуникационной задачи"
stage: C01
selection: base
trigger: "Всегда"
purpose: "Определить реальную коммуникационную задачу, её связь с продуктом, желаемое изменение понимания или поведения и критические неизвестные, не выдавая симптомы и предположения за подтверждённые причины."
inputs:
  required: [confirmed_brief]
  optional: [available_product_outputs, user_goal, current_stage, geography, audience, existing_communications, relevant_evidence]
definitions:
  symptom: "Наблюдаемая проблема или жалоба без доказанного объяснения причины."
  communication_problem: "Пробел в понимании, доверии, ожиданиях или доступности информации, который потенциально исправим коммуникацией."
  product_problem: "Пробел в ценности, функциональности, безопасности или доступности продукта, который нельзя решить только сообщением."
  decision_question: "Вопрос, ответ на который изменит коммуникационное решение."
procedure:
  - step: "01_extract_confirmed_context"
    actions:
      - "Зафиксируй точные слова пользователя, продукт, стадию реализации, цель, географию, аудиторию и ограничения; не добавляй неподтверждённые детали."
      - "Отдели confirmed, inferred, hypothesis и unknown; не считай рыночную нишу, целевую аудиторию или проблему доказанными по одному описанию идеи."
      - "Проверь доступные продуктовые результаты, но не присваивай коммуникационному модулю продуктовые решения."
  - step: "02_define_decision_and_behavior"
    actions:
      - "Сформулируй, какое коммуникационное решение требуется сейчас и что должно измениться в понимании, доверии или действии аудитории."
      - "Отдели конечную бизнес-цель от ближайшего наблюдаемого коммуникационного результата."
      - "Для продукта на стадии идеи не подменяй проверку понятности концепции целями масштабирования или удержания."
  - step: "03_distinguish_symptoms_and_causes"
    actions:
      - "Запиши наблюдаемые симптомы только при наличии источника; иначе отметь предполагаемую проблему как hypothesis."
      - "Предложи конкурирующие объяснения: коммуникационное непонимание, отсутствие потребности, продуктовый барьер, доверие, контекст выбора, недостаток доступности."
      - "Для каждой версии укажи, что её подтвердит или опровергнет, и кто отвечает за продуктовые вопросы."
  - step: "04_check_evidence_and_data_routes"
    actions:
      - "Проверь происхождение доступных пользовательских, продуктовых и рыночных утверждений, период, географию, совокупность и ограничения."
      - "Если нужны числовые данные по РФ, начни с research_data/START_HERE.md и research_data/AI_CONTEXT/data_rules.md, затем routing.json, manifest.json, паспорт и исходный CSV по подходящему вопросу."
      - "Не объявляй общий размер аудитории, интернет-проникновение или демографию доказательством потребности, понимания либо эффективности коммуникации."
      - "При отсутствии подходящих данных укажи конкретный способ их получить; не выдавай каталог внешних источников за работающую интеграцию."
  - step: "05_prioritize_unknowns"
    actions:
      - "Раздели неизвестные на blocking_for_decision и can_validate_later; задай только вопросы, способные изменить ближайшее решение."
      - "Если без одного критического параметра нельзя выбрать географически релевантные источники, запроси его у главного агента; не предполагай страну."
      - "Для каждого запроса данных укажи причину, предполагаемый источник и возможное влияние на решение."
  - step: "06_formulate_problem_statement"
    actions:
      - "Сформулируй краткий диагноз: кому, в какой ситуации, что нужно понять или сделать, что мешает, какие объяснения подтверждены и какие только гипотезы."
      - "Предложи безопасную предварительную формулировку задачи и 1–2 альтернативных объяснения, которые необходимо различить."
      - "Не выдавай позиционирование, медиаплан или готовую продуктовую стратегию за результат диагностики."
  - step: "07_define_next_validation"
    actions:
      - "Предложи минимальную проверку ключевой неопределённости: интервью, тест понимания, анализ реальных обращений или изучение доступных источников."
      - "Укажи аудиторию, наблюдаемый результат, критерий пересмотра и ограничения без выдуманных процентов или объёма выборки."
      - "Передай M03 вопросы об аудитории, M04 гипотезы барьеров, а главному агенту продуктовые зависимости."
  - step: "08_quality_gate"
    actions:
      - "Проверь, что сформулирована коммуникационная, а не только бизнес- или продуктовая задача."
      - "Каждая причинная версия имеет статус доказательности; факты и гипотезы не смешаны."
      - "Если данных недостаточно, верни partial с полезным предварительным диагнозом и приоритетными запросами, а не фиктивной уверенностью."
outputs:
  required: [question, confirmed_context, decision_question, desired_communication_change, symptoms, competing_explanations, problem_statement, evidence_refs, prioritized_unknowns, validation_plan, product_gap_flags, decision_impact, assumptions, limitations, data_requests, status]
  explanation_fields: [hypothesis, type, evidence_status, evidence_ref, disconfirming_evidence_needed, owner_or_dependency]
  data_request_fields: [missing_fact, why_it_changes_decision, source_or_collection_method, priority]
quality_checks:
  - "Цель пользователя и стадия продукта переданы без искажений?"
  - "Симптомы отделены от причин, а коммуникационные проблемы от продуктовых?"
  - "География не придумана, а источники проверяемы?"
  - "Диагноз позволяет выбрать следующий исследовательский шаг?"
  - "Нет выдуманных результатов исследования и метрик?"
evidence_rules:
  do_not_fabricate_primary_research: true
  label_hypotheses: true
  no_unsupported_metrics: true
  insufficient_data: partial
  never_assume_geography: true
  do_not_treat_market_size_as_demand: true
example_case:
  input: "Хочу запустить сервис знакомств без лайков, где люди сразу идут на свидания. Пока только идея."
  acceptable_output: "Подтверждено: идея сервиса без лайков с фокусом на встречах; продукт ещё не создан. Предварительная коммуникационная задача — проверить, понимают ли потенциальные пользователи обещаемую механику и вызывает ли она доверие. Неизвестны география, аудитория, механика и реальные барьеры; гипотезы — непонимание, недоверие, отсутствие интереса. Не утверждать, что люди устали от свайпов, пока это не проверено."
  unacceptable_output: "Исследования доказали, что аудитория устала от лайков; нужно запускать рекламу в Telegram на женщин 25–35 лет."
