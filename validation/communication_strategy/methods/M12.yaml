schema_version: "0.2"
method_id: M12
name: "Анализ результатов коммуникаций"
stage: C06
selection: conditional
trigger: "Есть реальные результаты кампаний, коммуникационных тестов или когорт, анализ которых способен изменить решение"
purpose: "Проверить качество и интерпретацию реальных коммуникационных результатов, сопоставить их с заранее заданными гипотезами и правилами M11 и принять ограниченное доказательствами решение."
inputs:
  required: [confirmed_brief]
  optional: [M11_test_design, M11_decision_rules, campaign_results, experiment_results, cohort_data, event_dictionary, analytics_exports, qualitative_feedback, relevant_evidence]
selection_gate:
  select_if:
    - "Доступны фактические наблюдения, относящиеся к конкретному коммуникационному решению"
  skip_if:
    - "Есть только план эксперимента, прогнозы, гипотезы или выдуманные демонстрационные данные"
  record: [selection_reason, actual_data_refs, decision_to_make]
definitions:
  observed_result: "Фактически измеренное значение с источником, периодом, единицей и знаменателем."
  interpretation: "Объяснение наблюдаемого результата, которое может иметь альтернативы."
  causal_claim: "Утверждение о причине изменения; требует подходящего дизайна и проверки допущений."
  inconclusive: "Данные не позволяют выбрать между альтернативами с необходимой для решения уверенностью."
procedure:
  - step: "01_verify_eligibility_and_decision"
    actions:
      - "Проверь, существуют ли реальные результаты и можно ли открыть первичные данные или отчёт; при их отсутствии отметь not_applicable и не симулируй анализ."
      - "Определи, какое решение должно измениться по результатам: оставить, улучшить, остановить или повторить проверку."
      - "Свяжи данные с гипотезой, контрольным вариантом, метриками и правилами решения M11, если они были зафиксированы до теста."
      - "Если протокола M11 нет, отметь анализ как exploratory и не представляй выбранные после теста критерии как предварительные."
  - step: "02_audit_data_provenance"
    actions:
      - "Зафиксируй источник каждого набора данных, дату выгрузки, период наблюдения, географию, аудиторию, каналы, правила отбора и доступность первичных строк."
      - "Проверь полноту событий, дубликаты, пропуски, ботов, изменения отслеживания, ошибки атрибуции и несоответствие временных зон, если это применимо."
      - "Отдели наблюдаемые факты от отчётов без доступа к методике; при отсутствии подтверждения пометь unverified."
      - "Если нужны внешние данные для контекста, следуй research_data/START_HERE.md, data_rules.md, routing.json, manifest.json и паспортам; внешняя статистика не заменяет результаты кампании."
  - step: "03_validate_metrics_and_denominators"
    actions:
      - "Для каждой метрики укажи определение события, числитель, знаменатель, единицу наблюдения, период и источник."
      - "Проверь согласованность пользовательских, сессионных и событийных показателей; не дели несовместимые совокупности."
      - "Не приравнивай показ, клик, заявленный интерес, регистрацию, встречу и удержание."
      - "Если расчёт возможен, покажи формулу и исходные числа; если нет — укажи недостающие поля вместо выдуманного значения."
  - step: "04_assess_comparability_and_design"
    actions:
      - "Проверь сопоставимость групп по аудитории, времени, каналу, формату, географии, условиям показа и другим значимым факторам."
      - "Для рандомизированного теста проверь назначение вариантов, потери наблюдений, перекрёстное воздействие и существенные отклонения от протокола."
      - "Для наблюдательных данных перечисли смешивающие факторы и не делай причинный вывод без подходящей идентификации эффекта."
      - "Отдельно отметь сезонность, изменения продукта, параллельные кампании и эффект самовыборки."
  - step: "05_analyze_effect_and_uncertainty"
    actions:
      - "Сравни основную метрику с контролем или релевантной базой; различай абсолютное и относительное изменение."
      - "При наличии достаточных данных и корректного дизайна оцени неопределённость подходящим методом, указав допущения и способ расчёта."
      - "Не объявляй статистическую значимость без исходных данных, расчёта и соответствующего дизайна; не трактуй отсутствие значимости как доказательство равенства."
      - "Проверь диагностические и защитные метрики: понимание, ложные ожидания, жалобы, отписки и прочие риски."
      - "Не распространяй результаты небольшой или нерепрезентативной выборки на весь рынок."
  - step: "06_compare_with_precommitted_rules"
    actions:
      - "Сопоставь результат с правилами success, failure, inconclusive и stop_for_harm, записанными до теста в M11."
      - "Если критерии были установлены постфактум, явно пометь их exploratory и не выдавай за подтверждение гипотезы."
      - "При конфликте основной метрики и защитных показателей отдельно оцени риск и не рекомендуй масштабирование автоматически."
      - "Раздели наблюдение, интерпретацию и возможные альтернативные объяснения."
  - step: "07_recommend_action_and_next_test"
    actions:
      - "Выдай конкретное решение: keep, iterate, stop или retest; укажи силу доказательств, владельца решения и условия пересмотра."
      - "Объясни, какой именно элемент коммуникации менять: сообщение, канал, аудиторию, последовательность или измерение."
      - "Если данные неубедительны, предложи минимальную дополнительную проверку, которая может изменить решение."
      - "Передай продуктовые пробелы главному агенту, но не подменяй продуктовую стратегию коммуникационной рекомендацией."
  - step: "08_quality_gate_and_handoff"
    actions:
      - "Предоставь таблицу результатов, источники, формулы, ограничения, альтернативные объяснения и итоговое решение."
      - "Проверь, что нет вымышленных значений, причинных выводов без дизайна или постфактум объявленных победителей."
      - "Если данные частично доступны, верни partial с конкретными запросами; если результатов нет вообще, верни not_applicable и причину."
outputs:
  required: [question, selection_rationale, data_inventory, data_quality_assessment, metric_definitions, observed_results, group_comparability, uncertainty_assessment, guardrail_results, alternative_explanations, decision_rule_comparison, recommendation, evidence_refs, decision_impact, assumptions, limitations, data_requests, status]
  metric_fields: [metric, numerator, denominator, period, population, source_ref, calculation, limitations]
  result_fields: [variant_or_cohort, observed_value, comparison_value, absolute_difference, relative_difference, uncertainty, evidence_status]
  recommendation_fields: [action, rationale, evidence_strength, owner_or_dependency, revisit_condition, next_validation]
quality_checks:
  - "Реальные данные существуют и их происхождение проверено?"
  - "Метрики определены и знаменатели совместимы?"
  - "Сопоставимость групп и ограничения дизайна явно указаны?"
  - "Статистические и причинные утверждения обоснованы?"
  - "Результат сопоставлен с правилами M11, а постфактум анализ помечен?"
  - "Решение конкретно и не сильнее доказательств?"
evidence_rules:
  do_not_fabricate_primary_research: true
  label_hypotheses: true
  no_unsupported_metrics: true
  no_causality_without_design: true
  no_statistical_significance_without_calculation: true
  insufficient_data: partial_or_not_applicable
example_case:
  input: "Только идея сервиса знакомств без лайков; тест из M11 ещё не проводился."
  acceptable_output: "M12 не выбран: фактических результатов нет. Сохранить протокол M11 и вернуться к анализу после сбора данных. Не выводить конверсию, эффективность сообщений или спрос."
  unacceptable_output: "Тест показал рост интереса на 25%, поэтому позиционирование подтверждено."
