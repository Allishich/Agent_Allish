schema_version: "0.2"
method_id: M05
name: "Анализ коммуникаций конкурентов"
stage: C03
selection: conditional
trigger: "Сравнение публичных обещаний конкурентов может изменить выбор позиционирования"
purpose: "Сопоставить подтверждённые рыночные сообщения, обещания и доказательства альтернативных решений, чтобы проверить отличимость коммуникационного позиционирования без выдуманных конкурентных преимуществ."
inputs:
  required: [confirmed_brief]
  optional: [available_product_outputs, M03_audience_contexts, M04_barrier_hypotheses, M06_positioning_options, geography, relevant_evidence, competitor_list]
selection_gate:
  select_if:
    - "Конкурентные обещания могут изменить выбор позиции или допустимых аргументов"
    - "Можно определить релевантный рынок и найти проверяемые первичные коммуникационные материалы"
  defer_if:
    - "Неизвестна география или категория сравнения и без этого выбор конкурентов будет произвольным"
  skip_if:
    - "Сравнение не влияет на текущее решение и нет основания тратить ресурсы"
  record: [decision_question, selection_reason, scope_and_limitations]
definitions:
  competitor: "Продукт или решение, между которыми аудитория реально может выбирать в данном контексте."
  alternative: "Иной способ решить задачу аудитории, включая отказ от решения или самостоятельный путь."
  communication_claim: "Публичное обещание, формулировка ценности, доказательство или призыв к действию."
  evidence_status: "verified_primary, verified_secondary, inferred, hypothesis или unknown."
procedure:
  - step: "01_frame_positioning_decision"
    actions:
      - "Укажи, какое позиционирование или обещание требуется проверить и что изменится по результатам."
      - "Уточни аудиторию, контекст выбора, категорию, географию и период; неизвестное пометь unknown, страну не предполагай."
      - "Возьми барьеры M04 и альтернативы позиции M06; не подменяй анализ коммуникаций общей продуктовой конкурентной разведкой."
  - step: "02_define_comparison_set"
    actions:
      - "Сформируй небольшой обоснованный набор прямых конкурентов, косвенных альтернатив и при необходимости status_quo."
      - "Для каждого укажи, почему он релевантен именно выбору аудитории, а не просто известен на рынке."
      - "Если география или сегмент неизвестны, не объявляй случайные бренды главными конкурентами; запроси уточнение или используй явно условный набор."
  - step: "03_collect_primary_communications"
    actions:
      - "Ищи актуальные официальные лендинги, страницы продукта, тарифы, FAQ, onboarding, рекламные библиотеки и подтверждённые публичные публикации."
      - "Для каждого утверждения фиксируй точную ссылку, дату доступа или публикации, рынок, канал, дословную короткую формулировку или точный пересказ."
      - "Разделяй собственные заявления конкурента и независимые подтверждения; рекламное обещание не доказывает фактический результат."
      - "Если первоисточник недоступен, пометь пробел и не заменяй его придуманной цитатой."
      - "Для количественного контекста РФ при необходимости используй research_data/START_HERE.md, data_rules.md, routing.json, manifest.json, паспорт и CSV; рыночные размеры не подтверждают уникальность сообщения."
  - step: "04_code_messages_consistently"
    actions:
      - "Для каждого варианта сравни целевую аудиторию, ситуацию использования, главное обещание, механизм, доказательства, эмоциональный акцент, призыв к действию и ограничения."
      - "Отмечай явные и подразумеваемые утверждения отдельно, не приписывай конкуренту то, чего он не заявляет."
      - "Проверь, относятся ли сообщения к сопоставимым рынкам, датам и версиям продукта."
      - "Фиксируй отсутствующие данные как unknown, а не как отсутствие обещания."
  - step: "05_identify_parity_and_distinctiveness"
    actions:
      - "Найди повторяющиеся обещания, потенциальные отличия, свободные гипотезы формулировок и точки прямого сходства."
      - "Раздели уникальность формулировки, отличимость механики продукта и подтверждённое конкурентное преимущество."
      - "Не заявляй 'никто не предлагает', 'первые на рынке' или 'единственные' без исчерпывающей проверяемой базы."
      - "Проверь, можно ли обосновать предполагаемое отличие реальной или запланированной продуктовой механикой; продуктовые пробелы передай главному агенту."
  - step: "06_compare_positioning_options"
    actions:
      - "Сопоставь альтернативы M06 по релевантности аудитории, повторяемости конкурентных обещаний, подтверждаемости, риску ложных ожиданий и возможности проверки."
      - "Покажи как минимум одно возможное сходство, способное ослабить выбранную позицию, если источники позволяют."
      - "Не делай вывод об эффективности сообщений конкурента по факту их публикации; отсутствие доступа к результатам означает unknown."
  - step: "07_recommend_validation"
    actions:
      - "Предложи осторожное решение: сохранить, уточнить или пересмотреть формулировку позиции с условиями."
      - "Для неподтверждённой отличимости предложи тест понимания, ассоциаций или различимости сообщений на релевантной аудитории."
      - "Передай M07/M08 разрешённые формулировки и вопросы доказательств, M11 — гипотезы теста, главному агенту — продуктовые зависимости."
  - step: "08_quality_gate"
    actions:
      - "У каждого существенного конкурентного утверждения есть первоисточник, дата, география и статус доказательности?"
      - "Сравниваются коммуникации, а не только размер рынка или список функций?"
      - "Выводы об отличимости не сильнее полноты изученной выборки?"
      - "При нехватке данных верни partial или deferred с точным планом поиска, а не вымышленную карту конкурентов."
outputs:
  required: [question, selection_rationale, comparison_scope, competitor_set, source_register, message_comparison, parity_and_difference, positioning_implications, product_gap_flags, validation_plan, evidence_refs, decision_impact, assumptions, limitations, data_requests, status]
  competitor_fields: [name, type, relevance_to_audience, geography, source_refs, evidence_status]
  message_fields: [competitor, audience, core_promise, mechanism, proof, call_to_action, channel, source_ref, publication_or_access_date, limitations]
  data_request_fields: [missing_fact, why_it_changes_positioning, exact_source_or_collection_method, priority]
quality_checks:
  - "Набор конкурентов обоснован рынком и задачей?"
  - "Обещания и доказательства извлечены из проверяемых материалов?"
  - "Не спутаны рекламные заявления и реальные продуктовые результаты?"
  - "Не сделаны абсолютные заявления об уникальности без достаточных данных?"
  - "Есть конкретное влияние на позиционирование и план проверки?"
evidence_rules:
  do_not_fabricate_primary_research: true
  label_hypotheses: true
  no_unsupported_metrics: true
  insufficient_data: partial_or_deferred
  no_unverified_competitor_claims: true
  never_assume_geography: true
  never_infer_effectiveness_from_publication: true
example_case:
  input: "Идея сервиса знакомств без лайков с фокусом на встречах; география и аудитория не определены."
  acceptable_output: "Проверить, обещают ли релевантные альтернативы быстрый переход к встречам, но сначала уточнить рынок и собрать актуальные первоисточники. Не утверждать, что конкуренты строятся исключительно на свайпах или что концепция уникальна."
  unacceptable_output: "Все конкуренты заставляют бесконечно свайпать; только наш сервис предлагает настоящие свидания."
