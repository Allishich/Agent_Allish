schema_version: "0.2"
method_id: M07
name: "Архитектура сообщений и доказательств"
stage: C04
selection: base
trigger: "Всегда"
purpose: "Перевести выбранное позиционирование в иерархию сообщений, аргументов и проверяемых доказательств для конкретных аудиторий и ситуаций контакта, не выдавая гипотезы за факты."
inputs:
  required: [confirmed_brief]
  optional: [available_product_outputs, M03_audience_contexts, M04_barrier_hypotheses, M06_recommendation, relevant_evidence, channel_context]
definitions:
  positioning: "Желаемое место продукта в восприятии аудитории и причина предпочесть его альтернативе."
  core_message: "Главная понятная аудитории мысль, выражающая позиционирование."
  supporting_argument: "Причина поверить или счесть предложение ценным."
  proof: "Проверяемый факт, функция, демонстрация, исследование или источник, подтверждающий конкретное утверждение."
  copy_variant: "Конкретная формулировка для канала или формата; не замена стратегии."
procedure:
  - step: "01_collect_strategy_inputs"
    actions:
      - "Прочитай подтверждённый бриф, выбранную/предварительную позицию M06, аудитории M03 и барьеры M04."
      - "Для каждого входа отметь supported, inferred, hypothesis или unknown; если результаты предыдущих методов отсутствуют, не выдавай их за проведённые."
      - "Определи, какое понимание, доверие или действие должна изменить коммуникация."
  - step: "02_define_message_hierarchy"
    actions:
      - "Сформулируй одно главное сообщение, прямо связанное с позицией M06, без неподтверждённого обещания результата."
      - "Создай 2–4 поддерживающих аргумента; каждый должен отвечать на отдельный вопрос аудитории или барьер."
      - "Для каждого аргумента укажи нужное доказательство, его фактический статус и что ещё надо получить."
      - "Раздели фактическое описание продукта, ценностную интерпретацию и проверяемую гипотезу."
  - step: "03_adapt_to_audience_and_context"
    actions:
      - "Используй аудитории и контексты M03; не изобретай новые подтверждённые сегменты."
      - "Для каждой релевантной аудитории укажи ситуацию контакта, главный вопрос, вариант сообщения, необходимое доказательство и следующий шаг."
      - "Изменяй акцент и язык, сохраняя одну стратегическую позицию; не создавай противоречивых обещаний для разных сегментов."
      - "Если конкретные каналы ещё не определены, укажи формат как гипотезу, не объявляй его эффективным."
  - step: "04_build_evidence_register"
    actions:
      - "Для каждого существенного утверждения запиши claim, source, source_status, scope, proof_type, limitations и допустимую формулировку."
      - "Сначала используй реальные продуктовые факты и исследования пользователя; для внешних фактов применяй релевантные источники с датой и методикой."
      - "При необходимости проверь research_data/START_HERE.md и data_rules.md, затем routing.json, manifest.json, паспорт и исходный CSV. Общая статистика не подтверждает конкретное обещание продукта."
      - "Если источник отсутствует, пометь proof_missing и сформулируй запрос на подтверждение; не выдумывай цитаты, результаты опросов, отзывы и численные показатели."
      - "Для числовых утверждений сохраняй период, географию, совокупность, знаменатель, первоисточник, файл и формулу расчёта."
  - step: "05_check_clarity_and_risk"
    actions:
      - "Проверь, что аудитория может понять главное сообщение без знания внутренней терминологии продукта."
      - "Проверь двусмысленности, чрезмерные обещания, ложные ожидания, стигматизацию и возможные последствия ошибочного понимания."
      - "Раздели формулировки на safe_now, conditional_test_only и prohibited_until_proven."
      - "Не используй фразы вроде 'гарантированно', 'самый безопасный', 'быстрее всех' без подтверждений."
  - step: "06_create_copy_examples"
    actions:
      - "Предложи короткую и развёрнутую версии главного сообщения, объяснение механики и ответы на 2–3 ключевых вопроса аудитории."
      - "Пометь все рекламные варианты как примеры, не как подтверждённо эффективные сообщения."
      - "Не подменяй архитектуру сообщений набором слоганов."
  - step: "07_design_message_validation"
    actions:
      - "Предложи проверку понимания, доверия и точности ожиданий: нейтральное объяснение против альтернативной формулировки при одинаковом контексте."
      - "Укажи целевую аудиторию, метод, наблюдаемые показатели, критерий пересмотра, период и риски; не выдумывай выборку или результат."
      - "Отдели проверку привлекательности формулировки от проверки достоверности продуктового обещания."
  - step: "08_handoff_and_quality_gate"
    actions:
      - "Передай M08 полный реестр существенных обещаний, их доказательства и ограничения для независимой проверки соответствия продукту."
      - "Передай M09/M10 сообщения по ситуациям контакта, а M11 — гипотезы и план проверки."
      - "Если доказательств мало, верни partial, но предоставь безопасный предварительный message_house и список недостающих подтверждений."
      - "Проверь связь каждого аргумента с барьером, каждого доказательства с утверждением и каждого варианта сообщения с единой позицией."
outputs:
  required: [question, positioning_ref, message_house, audience_message_matrix, evidence_register, copy_examples, claims_for_M08, validation_plan, decision_impact, assumptions, limitations, data_requests, status]
  message_house_fields: [core_message, supporting_arguments, audience_questions, required_proofs, evidence_status, allowed_wording]
  audience_message_fields: [audience, context, barrier_or_question, message, proof, call_to_action, evidence_status]
  evidence_fields: [claim, source_ref_or_missing, source_status, proof_type, scope, limitations, allowed_wording]
  claim_review_fields: [claim, product_dependency, evidence_ref, provisional_status, forbidden_wording]
quality_checks:
  - "Главное сообщение соответствует выбранному позиционированию M06?"
  - "Каждый аргумент отвечает на конкретный вопрос аудитории и имеет доказательство либо явный пробел?"
  - "Ни одна гипотеза не названа доказанным инсайтом?"
  - "Сообщения для разных аудиторий не противоречат друг другу?"
  - "Публичные формулировки не обещают того, что продукт не подтверждает?"
  - "В M08 передан полный список обещаний для проверки?"
evidence_rules:
  do_not_fabricate_primary_research: true
  label_hypotheses: true
  no_unsupported_metrics: true
  insufficient_data: partial
  product_claim_validation_is_M08_responsibility: true
example_case:
  input: "Идея сервиса знакомств без лайков, где люди сразу идут на свидания; позиция M06 — акцент на встречах, продукт пока не реализован."
  acceptable_output: "Главное сообщение для теста: 'Знакомства с фокусом на встречах, а не лайках'. Аргумент: формат задуман для перехода к реальному общению; подтверждение механики отсутствует. Объяснить, как предполагается подбор и организация встреч, после определения продукта. Не обещать гарантированное свидание или безопасность. Передать эти обещания в M08."
  unacceptable_output: "Мы доказали, что сервис обеспечивает безопасные свидания быстрее конкурентов, и это понравилось пользователям."
