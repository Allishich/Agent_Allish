schema_version: "0.2"
method_id: M06
name: "Разработка и сравнение коммуникационных позиций"
stage: C03
selection: base
trigger: "Всегда"
purpose: "Выбрать обоснованную коммуникационную позицию из содержательно разных альтернатив, включая status_quo, с опорой на аудиторию, барьеры и реальные возможности продукта."
inputs:
  required: [confirmed_brief]
  optional: [available_product_outputs, M03_audience_contexts, M04_barrier_hypotheses, M05_competitor_communications, relevant_evidence, business_constraints]
preconditions:
  - "Не придумывай завершённые исследования, если M03/M04/M05 отсутствуют: используй явно маркированные гипотезы."
  - "Не изменяй продуктовую стратегию; при обнаружении продуктовой зависимости передай её главному агенту."
procedure:
  - step: "01_frame_positioning_decision"
    actions:
      - "Определи конкретную аудиторию, ситуацию выбора, конкурентную альтернативу (включая бездействие), желаемое изменение восприятия и цель коммуникации."
      - "Возьми подтверждённые выводы M03 и M04; раздели evidence, inference, hypothesis, unknown."
      - "Сформулируй вопрос выбора: какое восприятие продукта стоит формировать и почему именно оно должно влиять на решение аудитории?"
  - step: "02_build_positioning_alternatives"
    actions:
      - "Создай минимум три содержательно отличающиеся стратегические позиции, включая status_quo: оставить нынешнюю коммуникацию, а для нового продукта — нейтральное описание идеи без нового обещания."
      - "Для каждой позиции заполни: целевая аудитория, контекст выбора, главный барьер, рамка ценности, обещание, необходимые доказательства, предполагаемое действие, ограничения."
      - "Не считай косметические варианты слогана разными позициями."
      - "Если данных мало, предложи предварительные альтернативы и объясни, какие гипотезы они проверяют."
  - step: "03_check_product_truth"
    actions:
      - "Для каждого обещания укажи подтверждающую функцию, продуктовый факт или проверяемую зависимость."
      - "Отметь supported, conditional или unsupported. Исключи unsupported из публичных рекомендаций; conditional оставь только как тестовую формулировку с условиями."
      - "Не обещай гарантированный результат, безопасность, экономию времени или превосходство над конкурентами без соответствующих подтверждений."
      - "Если ценностное обещание требует изменения продукта, сформируй product_gap_flag для главного агента."
  - step: "04_check_distinctiveness"
    actions:
      - "Используй M05, если есть проверенный анализ конкурентных сообщений; иначе не утверждай уникальность или отличие от всех конкурентов."
      - "Сравни с альтернативой бездействия и с тем, как аудитория решает задачу сейчас, но не выдумывай фактические привычки пользователей."
      - "Укажи, что ещё надо проверить во внешних источниках или на интервью для оценки отличимости."
  - step: "05_compare_consistently"
    actions:
      - "Сравни каждую позицию по одной системе критериев: релевантность аудитории, способность снять барьер, достоверность обещания, отличимость, реализуемость, риски и ожидаемое влияние на поведение."
      - "Для каждого критерия дай краткое обоснование и evidence_status; используй качественные оценки, не изобретай количественные баллы."
      - "Для каждого варианта сформулируй сильнейший аргумент за и сильнейший контраргумент."
      - "Сравни все варианты с status_quo, явно указав ожидаемый выигрыш, стоимость и возможный вред."
      - "Не называй победителем вариант только потому, что формулировка звучит ярче."
  - step: "06_recommend_with_conditions"
    actions:
      - "Выбери рабочую позицию, если данных достаточно; иначе provisional_recommendation с указанием неопределённости."
      - "Объясни, почему она предпочтительнее каждого другого варианта, и назови условия, при которых выбор надо пересмотреть."
      - "Укажи один или несколько решающих вопросов для проверки, не составляй бесконечный список исследований."
      - "При отсутствии доказательств всё равно дай полезный предварительный выбор и безопасную формулировку, чтобы итоговая стратегия не исчезла."
  - step: "07_design_discriminating_test"
    actions:
      - "Предложи тест, различающий позиции, а не только нравятся ли слоганы: нейтральный контроль/status_quo и 1–2 альтернативы при сопоставимых условиях."
      - "Укажи целевую аудиторию, канал/формат, метрики понимания, доверия и намерения действовать, период наблюдения и правила интерпретации."
      - "Измеряй ложные ожидания и возможный вред; не заявляй статистическую значимость без обоснованного дизайна и выборки."
      - "Запиши критерий пересмотра позиции при отрицательных результатах."
  - step: "08_handoff_and_quality"
    actions:
      - "Передай в M07 выбранную позицию, рамку ценности, аудиторию, барьер, обещание, допустимые доказательства, запреты и альтернативы."
      - "Передай в M08 условные обещания и продуктовые зависимости; в M11 — проверяемые гипотезы и сравнение."
      - "Убедись, что каждое сильное утверждение имеет источник или явно обозначено гипотезой."
      - "Верни partial при нехватке данных, но сохрани сравнительную таблицу и условную рекомендацию."
outputs:
  required: [question, audience_and_barrier, evidence_refs, alternatives, comparison, recommendation, recommendation_status, counterarguments, decision_impact, validation_plan, product_gap_flags, assumptions, limitations, data_requests, status]
  alternative_fields: [id, strategic_frame, audience, choice_context, barrier, value_promise, required_proof, product_truth_status, differentiation_status, expected_behavior, risks, dependencies]
  comparison_criteria: [audience_relevance, barrier_fit, product_truth, distinctiveness, feasibility, risks, expected_behavior_change]
  recommendation_fields: [chosen_id, rationale_against_each_alternative, evidence_status, conditions_to_revisit, safe_test_message]
quality_checks:
  - "Есть минимум три содержательно разных позиции, включая status_quo?"
  - "Сравнение опирается на результаты M03/M04, а не только на вкус автора?"
  - "Все обещания имеют подтверждение либо явно условны?"
  - "Есть контраргумент к каждой альтернативе и сравнение с status_quo?"
  - "План теста может опровергнуть выбор, а не только подтвердить его?"
evidence_rules:
  do_not_fabricate_primary_research: true
  do_not_claim_competitive_uniqueness_without_sources: true
  label_hypotheses: true
  no_unsupported_metrics: true
  insufficient_data: partial
example_case:
  input: "Только идея сервиса знакомств без лайков с переходом к свиданиям; нет подтверждённого рынка, механики и исследований."
  acceptable_output: "A/status_quo: нейтральное описание сервиса без лайков; B: меньше цифрового выбора; C: ориентация на реальные встречи. Предварительно C как наиболее близкую заявленной идее, но обещание встреч условно до проверки механики. Сравнить понимание, интерес и ложные ожидания на тесте сообщений."
  unacceptable_output: "Позиция C гарантированно лучшая, потому что люди устали от свайпов, а конкуренты не предлагают свиданий."
