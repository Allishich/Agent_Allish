schema_version: "0.2"
method_id: M08
name: "Проверка обещаний продуктом"
stage: C04
selection: base
trigger: "Всегда"
purpose: "Проверить каждое существенное сообщение M07 на фактическую продуктовую обеспеченность, отделить безопасные формулировки от условных и недопустимых, передать продуктовые разрывы главному агенту."
inputs:
  required: [confirmed_brief]
  optional: [available_product_outputs, M07_claims_for_M08, M07_evidence_register, product_specifications, actual_product_behavior, legal_and_safety_constraints, relevant_evidence]
definitions:
  claim: "Явное или подразумеваемое обещание о возможностях, результате, качестве или безопасности продукта."
  evidence: "Проверяемое подтверждение именно этого обещания; статистика рынка сама по себе не доказывает свойства продукта."
  statuses:
    supported: "Подтверждено действующим продуктом и доступными проверяемыми материалами в указанном объёме."
    conditional: "Возможно только при выполнении конкретных ещё не подтверждённых условий."
    unsupported: "Нет достаточных подтверждений; нельзя использовать как установленный факт."
    contradicted: "Противоречит доступным фактам; нельзя использовать."
procedure:
  - step: "01_inventory_claims"
    actions:
      - "Возьми claims_for_M08 и evidence_register из M07, добавь существенные подразумеваемые обещания из заголовков, CTA, объяснений механики и визуальных формулировок."
      - "Для каждого обещания выпиши точную формулировку, аудиторию, контекст, предполагаемый результат и проверяемую продуктовую зависимость."
      - "Если M07 не передал реестр, не придумывай его выполнение: извлеки обещания из доступных сообщений и пометь источник."
  - step: "02_identify_product_truth"
    actions:
      - "Проверь подтверждённый бриф, продуктовые спецификации, демонстрации, работающие функции, условия обслуживания, результаты испытаний и известные ограничения."
      - "Различай идею, запланированную функцию, прототип, реализованную функцию и подтверждённый пользовательский результат."
      - "Не приравнивай заявление основателя, макет или обещание будущей функции к проверенному действию сервиса."
      - "Если нет доступа к данным или документу, пометь источник inaccessible и запиши конкретный запрос; не утверждай, что проверка проведена."
  - step: "03_map_claim_to_proof"
    actions:
      - "Для каждого claim укажи product_feature_or_fact, proof_ref, proof_type, maturity_stage, limitations и статус supported/conditional/unsupported/contradicted."
      - "Проверь совпадение масштаба доказательства и обещания: география, аудитория, период, частота, исключения."
      - "Числовые и сравнительные утверждения требуют проверяемой методики, исходных чисел, знаменателя, периода и сопоставимой базы сравнения."
      - "При необходимости используй research_data только как источник рыночного контекста по правилам research_data/AI_CONTEXT/data_rules.md; статистика населения не подтверждает эффективность, безопасность или качество конкретного продукта."
  - step: "04_review_high_risk_claims"
    actions:
      - "Отдельно проверь гарантии результата, безопасность, конфиденциальность, проверку личности, модерацию, экономию времени, финансовую выгоду и превосходство над конкурентами."
      - "Не разрешай абсолютные обещания при наличии неизвестных условий, внешних зависимостей или возможного вреда."
      - "Если коммуникация может скрыть значимый продуктовый риск, пометь prohibited_until_proven и создай product_gap_flag."
      - "Если требуются юридическая, регуляторная или профильная проверка, укажи её как необходимое условие, не заявляя о соответствии требованиям."
  - step: "05_decide_allowed_wording"
    actions:
      - "Для каждого claim выдай один из результатов: safe_now, conditional_test_only, prohibited_until_proven."
      - "Предложи точную безопасную переформулировку, которая сохраняет смысл, но не превращает план в реализованную функцию."
      - "Укажи, какое конкретное доказательство позволит повысить статус формулировки."
      - "Если подтверждений нет, можно описывать концепцию как концепцию, но не как существующую гарантию или доказанный результат."
  - step: "06_route_product_gaps"
    actions:
      - "Раздели проблемы на communication_gap (неясная формулировка), evidence_gap (нет подтверждения) и product_gap (нет нужной функции/условия)."
      - "Передай product_gap главному агенту с описанием зависимости, риска, владельца решения и необходимого подтверждения; не меняй самостоятельно продуктовую стратегию."
      - "При критическом риске предложи остановить публикацию конкретного обещания, а не всю работу над стратегией."
  - step: "07_recheck_message_architecture"
    actions:
      - "Верни M07 список исправленных формулировок и запрещённых утверждений."
      - "Проверь, что после удаления недоказанных обещаний главное сообщение остаётся понятным и соответствует позиции M06."
      - "Если ключевая позиция опирается на неподтверждённую возможность продукта, предложи безопасную временную версию и условие пересмотра M06."
  - step: "08_quality_gate"
    actions:
      - "Убедись, что проверены и явные, и подразумеваемые обещания."
      - "Для каждого решения укажи доказательство или явный пробел, ограничение и допустимую формулировку."
      - "Верни partial при недостатке данных, сохранив полезный реестр и конкретные запросы; не называй непроверенные обещания одобренными."
outputs:
  required: [question, claim_register, allowed_wording, prohibited_claims, evidence_refs, product_gap_flags, decision_impact, assumptions, limitations, data_requests, status]
  claim_fields: [claim_id, exact_wording, implied_promise, audience, product_dependency, maturity_stage, evidence_ref, evidence_scope, evidence_status, claim_status, disposition, risk, required_next_proof]
  disposition_values: [safe_now, conditional_test_only, prohibited_until_proven]
  gap_fields: [gap_type, affected_claim_ids, missing_fact_or_capability, risk, responsible_party, validation_needed]
quality_checks:
  - "Каждое существенное обещание из M07 рассмотрено, включая подразумеваемые?"
  - "Запланированная функция не выдана за действующую?"
  - "Безопасность и гарантии не заявлены без проверяемых оснований?"
  - "Каждое запрещённое обещание имеет объяснение и безопасную альтернативу?"
  - "Продуктовые разрывы переданы главному агенту, а не скрыты в копирайтинге?"
evidence_rules:
  do_not_fabricate_product_capabilities: true
  do_not_fabricate_primary_research: true
  label_hypotheses: true
  no_unsupported_metrics: true
  insufficient_data: partial
  never_claim_compliance_without_review: true
example_case:
  input: "Есть только идея сервиса знакомств без лайков, где люди сразу идут на свидания."
  acceptable_output: "Фраза 'Сервис без лайков, ориентированный на реальные встречи' допустима как описание концепции. 'Мы гарантируем свидание' и 'У нас безопасные встречи' запрещены без реализованной механики и подтверждений. Запросить у продуктового модуля описание подбора, согласия на встречу, правил безопасности и ограничений."
  unacceptable_output: "Поскольку сервис задуман без лайков, он гарантированно организует безопасные свидания."
