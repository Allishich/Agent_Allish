schema_version: "0.2"
method_id: M03
name: "Аудитория и контекст выбора"
stage: C02
selection: base
trigger: "Всегда"
purpose: "Понять коммуникационный контекст аудитории, опираясь на продуктовый бриф и проверяемые данные; не подменять коммуникационную задачу повторной продуктовой сегментацией."
inputs:
  required: [confirmed_brief]
  optional: [available_product_outputs, relevant_evidence, user_documents, geography, period, communication_goal]
source_priority:
  - "Подтверждённый бриф и результаты продуктового модуля"
  - "Реальные материалы пользователя и исследования с известной методикой"
  - "Релевантные файлы research_data с проверенными паспортами"
  - "Доступные первоисточники и другие внешние исследования"
  - "Явно помеченные гипотезы, если доказательств нет"
procedure:
  - step: "01_define_question"
    actions:
      - "Сформулируй решение, которое изменится после исследования: кому, в какой ситуации и каким языком объяснять ценность."
      - "Выпиши из подтверждённого брифа географию, продукт, аудиторию, ситуацию выбора, период и коммуникационную цель; отсутствующее пометь unknown."
      - "Если продуктовый модуль дал сегменты, используй их как вход. Если нет — предложи только предварительные аудитории для проверки, не объявляя их подтверждёнными сегментами."
  - step: "02_check_repository_sources"
    actions:
      - "Если вопрос допускает использование российской статистики и география подходит, открой research_data/START_HERE.md и research_data/AI_CONTEXT/data_rules.md."
      - "Найди подходящий intent_id в research_data/AI_CONTEXT/routing.json. Не выбирай набор только по названию."
      - "Сопоставь candidate_dataset_ids с indexed_datasets[].dataset_id в research_data/AI_CONTEXT/manifest.json; используй repository_path, а не предположительный путь."
      - "Прочитай паспорт metadata_file.repository_path; при его отсутствии — source_catalog.repository_path и релевантный отчёт quality."
      - "Только после проверки паспорта прочитай фактические строки data_file.repository_path. Если repository_parts задан, считай части одним набором и не суммируй повторные заголовки."
      - "Если география неизвестна или не РФ, не применяй российскую статистику к целевой аудитории; отметь возможную потребность в уточнении географии через родителя."
      - "Если нет доступа к файлам, не утверждай, что данные изучены; зафиксируй недоступные пути."
  - step: "03_validate_evidence"
    actions:
      - "Для каждого показателя проверь дату, географию, генеральную совокупность, единицу наблюдения, знаменатель процента, первоисточник, статус QA и ограничения."
      - "Не смешивай людей и домохозяйства, разные годы и пересекающиеся группы; не считай интернет-пользователей автоматически пользователями конкретного сервиса."
      - "Не выводи мотивации, страхи, готовность платить или предпочтения коммуникационных каналов из общей демографической статистики."
      - "Сохраняй dataset_id, точный путь CSV, паспорт/каталог, исходную публикацию, фильтры и формулу для производных чисел."
  - step: "04_fill_decision_relevant_gaps"
    actions:
      - "Составь список пробелов, которые могут изменить сообщение, позиционирование или роль каналов; ранжируй по влиянию на решение."
      - "Если внешние источники нужны и доступен веб-поиск, сначала проверь research_data/sources/internet_sources_catalog.json, затем ищи доступные оригинальные исследования с датой, выборкой и методикой."
      - "Каталог ссылок и спецификации Mediascope не означают подключённый API или доступ к числам."
      - "Не скачивай платные, закрытые или запрещённые материалы; соблюдай лицензии. При недоступности источника укажи конкретный URL/название и что именно нужно получить, без заявления о прочтении."
      - "Если вопрос о реальных мотивах и барьерах не подтверждён данными, предложи конкретный план интервью, опроса или теста сообщений через главного агента. Не симулируй ответы людей."
      - "Если дополнительный поиск не меняет решение, остановись и объясни почему."
  - step: "05_translate_to_communication"
    actions:
      - "Для каждой рассматриваемой аудитории опиши контекст выбора, возможную задачу, язык и информационную потребность."
      - "Раздели наблюдаемые факты, обоснованные интерпретации и гипотезы."
      - "Сопоставь минимум два возможных объяснения поведения там, где данные неоднозначны."
      - "Свяжи каждый вывод с конкретным решением: сообщение, доказательство, точка контакта или вопрос для проверки."
  - step: "06_quality_gate_and_handoff"
    actions:
      - "Проверь, что выводы не выходят за охват источников и не дублируют продуктовую стратегию."
      - "Верни статус completed только при достаточных проверенных данных для поставленного вопроса; иначе partial/awaiting_data с предварительным результатом."
      - "Передай главному агенту только необходимые вопросы и product_gap_flags; не проводи прямое интервью пользователя."
      - "Даже при partial передай предварительную коммуникационную аудиторию и условия пересмотра, чтобы итоговая стратегия могла быть создана."
outputs:
  required: [question, audience_contexts, evidence_refs, findings, alternative_explanations, decision_impact, assumptions, limitations, data_requests, status]
  audience_context_fields: [audience_label, evidence_status, situation, likely_information_need, language_hypothesis, communication_implication, validation_needed]
  evidence_ref_fields: [claim, source_type, repository_path_or_url, dataset_id_if_any, publication_date_or_period, geography, population_and_denominator, qa_status, limitations]
  data_request_fields: [missing_fact, why_it_changes_decision, preferred_source_or_research, responsible_party, priority]
quality_checks:
  - "Есть ли для каждого числового вывода проверенный CSV/первоисточник и корректный знаменатель?"
  - "Не названы ли общие статистические данные доказательством мотивов пользователей?"
  - "Есть ли для каждого важного вывода влияние на коммуникационное решение?"
  - "Показано ли, что неизвестно, и как это проверить?"
  - "Не выдуманы ли источники, интервью, результаты исследований или факты о продукте?"
evidence_rules:
  do_not_fabricate_primary_research: true
  label_hypotheses: true
  no_unsupported_metrics: true
  insufficient_data: partial_or_awaiting_data
  never_assume_russia_as_default_market: true
  preserve_source_provenance: true
  no_unverified_download_or_api_claims: true
example_case:
  input: "Идея сервиса знакомств без лайков, люди сразу идут на свидания; география неизвестна"
  acceptable_output: "Предварительная аудитория: совершеннолетние люди, заинтересованные в офлайн-знакомствах (гипотеза). Нет данных, что лайки раздражают пользователей. Не применять статистику РФ без подтверждения рынка. Проверить мотивы, ожидания безопасности и понимание механики на интервью/тесте сообщений."
  unacceptable_output: "По статистике пользователи устали от свайпов, поэтому аудитория сервиса — все интернет-пользователи РФ."
