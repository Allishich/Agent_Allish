schema_version: "0.2"
method_id: M02
name: "Аудит существующих коммуникаций"
stage: C01
selection: conditional
trigger: "Есть сайт, реклама, CRM, публикации, презентации, сообщения или результаты коммуникаций, анализ которых способен изменить решение"
purpose: "Проверить фактические сообщения и точки контакта, сопоставить обещания с продуктовой реальностью и доказательствами, обнаружить противоречия и сформулировать приоритетные исправления без необоснованных причинных выводов."
inputs:
  required: [confirmed_brief]
  optional: [available_product_outputs, M01_problem_statement, communication_assets, channel_inventory, analytics, customer_feedback, relevant_evidence]
selection_gate:
  select_if:
    - "Доступны реальные коммуникационные материалы или подтверждённые результаты их использования"
    - "Аудит может изменить сообщение, канал, обещание или следующий тест"
  skip_if:
    - "Есть только идея продукта без опубликованных или подготовленных коммуникационных материалов"
  record: [selection_reason, available_assets, decision_impact]
definitions:
  asset: "Конкретный существующий коммуникационный материал с источником и датой."
  claim: "Явное или подразумеваемое обещание о продукте, результате, безопасности или отличии."
  inconsistency: "Проверяемое расхождение между сообщениями, каналами, целевыми аудиториями или подтверждённой продуктовой реальностью."
  evidence_status: "verified, partial, hypothesis, unsupported или unknown."
procedure:
  - step: "01_check_applicability"
    actions:
      - "Проверь, есть ли реальные материалы для аудита и способны ли выводы изменить коммуникационное решение."
      - "Если материалов нет, верни not_applicable с причиной и запросом на будущие материалы; не создавай фиктивный аудит."
      - "Отдели опубликованные материалы от черновиков, гипотетических примеров и сообщений, созданных в ходе текущей стратегии."
  - step: "02_inventory_assets"
    actions:
      - "Составь реестр материалов: URL или путь, канал, формат, дата, география, предполагаемая аудитория, владелец и доступность."
      - "При возможности используй исходный текст, скриншот или выгрузку; не полагайся на пересказ без отметки об ограничении."
      - "Зафиксируй период актуальности: устаревшая страница не обязательно отражает текущую стратегию."
  - step: "03_extract_messages_and_claims"
    actions:
      - "Для каждого материала выпиши ключевое обещание, поддерживающие аргументы, доказательства, призыв к действию и ожидаемое действие аудитории."
      - "Раздели фактическую цитату и аналитическую интерпретацию; сохраняй точную ссылку на источник."
      - "Отметь потенциально рискованные заявления о гарантиях, безопасности, результатах, превосходстве и доступности функций."
  - step: "04_compare_with_product_truth"
    actions:
      - "Сопоставь каждое обещание с подтверждённой стадией и функциями продукта, доступными доказательствами и ограничениями."
      - "Классифицируй утверждения как подтверждённые, условные или неподтверждённые; отсутствие подтверждения не равно доказанной ложности."
      - "Если выявлена продуктовая зависимость, передай product_gap_flag главному агенту, а не исправляй продукт коммуникационным текстом."
      - "Не обещай безопасность, результат или функцию, которых нельзя подтвердить."
  - step: "05_audit_consistency_and_accessibility"
    actions:
      - "Сравни формулировки между каналами, посадочными страницами и этапами пути; найди противоречия в механике, аудитории, ценности и действии."
      - "Проверь, понятно ли, что предлагается, кому, что делать дальше и какие ограничения есть; непонятность без пользовательской проверки пометь как гипотезу."
      - "Отдельно проверь приватность, согласие на контакт и потенциально чувствительные обещания, если применимо."
  - step: "06_review_performance_evidence"
    actions:
      - "Если доступны результаты кампаний, проверь источник, период, определения метрик, знаменатели, качество данных и сопоставимость групп."
      - "Не выводи причину низкой конверсии из одного наблюдения: возможны продуктовые, аудиторные, технические и канальные причины."
      - "Если нужны рыночные ориентиры по РФ, используй research_data/START_HERE.md, data_rules.md, routing.json, manifest.json, паспорта и исходные CSV по подходящему вопросу; общая рыночная статистика не заменяет результаты собственных коммуникаций."
      - "Каталог внешних источников не является действующим API; при недоступности данных укажи, как их получить."
  - step: "07_prioritize_fixes_and_tests"
    actions:
      - "Оцени найденные проблемы по риску неверного обещания, влиянию на понимание, распространённости, уверенности в доказательствах и стоимости исправления."
      - "Предложи конкретное действие для каждого приоритетного расхождения: исправить подтверждённую ошибку, проверить гипотезу, убрать неподтверждённое обещание или передать продуктовый вопрос."
      - "Для спорных выводов предложи проверку понимания или контролируемый тест, не выдавая её за проведённое исследование."
      - "Укажи, какие выводы передаются M07/M08 для сообщений и проверки обещаний, а какие — M11 для тестирования."
  - step: "08_quality_gate"
    actions:
      - "Проверь, что каждое существенное замечание привязано к конкретному материалу и доказательству."
      - "Раздели наблюдаемое противоречие, предполагаемую причину и рекомендуемое действие."
      - "При частичном доступе верни partial с ограничениями; при полном отсутствии материалов — not_applicable."
outputs:
  required: [question, selection_rationale, asset_inventory, claim_register, consistency_findings, product_gap_flags, evidence_refs, prioritized_actions, decision_impact, assumptions, limitations, data_requests, status]
  asset_fields: [asset_id, source_ref, channel, format, date, audience, publication_status]
  finding_fields: [asset_ids, observation, claim, evidence_status, risk, alternative_explanations, recommendation, owner_or_dependency]
  data_request_fields: [missing_asset_or_fact, why_it_matters, collection_method, priority]
quality_checks:
  - "Метод запущен только при наличии материалов?"
  - "Наблюдения подтверждены точными материалами, а не пересказами?"
  - "Обещания проверены на соответствие продуктовой реальности?"
  - "Причины результатов не выведены без достаточных данных?"
  - "Есть приоритетные действия, владельцы и способы проверки?"
evidence_rules:
  do_not_fabricate_primary_research: true
  label_hypotheses: true
  no_unsupported_metrics: true
  insufficient_data: partial_or_not_applicable
  no_fabricated_assets: true
  no_causality_without_design: true
example_case:
  input: "Есть только идея сервиса знакомств без лайков, где люди сразу идут на свидания; нет сайта, рекламы или опубликованных сообщений."
  acceptable_output: "M02 not_applicable: существующих коммуникаций нет. Не придумывать рекламные материалы, показатели или аудит; при появлении черновика лендинга можно проверить его как черновик, отдельно от действующей коммуникации."
  unacceptable_output: "Аудит выявил низкую конверсию сайта и неэффективные объявления в Telegram, поэтому необходимо переписать рекламу."
