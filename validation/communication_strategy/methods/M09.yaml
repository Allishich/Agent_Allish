schema_version: "0.2"
method_id: M09
name: "Анализ точек контакта и выбор каналов"
stage: C05
selection: base
trigger: "Всегда"
purpose: "Выбрать проверяемую комбинацию каналов и их роли на основе аудитории, контекста выбора, сообщений, ресурсов и фактических данных; не подменять доступность канала доказанной эффективностью."
inputs:
  required: [confirmed_brief]
  optional: [available_product_outputs, M03_audience_contexts, M04_barrier_hypotheses, M06_recommendation, M07_message_house, M08_allowed_wording, budget, team_capacity, geography, relevant_evidence, past_campaign_results]
definitions:
  channel: "Среда распространения коммуникации, например поисковая выдача, сообщества или партнёрства."
  touchpoint: "Конкретный момент контакта с сообщением в пользовательском пути."
  role: "Задача канала: обнаружение, объяснение, доверие, переход к действию или возвращение."
  evidence_status: "observed, inferred, hypothesis или unknown; прогноз не является измеренным результатом."
procedure:
  - step: "01_define_channel_decision"
    actions:
      - "Уточни географию, аудиторию и задачу коммуникации, этап продукта, бюджет, сроки, доступные ресурсы и измеримое действие; неизвестное пометь unknown."
      - "Возьми аудитории из M03, барьеры из M04, позицию из M06, сообщения из M07 и ограничения обещаний из M08; не повторяй сегментацию и не игнорируй запреты M08."
      - "Определи, какие точки контакта нужны: первое знакомство, объяснение механики, проверка доверия, переход к действию, возвращение. Не предполагай, что все этапы обязательны."
  - step: "02_collect_relevant_channel_evidence"
    actions:
      - "Проверь реальные результаты прошлых кампаний, данные сайта, исследования пользователей, доступность рекламных кабинетов и условия партнёрств; фиксируй период, выборку, стоимость и источник."
      - "Если география РФ и вопрос требует общего цифрового контекста, прочитай research_data/START_HERE.md и research_data/AI_CONTEXT/data_rules.md, найди intent_id digital_adoption в research_data/AI_CONTEXT/routing.json, сопоставь dataset_id с research_data/AI_CONTEXT/manifest.json, затем прочитай паспорт и фактический CSV."
      - "Используй статистику цифрового поведения только для совместимых по периоду, географии и генеральной совокупности выводов; общая доля интернет-пользователей не доказывает охват конкретного канала или готовность зарегистрироваться."
      - "Для платформенных аудиторий, стоимости размещений и форматов при наличии доступа ищи актуальные первичные публикации платформ, медиакиты, рекламные кабинеты и методологически прозрачные исследования; проверяй дату, охват и ограничения."
      - "Каталог research_data/sources/internet_sources_catalog.json и документация Mediascope — справочные маршруты, не живой API и не доступ к платным измерениям."
      - "Если данные недоступны, укажи конкретный источник, который нужен, и не выдавай ориентиры или догадки за измеренные показатели."
  - step: "03_generate_channel_candidates"
    actions:
      - "Предложи только релевантные варианты: собственные каналы, органические сообщества, партнёрства, поиск, платное размещение, офлайн-точки контакта и альтернативу без платного продвижения."
      - "Для каждого кандидата опиши предполагаемую аудиторию, точку контакта, роль, подходящее сообщение, нужное доказательство, операционные условия и зависимость от географии."
      - "Не рекомендуй Telegram, VK, блогеров или любую платформу автоматически; каждое включение обоснуй данными либо пометь как гипотезу."
      - "Если продукт существует только как идея, различай каналы проверки интереса и каналы масштабного привлечения; не предлагай масштабировать до проверки предложения."
  - step: "04_evaluate_feasibility_and_risks"
    actions:
      - "Сравни каналы по совпадению с аудиторией, роли в принятии решения, соответствию сообщению, доступности, затратам и времени команды, измеримости, ограничениям и рискам."
      - "Используй качественную матрицу с источником и уровнем доказательности каждого критерия; не выдумывай охваты, CPM, CPC, CAC, конверсии или точные бюджеты."
      - "Проверь платформенные правила, разрешённость рекламных утверждений, возрастные и приватностные ограничения, особенно для чувствительных продуктов."
      - "Отделяй гипотезу о присутствии аудитории в канале от гипотезы об эффективности коммуникации в этом канале."
  - step: "05_choose_channel_portfolio"
    actions:
      - "Выбери небольшое число приоритетных каналов с разными ролями, резервную альтернативу и явно отклонённые варианты с причинами."
      - "Для каждого приоритетного канала укажи сообщение, формат, целевое действие, ответственного, ресурсное условие, критерий остановки и зависимости."
      - "Если бюджет неизвестен, предложи сценарии low_resource и funded как условные варианты, не придумывая доступную сумму."
      - "Объясни, как выбранные каналы дополняют друг друга и где возможен дублирующий охват; не суммируй аудитории без проверки пересечений."
  - step: "06_design_validation"
    actions:
      - "Для неопределённых каналов предложи ограниченный пилот с одинаково определённым целевым действием и понятной базой сравнения."
      - "Определи метрики по роли: понимание, качественный интерес, переход, регистрация или другое доступное наблюдаемое действие; отдельно следи за ложными ожиданиями и вредом."
      - "Укажи события и правила отслеживания, период наблюдения, условия прекращения и критерий пересмотра; не обещай статистическую значимость без обоснованной выборки."
      - "Если нет работающего продукта, измеряй интерес и понимание концепции, а не называй намерение регистрацией или доказанным спросом."
  - step: "07_handoff_and_quality_gate"
    actions:
      - "Передай M10 при необходимости точки контакта и переходы, M11 — проверяемые гипотезы и метрики, главному агенту — продуктовые зависимости и запросы данных."
      - "Для каждого рекомендованного канала проверь: зачем он нужен, для кого, какое сообщение разрешено, чем обоснован выбор и как проверить эффект."
      - "Если данных недостаточно, верни partial с условным портфелем каналов и конкретными запросами вместо фиктивных прогнозов."
outputs:
  required: [question, audience_and_goal, touchpoint_map, channel_candidates, evidence_refs, comparison, recommended_portfolio, rejected_options, pilot_plan, decision_impact, assumptions, limitations, data_requests, status]
  channel_fields: [channel, audience, touchpoint, role, message_ref, evidence_status, source_refs, cost_and_resource_conditions, measurement_method, risks]
  portfolio_fields: [priority, channel, role, message, target_action, owner_or_dependency, success_signal, stop_or_revisit_condition]
  data_request_fields: [missing_fact, why_it_changes_decision, exact_source_or_collection_method, responsible_party, priority]
quality_checks:
  - "Каждый канал привязан к аудитории, точке контакта и задаче?"
  - "Цифровая статистика не выдана за доказательство эффективности платформы?"
  - "Все числа имеют источник и совместимые знаменатели?"
  - "Портфель учитывает бюджет, время команды и ограничения обещаний M08?"
  - "Есть проверяемый пилот, альтернатива и условие пересмотра?"
evidence_rules:
  do_not_fabricate_primary_research: true
  label_hypotheses: true
  no_unsupported_metrics: true
  insufficient_data: partial
  no_assumed_platform_effectiveness: true
  never_treat_market_reach_as_conversion: true
example_case:
  input: "Только идея сервиса знакомств без лайков с фокусом на встречах; аудитория, рынок, бюджет и механика пока не подтверждены."
  acceptable_output: "Не выбирать платформу победителем без данных. Предложить условные малые пилоты: интервью и тест объяснения концепции в доступных релевантных сообществах, партнёрские контакты при наличии доступа, простая страница с прозрачным описанием идеи. Проверять понимание и качественный интерес; не прогнозировать CAC и не обещать свидания."
  unacceptable_output: "Telegram гарантирует лучший охват целевой аудитории, CAC составит 200 рублей, а конверсия в свидание — 15%."
