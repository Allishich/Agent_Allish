protocol_version: "0.1"
module_id: communication_strategy
role:
  parent_agent:
    owns: [initial_user_interview, brief_confirmation, user_communication, stage_approval, product_module_orchestration, final_document]
  communication_module:
    owns: [communication_diagnosis, method_selection, communication_stage_results, communication_strategy_draft, product_gap_flags]
  product_module:
    owns: [product_research, product_choices, economics, product_strategy_outline]
input:
  source: parent_agent
  required: [case_id, confirmed_brief, product_strategy_outline]
  optional: [product_stage_results, existing_communications, audience_research, constraints]
  envelope: validation/communication_strategy/contracts.json#/$defs/module_request
  common_intake_mapping: validation/common_intake/brief_mapping.yaml#communication_strategy
  confirmed_brief_source: cases/{case_id}/brief.json
  confirmed_brief_schema: validation/common_intake/brief.schema.json
  confirmed_brief_format: full_original_json_object
  not_accepted_as_confirmed_brief: communication_context
  product_strategy_outline_source: cases/{case_id}/product_strategy/results/product_strategy_outline.json
  product_strategy_outline_format: original_verified_object_or_null
  identity_checks: [request_case_id_matches_brief_case_id, product_outline_case_id_matches_when_available]
  revision_checks: [brief_revision_is_in_brief, expected_revision_is_communication_module_state_revision]
  unknown: "null с объяснением, не выдумывать"
interaction:
  invocation_only_by_parent: true
  request_schema: contracts.json#/$defs/module_request
  response_schema: contracts.json#/$defs/module_response
  method_record_schema: contracts.json#/$defs/method_record
  stage_record_schema: contracts.json#/$defs/stage_record
  case_state_schema: contracts.json#/$defs/case_state
  strategy_schema: contracts.json#/$defs/strategy
  validate_native_result_with: methods/Mxx.yaml#outputs.required
  user_questions_via_parent: true
  no_direct_modification_of_other_modules: true
output:
  artifact: communication_strategy_draft
  return_to: parent_agent
  always_produce_strategy: true
  if_product_gap: "Сообщить ограничение и зависимость; не обещать неподтверждённые свойства"
storage_ownership:
  shared_user_brief: cases/{case_id}/brief.json
  shared_user_brief_access: read_only
  own_namespace: cases/{case_id}/communication_strategy/
  own_state: cases/{case_id}/communication_strategy/state.json
  own_method_results: cases/{case_id}/communication_strategy/results/methods/
  do_not_write_product_strategy_namespace: true
integration_status: "Формат передачи common_intake → communication_strategy согласован декларативно и проверяется по двум схемам; отдельное runtime-исполнение и постоянное хранилище остаются неподтверждёнными"
integration_mode:
  parent_instruction_entrypoint: AGENTS.md
  module_entrypoint: validation/communication_strategy/MODULE.md
  request_contract: validation/communication_strategy/contracts.json
  runtime_invocation_verified: false
  common_intake_adapter_specified: true
  common_intake_adapter_runtime_verified: false
  persistence_verified: false
  fallback: "Главный агент применяет инструкции выбранных методов вручную, фиксирует режим manual, отдаёт артефакты с saved=false при отсутствии хранилища"
  preconditions:
    - "Бриф подтверждён пользователем; неизвестные и происхождение сведений сохранены"
    - "Продуктовые результаты передаются только при наличии и с пометкой их статуса"
  parent_gate: "После каждого C01–C06 показать результат и получить подтверждение до следующего этапа"
  no_cross_module_changes: true
