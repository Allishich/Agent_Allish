protocol_version: "0.1"
module_id: communication_strategy
role:
  parent_agent:
    owns: [initial_user_interview, brief_confirmation, user_communication, stage_approval, product_module_orchestration, final_document]
  communication_module:
    owns: [communication_diagnosis, method_selection, communication_stage_results, communication_strategy_draft, product_gap_flags]
  product_module:
    owns: [product_research, product_choices, economics, product_strategy_outline]
input:
  source: parent_agent
  required: [case_id, confirmed_brief]
  optional: [product_strategy_outline, product_stage_results, existing_communications, audience_research, constraints]
  unknown: "null с объяснением, не выдумывать"
interaction:
  invocation_only_by_parent: true
  request_schema: contracts.json
  response_schema: contracts.json
  user_questions_via_parent: true
  no_direct_modification_of_other_modules: true
output:
  artifact: communication_strategy_draft
  return_to: parent_agent
  always_produce_strategy: true
  if_product_gap: "Сообщить ограничение и зависимость; не обещать неподтверждённые свойства"
integration_status: "Инструкционный маршрут добавлен в корневой AGENTS.md; отдельный исполняемый модуль, адаптер common_intake и постоянное хранилище не подтверждены и не реализованы этой правкой"
integration_mode:
  parent_instruction_entrypoint: AGENTS.md
  module_entrypoint: validation/communication_strategy/MODULE.md
  request_contract: validation/communication_strategy/contracts.json
  runtime_invocation_verified: false
  common_intake_adapter_verified: false
  persistence_verified: false
  fallback: "Главный агент применяет инструкции выбранных методов вручную, фиксирует режим manual, отдаёт артефакты с saved=false при отсутствии хранилища"
  preconditions:
    - "Бриф подтверждён пользователем; неизвестные и происхождение сведений сохранены"
    - "Продуктовые результаты передаются только при наличии и с пометкой их статуса"
  parent_gate: "После каждого C01–C06 показать результат и получить подтверждение до следующего этапа"
  no_cross_module_changes: true
