name: Agent_Allish validation tests
on:
  pull_request:
    paths:
      - 'validation/**'
      - '.github/workflows/agent-validation.yml'
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  validator-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'jsonschema>=4' 'PyYAML>=6'
      - run: python -m unittest discover -s validation/tests -v
      - run: python validation/communication_strategy/tests/validate_contracts.py
